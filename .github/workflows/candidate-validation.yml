name: Candidate eval validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  # Keep this distinct from the pull_request_target policy workflow so the two
  # required-check pipelines cannot cancel each other for the same PR.
  group: candidate-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-validate:
    name: content-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - name: Check out candidate as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install trusted validator dependencies
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        working-directory: trusted
        run: npm ci --ignore-scripts
      - name: Validate community candidate with base-branch code
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        run: node trusted/scripts/validate.mjs candidate
      - name: Validate maintainer candidate
        if: github.event.pull_request.user.login == '502399493zjw-lgtm'
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npm run validate
