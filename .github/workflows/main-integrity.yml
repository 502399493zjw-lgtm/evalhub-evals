name: Main eval integrity

# The PR gates (candidate-validation, pr-policy) only ever see one candidate
# against its own base. Two PRs that are independently green can still combine
# into a broken main. This workflow re-runs the content validator against main
# itself. It treats eval packages as inert data and never executes third-party
# runners.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Distinct from candidate-eval-* and protected-eval-* so a merge never cancels
  # the PR checks it just satisfied. Not cancel-in-progress: every main commit
  # keeps its own verdict, otherwise a superseded run leaves a silent gap.
  group: main-eval-integrity
  cancel-in-progress: false

jobs:
  main-integrity:
    name: main-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate merged content
        run: npm run validate
