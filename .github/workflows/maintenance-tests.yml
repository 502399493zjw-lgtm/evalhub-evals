name: Repository maintenance tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: maintenance-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maintenance-tests:
    # pr-policy permits repository maintenance only from the maintainer. Keep
    # untrusted candidate scripts inert even before that separate check finishes.
    if: github.event_name == 'push' || github.event.pull_request.user.login == '502399493zjw-lgtm'
    name: maintenance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository maintenance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test validator, policy, schema, and vendor maintenance
        run: npm run test:maintenance
