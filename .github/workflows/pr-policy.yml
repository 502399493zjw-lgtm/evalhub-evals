name: Protected eval contribution

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: protected-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is trusted only because this job checks out and
      # executes the base commit. It never executes the candidate checkout.
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Enforce actor and changed-path policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/scripts/pr-policy.mjs

  content-validate:
    name: content-validate
    needs: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - name: Check out candidate as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install trusted validator dependencies
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        working-directory: trusted
        run: npm ci --ignore-scripts
      - name: Validate community candidate with base-branch code
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        run: node trusted/scripts/validate.mjs candidate
      - name: Test maintainer candidate
        if: github.event.pull_request.user.login == '502399493zjw-lgtm'
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npm test
          npm run validate

  runner-sandbox:
    name: runner-sandbox
    needs: [pr-policy, content-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted sandbox launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - name: Check out candidate for isolated execution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install trusted sandbox dependencies
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        working-directory: trusted
        run: npm ci --ignore-scripts
      - name: Execute community runner in locked container
        if: github.event.pull_request.user.login != '502399493zjw-lgtm'
        run: node trusted/scripts/runner-sandbox.mjs candidate --dependency-root trusted
      - name: Install maintainer candidate dependencies
        if: github.event.pull_request.user.login == '502399493zjw-lgtm'
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Execute maintainer runner in locked container
        if: github.event.pull_request.user.login == '502399493zjw-lgtm'
        run: node candidate/scripts/runner-sandbox.mjs candidate --dependency-root candidate
