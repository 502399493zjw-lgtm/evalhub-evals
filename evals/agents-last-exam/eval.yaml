id: agents-last-exam
protocol_revision: 1
name: Agents’ Last Exam（ALE）智能体综合能力评测
category: useful
description: Agents’ Last Exam 以 152 个跨领域、可执行的真实任务评估 Agent；本包只转换已完成的上游结果，不执行评测。
hook_title: 152 个真实任务，Agent 能完成多少
upstream:
  repo: rdi-berkeley/agents-last-exam
  commit: 75a3f866535946b67f9a57e4f158eb30ad50be8a
references:
  homepage: https://agents-last-exam.org/
  repository: https://github.com/rdi-berkeley/agents-last-exam
dimensions: [代码, 推理]
interface: agent
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: required
baseline_policy: required
score_unit: 分
leaderboard: latest_session
scoring_note: >-
  全量固定为 152 个任务，每题只取该任务上游 eval_result.json 的有限数值 score（0–1）。主成绩为所有 152 个值的算术平均 × 100；上游失败、缺失、非数值或无效结果计 0。pack-to-result.mjs 只验证提交清单和证据摘要并打包，不运行 Agent、ALE、Docker、虚拟机、测试或网络下载。
command_template:
  argv: [node, evals/agents-last-exam/pack-to-result.mjs, "{input}", --out, "{output}"]
  output: agents-last-exam-result.json
trials: 1
