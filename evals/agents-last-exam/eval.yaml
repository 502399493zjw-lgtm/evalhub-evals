    ## 关于此评测

    ### 范围与固定版本

    本提交以官方 GitHub 仓库的 commit `75a3f866535946b67f9a57e4f158eb30ad50be8a` 为准，完整范围是 `selected_tasks/full/overall.txt` 中的 152 个 task ID。EvalHub 只展示 5 个等距抽取的题面案例；这不缩小提交或评分范围。

    ### 评分与提交协议

    主成绩 = 152 个任务的 `eval_result.json.score` 之和 / 152 × 100。缺失、非数值、失败或无效任务均按 0 处理。提交者先在自己的合规基础设施上运行未改动的上游 ALE；本目录中的轻量转换器只验证 152 个固定任务 ID 及其证据哈希，然后写入聚合分数，不执行 ALE。

    官方快照使用 `upstream_author_publication` 基线。59 条官方来源记录中，有 45 条可映射到 EvalHub 注册模型；其余 14 条因没有可验证的注册模型 ID 而写入 omitted_models。对于同名但不同 harness/variant 的未注册行，省略标签显式保留该来源身份，避免合并或伪造 canonical ID。

    ### 限制

    官方榜单是外部评测快照，运行环境、harness、模型版本、成本口径和完成率并不完全一致；成绩仅适用于该公开配置。外部提交仍由评测作者核验上游 run 与证据。

    ## 题目案例

    以下五题按完整 152 题清单的第 1、39、77、115、152 个位置等距抽取。英文原文来自固定 commit 的 task_card.json；中文为忠实翻译。

