    ## 关于此评测

    ### ALE 是什么

    Agents’ Last Exam（ALE）是 Berkeley RDI 与 RDI Foundation 牵头的智能体评测框架，目标是把具有经济价值的真实专业工作带入可验证的评测。上游将任务组织为 13 个行业簇、55 个子领域：智能体面对的不是单一问答，而是带有真实软件、文件和工作流程的专业任务。

    ALE 评估的是一套 **agent system**，而不只是底层模型。被测对象由模型、Harness、工具、记忆与可能的子智能体共同组成；它在 Windows 或 Linux 沙箱中读取任务说明、操作文件或软件，并提交最终产物。因此，同一模型搭配不同 Harness / variant 的成绩会被视为不同的官方运行记录。

    ### 任务如何被判分

    每道任务都规定输入、输出和成功条件。智能体完成工作后，ALE 才将隐藏参考答案或检查逻辑交给确定性 grader，对输出产物给出 0–1 的 `score`；参考答案不会在运行前暴露给智能体。这个设计使评测关注“工作是否真正完成”，而非仅比较文字回答。

    本提交采用 full split：固定版本中 152 个任务的默认 variant `0`。主分为 152 个任务分数的算术平均 × 100；缺失、失败、非数值或无效结果均按 0 计。下方五道案例只是帮助理解题型的等距样本，不改变完整评分范围。

    ### 如何阅读榜单

    榜单的一行对应一次公开的「模型 × Harness × variant」运行，而不是把同名模型的不同配置合并。主分适合比较该公开配置下的总体任务完成度；“官方分项结果”同时给出完成题数、通过数、耗时、token 与公开成本，阅读时应结合这些覆盖和资源信息判断结果。

    模型列优先展示 EvalHub 注册表名称；没有可验证注册 ID 的来源记录保留官方名称并标为“未注册”。这避免把名称相似但身份或运行配置不同的条目强行映射到同一个模型。

    ### 范围、复现与限制

    本包固定到官方 GitHub commit `75a3f866535946b67f9a57e4f158eb30ad50be8a`，以 `selected_tasks/full/overall.txt` 中的 152 个 task ID 为准。真实 ALE 运行发生在提交者自行管理的合规环境中，可能需要云端 VM、镜像、模型凭据与相应权限；EvalHub 中的轻量转换器只核验 152 项结果摘要及证据哈希并计算聚合分数，不启动 Agent、虚拟机、容器、测试或下载任务资源。

    本页的官方榜单是 2026-08-19 取得的外部公开快照，不代表 EvalHub 已重新运行或背书任何一条记录。不同条目的运行环境、Harness、模型版本、成本口径和完成率可能不同，成绩只适用于各自公开配置；外部提交仍应由评测作者核验上游 run 与证据。

    ## 题目案例

    以下五题按完整 152 题清单的第 1、39、77、115、152 个位置等距抽取。英文原文来自固定 commit 的 task_card.json；中文为忠实翻译。

    ### agriculture_env/crop_rotation_d02

    #### 题目原文

    ```text
    You are auditing crop rotation eligibility for stable agricultural parcels in France.

    Task directory:
    - `base`

    Visible inputs:
    - Parcel GeoPackage: `base\input\seq1524_d02.gpkg`
    - Task brief: `base\input\task_prompt.md`
    - Citation note: `base\input\citation.txt`
    - Optional Python runtime manifest:
      - `base\input\runtime_env\pyproject.toml`
      - `base\input\runtime_env\uv.lock`
      - `base\input\runtime_env\requirements.txt`
    - Software note: `base\software\README.txt`

    Optional Python runtime:
    - Use `base\software\python_geo.bat` if you want the benchmark-provisioned geospatial Python stack (pinned `numpy`, `pandas`, `geopandas`, `shapely`, `pyogrio`, `fiona`, `pyproj`).
    - The package manifest is visible at `base\input\runtime_env\pyproject.toml` if you prefer to build your own environment.

    Your task:
    1. Read `base\input\task_prompt.md` and follow it exactly.
    2. Load the input layer `seq1524_d02` from `base\input\seq1524_d02.gpkg`.
    3. Produce these two GeoPackages under `base\output`:
       - `eligible_units.gpkg`
       - `flagged_units.gpkg`
    4. Use exact layer names:
       - `eligible_units`
       - `flagged_units`

    Rules:
    - Do not modify files under `input/`.
    - Preserve the input geometry and original columns exactly as required by the task brief.
    - Keep the output CRS as EPSG:2154.
    - Write final outputs only under `base\output`.
    ```

