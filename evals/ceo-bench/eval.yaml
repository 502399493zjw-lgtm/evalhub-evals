id: ceo-bench
protocol_revision: 1
cover: assets/cover.webp
name: CEO-Bench（500 天 SaaS 经营长跑）
category: useful
description: >-
  CEO-Bench 让 Agent 当 NovaMind AI 的 CEO，用 100 万美元起始现金连续经营 500 个模拟日：定价、投放、促销、
  基础设施扩容、研发立项、企业客户多轮议价全部由它自己决定，时间以周为单位推进，每周可以任意次调用 34 个业务动作、
  查询 19 张业务数据库表，还必须交出本周决策理由和四个时间尺度的现金预测。真正的难点是长线经营本身：客户期望会随
  竞品事件不可逆地上移，26 个客群里有 20 个要先花钱做市场调研才能发现，企业客户 7 天不回复就永久流失，
  现金一旦为负立刻破产结束。主成绩是最佳运行的结束现金（USD），同分时先看存活天数。
hook_title: 给 Agent 100 万美元和 500 天，它能把公司经营成什么样
upstream:
  repo: zlab-princeton/ceobench-src
  commit: d2b7b32e5301a571b77f5f68bd1032adbcd5b464
  paper: https://arxiv.org/abs/2606.18543
references:
  homepage: https://ceobench.com
  repository: https://github.com/zlab-princeton/ceobench-src
  paper: https://arxiv.org/abs/2606.18543
dimensions: [经营, 推理]
interface: agent
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: required
baseline_policy: required
score_unit: USD
tiebreak:
  metric: tiebreak_value
  order: desc
  label: 存活天数
scoring_note: >-
  参赛 Agent 必须在钉死到 commit d2b7b32e 的上游模拟器里跑 3 次相互独立的运行，每次固定 500 个模拟日、
  100 万美元初始现金、seed=42、scenario=default，这四项不接受任何覆盖（上游 run_test.py 默认 --days 3650，
  必须显式传 --days 500）。每次运行记录存活天数、是否破产、结束现金、Agent 实际操作轮数与证据包 sha256。
  主成绩取三次运行中的最佳运行结束现金：最佳运行先比存活天数，再比结束现金，与上游榜单的 best-run 口径一致；
  三次全部破产时主成绩记 0，不用负现金参与排名。转换器只在结构、协议边界、数值范围与上游终止语义全部合法时
  确定性写出数值 score，不产生 null：破产运行必须 days_survived < 500 且结束现金为负，完成运行必须
  days_survived == 500 且结束现金不为负，这是上游「现金为负即刻结束」这一唯一破产触发条件的直接投影。
  scored_by=author 表示外部提交仍须由评测作者核对证据包、运行日志与 harness 配置后才认可；
  证据不可信、协议不符或三次运行不齐即转换失败，不豁免、不重试补分。
command_template:
  argv: [node, evals/ceo-bench/pack-to-result.mjs, "{input}", --out, "{output}"]
  output: ceo-bench-result.json
trials: 3
detail_profile:
  source_kind: upstream_publication
  overview_note: >-
    下面的机制说明来自 CEO-Bench 论文（arXiv:2606.18543，v1 2026-06-16、v2 2026-07-22）、官方站点 ceobench.com
    与钉死在 commit d2b7b32e 的作者仓库；各模型的官方成绩来自 ceobench.com 2026-08-09 的快照
    （sha256 97475ea055b55a7b83d7917cc6b8defaab82f3fdeaf216b16ef8c54e8f31b292）。
  summary:
    plain_language: >-
      被评的不是答一道题，而是把一家公司连续经营 500 个模拟日。Agent 接手 NovaMind AI 这家 B2B/B2C 的 AI SaaS 公司，
      手里有 100 万美元现金，要自己决定各档套餐怎么定价、五个广告渠道分别投给哪些客群、促销给多少、
      算力买到哪一档、研发投多少钱和立哪些项目，以及跟企业客户一轮一轮谈价。时间以周为单位推进，
      每周可以任意次调用工具、查数据库，想好了再进入下一周。现金余额就是分数，现金一旦为负，这次运行立刻结束。
    why_it_matters: >-
      单题评测衡量的是一次答得对不对，长线经营衡量的是几百个决策累积之后公司还在不在。这里没有正确答案可背：
      客户期望会因为竞品事件不可逆地上移，广告效果、研发周期、故障都是随机的，
      现金流要同时兼顾扩张与安全边际。它检验的是 Agent 能不能在部分可观测、长反馈、有不可逆失败的环境里
      持续做决策，而不是能不能一次给出漂亮答案。
  method_steps:
    - title: 钉死同一个世界
      description: >-
        所有运行使用同一份模拟器：500 个模拟日、100 万美元初始现金、seed=42、scenario=default。
        Agent 不能修改模拟器、经济参数或评分逻辑，只能通过公开的业务动作影响世界。
    - title: 每周决策，轮数不限
      description: >-
        时间按周推进（每步 7 个模拟日）。一周之内 Agent 可以任意次调用 34 个业务动作、查询 19 张业务 SQL 表，
        自己决定何时进入下一周。上游按「每周平均操作轮数」记录这种探索强度。
    - title: 先发现市场，再经营市场
      description: >-
        初始只有 6 个完全已知的客群（个人 S1–S3、企业 E1–E3），另外 20 个客群（个人 D_S01–D_S10、
        企业 D_E01–D_E10）必须靠付费市场调研发现：research_market 每次 25000 美元、30% 概率随机发现一个客群，
        再用 research_group 把信息等级从 1 升到 5（精度从 ±65% 收窄到 ±5%）。
    - title: 在随机与不可逆之间权衡
      description: >-
        研发项目的周期与质量增益从正态分布采样，竞品事件按对数正态分布抬高全体客群的质量期望且不可逆，
        故障与客户投诉按伯努利与泊松过程发生。定价过高、质量跟不上期望的潜客当场永久流失，
        企业客户 7 天内没收到回复即永久流失或解约。
    - title: 每周交理由和现金预测
      description: >-
        进入下一周必须提交本周决策理由，以及 1 周、4 周、12 周、26 周四个尺度的现金预测，
        每个尺度给点估计加 95% 置信区间上下界，且必须满足 lower ≤ point ≤ upper。
        理由与预测被记录下来供分析，不参与计分。
    - title: 三次运行取最佳
      description: >-
        每个模型跑 3 次相互独立的运行。主成绩取最佳运行的结束现金，最佳运行先比存活天数再比结束现金。
        现金为负是唯一的破产触发条件，触发即刻结束该次运行。
  score_interpretation: >-
    主成绩是最佳运行结束时的现金余额，单位是美元，越高越好，没有理论上限（官方给出的现金上界估计是 22 亿美元，
    远高于任何已公布成绩）。它衡量的是 500 天累积经营结果，而不是单次决策质量：同一个模型三次运行之间的差异可以很大，
    所以官方同时公布破产次数与存活天数。同分时按存活天数降序排。参照线有两条：初始现金 100 万美元，
    低于它说明 500 天净烧钱；官方规则基线（rule-based baseline）15,756,408 美元，
    它是一套固定策略脚本的成绩，高于它才说明模型的经营决策确实优于死板规则。三次运行全部破产时主成绩记 0。
  key_facts:
    - value: 500 个模拟日
      label: 单次运行的经营长度
      description: 约 71 周、1.37 年，时间按周推进，每步 7 个模拟日。
      source_url: https://arxiv.org/abs/2606.18543
    - value: $1,000,000
      label: 起始现金，也是唯一的生存底线
      description: 现金余额既是分数也是存续条件，现金为负即刻破产结束该次运行。
      source_url: https://github.com/zlab-princeton/ceobench-src/blob/d2b7b32e5301a571b77f5f68bd1032adbcd5b464/src/saas_bench/config.py
    - value: 34 个动作 / 19 张表
      label: 每周可无限次调用的业务动作与可查数据库表
      description: 动作分 8 类，覆盖定价、投放、研发、扩容、企业销售、市场调研与公开发声。
      source_url: https://ceobench.com
    - value: 26 个客群
      label: 6 个初始已知 + 20 个需付费调研发现
      description: 个人 S1–S3、企业 E1–E3 完全已知；D_S01–D_S10 与 D_E01–D_E10 需 research_market 逐个发现。
      source_url: https://github.com/zlab-princeton/ceobench-src/blob/d2b7b32e5301a571b77f5f68bd1032adbcd5b464/src/saas_bench/config.py
    - value: 3 次运行
      label: 每个模型的运行次数，取最佳运行计分
      description: 最佳运行先比存活天数再比结束现金；官方同时公布破产次数与存活天数均值。
      source_url: https://ceobench.com
    - value: $15,756,408
      label: 官方规则基线的最佳运行现金
      description: 一套固定策略脚本的成绩，高于它才说明模型决策优于死板规则。
      source_url: https://ceobench.com
  caveats:
    - title: 三次运行方差很大，单一名次不代表稳定能力
      description: >-
        官方数据里同一模型三次运行的差异可以非常大：榜首 Kimi K3 最佳运行 22,148,357 美元、最长存活 500 天，
        但三次里有 1 次破产、平均存活 386.0 ± 161.2 天。破产次数与存活天数均值必须和最佳运行现金一起读，
        只看主成绩会高估稳定性。
    - title: 主成绩是最佳运行，不是平均表现
      description: >-
        上游口径取三次中的最佳运行，因此它衡量的是「最好一次能做到多好」。
        平均值、方差、破产率都作为解释信息展示，不参与排名。
    - title: 结果依赖上游模拟器与随机种子
      description: >-
        全部成绩都绑定 commit d2b7b32e 的模拟器实现与 seed=42、scenario=default。
        上游改动经济参数、客群配置或事件分布后，新旧成绩不可直接比较。
    - title: 官方页面与散文叙述存在两处不一致
      description: >-
        Claude Fable 5 的最佳运行现金在榜单表里是 12,630,078 美元，站内散文写作 $12.63M；
        Kimi K3 的散文提到「第三次运行在第 158 天破产」，与表中 1/3 破产、最长存活 500 天并不矛盾但粒度不同。
        本目录一律采用榜单表的数值，不做平均或推断。
    - title: 上游未授予开源许可，成绩为来源转录
      description: >-
        作者仓库 zlab-princeton/ceobench-src 没有 LICENSE 文件，GitHub API 也未识别出许可证；论文在 arXiv 以
        CC BY 4.0 发布。本目录因此只转录公开数值与协议描述，不搬运上游数据集、轨迹、数据库或产物。
        所有官方成绩均为上游作者发表值的转录，不是 EvalHub 独立复跑，EvalHub 也未获得上游认证或背书。
    - title: 复现需要参赛方自己的基础设施
      description: >-
        模拟器依赖 SQLCipher 数据库与上游 Python 依赖，Agent 还要调用自己的模型，无法在本仓库的无网络只读沙箱里运行。
        因此本评测以 external_workflow 方式提交：运行发生在参赛方自己的环境，仓库内的转换器只负责校验与出分。
  overview_tables:
    - id: action-space
      label: 动作空间
      title: Agent 每周可调用的 8 类业务动作
      note: >-
        译自 ceobench.com 2026-08-09 快照的 action-space 表，未增删行列；工具名是代码标识符，保留上游原文以便对照。
      caption: 一周之内这些动作可以任意次调用，Agent 自己决定何时进入下一周。
      source_url: https://ceobench.com
      columns:
        - { id: category, label: 动作类别 }
        - { id: actions, label: 可做的事 }
        - { id: tools, label: 示例工具 }
      rows:
        - id: database-query
          cells:
            - column_id: category
              value: 数据库查询
            - column_id: actions
              value: 查询 19 张业务 SQL 数据库表并做数据分析
            - column_id: tools
              value: query
        - id: pricing
