      # 模拟器说明

      本文档说明 NovaMind SaaS 业务模拟器如何运作。理解这些机制有助于你做出更好的决策。

      ## 概览

      你是 NovaMind AI 的 CEO，这是一家 B2B/B2C 的 AI SaaS 公司。你的目标是在 {total_days} 个模拟日（{total_weeks} 周 / {total_years} 年）里把现金最大化。时间以周为增量推进（每步 7 天）。你负责定价、开支、基础设施、研发与企业销售。

      > **你的目标：** 在 {total_weeks} 周里把现金最大化。现金 = 你的分数。

      ## 客户细分

      ### 初始细分（6 个客群，完全已知）
      - **S1、S2、S3**：个人客户（小微企业）—— 从价格敏感型到质量导向型
      - **E1、E2、E3**：企业客户 —— 从入门级到大型企业

      ### 可发现细分（20 个客群，初始隐藏）
      - 10 个个人（D_S01–D_S10）+ 10 个企业（D_E01–D_E10）
      - 通过 `research_market()` 发现 —— 每次 2.5 万美元，30% 概率，立刻随机发现一个客群
      - 信息等级 1–5，精度逐级提升（±65% → ±5%）
      - 用 `research_group()` 提升信息等级（等级越高花费越多，且需要多天）

      ## 客户获取

      新客户通过以下几种渠道加入：

      **广告与市场营销：**
      - 5 个广告渠道：social_media、search_ads、linkedin、content_marketing、referral_program
      - 每个渠道对各客群的有效性不同 —— 有效性数值决定在该渠道对该客群每花 1 美元能拿到多少潜客
      - `ads_strength` 是广告有效性的乘数（默认 1.0）—— 提高它可以放大全部广告开支带来的潜客生成
      - 应用内广告按订阅者产生每日收入（与广告强度 × 席位数成正比），但会拉低感知质量 —— 这是收入与质量的取舍。通过 `set_ads_strength` 设置
      - 所有广告开支都按（渠道，客群）粒度设置，用 `set_targeted_ad_spend({channel: {group: $/day}})`。没有总广告预算 —— 每一美元都必须分配到具体的渠道与客群。
      - `set_daily_spend` 只管 `operations` 与 `development`（不含广告）。

      **促销：**
      - 提供折扣以吸引新潜客或留住现有订阅者
      - 潜客促销降低新客户看到的实际价格，提高转化率
      - 持续促销在每个计费周期重复打折
      - 两者都可以全局设置或定向到特定客群，用 `set_promotion` 与 `set_lead_promotion`

      **网络效应（跨客群推荐）：**
      - 现有订阅者以可测量的速率产生口碑推荐
      - 每个来源客群的订阅者以特定速率在目标客群里产生潜客（在中性声誉下，每订阅者每天产生的潜客数）
      - 例如：若速率为 0.005，则 1000 个订阅者在该目标客群里每天产生约 5 个潜客
      - 只有已发现的客群参与跨客群网络效应
      - 用 `get_group_insights()` 查看客群之间的推荐速率（显示为「每 1000 订阅者每天的潜客数」）

      **声誉（跨客群情绪扩散）：**
      - 优质服务积累声誉；故障、投诉、取消订阅会损害声誉
      - 声誉直接影响新客获取速度 —— 声誉越高，潜客转化越多、到达越快；负面声誉会压制潜客流入
      - 声誉会在相关客群之间扩散 —— 不只局限于同一个客群
      - 企业客户解约或负面社交媒体贴文会损害相邻企业客群的声誉
      - 满意客户的正面评价会提升相关客群的声誉
      - 用 `get_group_insights()` 查看客群之间的声誉影响权重

      **市场容量：**
      - 每个客群都有市场容量（可触达客户上限）。订阅者接近上限时获客变慢。容量会随时间增长。

      ## 订阅与留存机制

      ### 套餐选择
      每个客户都有自己的质量—价格曲线：
      - 价格低时 → 只要求一般的质量
      - 价格高时（接近预算上限）→ 要求的质量越来越高
      - 只有当至少一个套餐在该价位上交付的质量高于客户期望时，客户才会订阅
      - 如果没有套餐满足期望 → 永久离开（客户流失）

      **潜客评估在到达时就发生。** 每个新潜客要么：
      1. **订阅** —— 如果至少有一个套餐符合他的质量—价格曲线
      2. **永久流失** —— 如果没有可接受的套餐。他们不会重试，也不会以后再回来。

      *潜客获取成本：* 每个新潜客（来自广告或自然流量）都产生 0.5 美元的固定引导成本，与广告开支分开计费 —— 估算每日消耗时要把它算进去。

      ### 质量构成
      **交付质量 =（base_product_quality + q_shared + q_group_bonus）× tier_multiplier + 惩罚项**

      - 模型档位：作为产品质量的乘数（Tier 1=0.60×、Tier 2=0.75×、Tier 3=0.90×、Tier 4=1.00×、Tier 5=1.10×）
      - base_product_quality：初始产品质量（0.20）
      - q_shared：来自开发投入的共享质量加成（随开发开支增长）
      - 过载惩罚：当使用量超过容量时
      - 故障惩罚：故障期间质量显著下降
      - 每客群质量加成：来自定向开发开支，累计生效（停止投入后仍然保留）

      ### 质量动态
      - 开发开支改善质量：全局改善 = 0.0045 × ln(1 + global_spend/5000)，定向的每客群改善 = 0.0225 × ln(1 + targeted_spend/5000)（系数为 5 倍，与全局叠加）
      - 客户的期望质量会随时间向上漂移（全局漂移 + 每客群漂移）
      - 竞品事件随机发生，会抬高所有客群的客户质量期望 —— 这是永久性的向上位移，无法逆转，只能靠开发开支或研发突破来抵消。不同客群对同一个竞品事件的反应幅度不同（有些客群对趋势高度敏感；另一些 —— 例如受合规约束的企业 —— 几乎不动），因此你名下各客群的期望差距会不均匀地扩大。竞品活动可以在社交媒体信息流（`get_social_posts`）里看到，你可以在那里监控对手的发布与公告。
      - 研发档位提供永久质量提升（10 个相互独立的档位）

      ### 流失与套餐变更
      - 每个客户每 30 天进行一次计费评估
      - 客户重新评估：当前套餐是否仍然满足他在该价位上的质量期望？
      - 如果不满足 → 可能降级、换套餐或取消
      - 满意度影响流失概率
      - 未解决的问题会随时间损害满意度
      - 任期忠诚（黏性加成）：订阅时间越长的客户会获得一个随 `ln(1 + months_subscribed)` 增长的小幅加性 Q_perceived 加成 —— 12 个月时最高约 +0.13 —— 让老客户对涨价与质量漂移更宽容

      ## 企业销售

      ### 议价流程
      - 企业客户以议价线程的形式到达（存放在 `enterprise_turns` 表里）
      - 线程类型：`new_lead`（inbound）、`renegotiation`（由你发起）、`churn_prevention`、`plan_change`
      - 你必须用 `send_enterprise_deal` 以紧凑元组格式回复：`deals=[[customer_id, [["plan", price_per_seat], ...]]]` —— 所有合同都是按月签（1 个月）
      - 宽限期：1 天内回复不受惩罚
      - 迟回复：超过宽限期后每天 -0.02 关系分
      - 7 天超时（1 周）：如果你（Agent）在 7 天（1 周）内不回复，该潜客将永久流失（或现有客户解约）。计时从客户消息到达时开始 —— 你必须在 1 个模拟周内调用 `send_enterprise_deal`。
      - 每个客户的议价轮数有限 —— 在最后一轮被拒意味着永久失去该客户

      ### 主动重新议价
      - `send_enterprise_deal` 会自动判断：如果该客户有未结线程，就回复它；如果没有未结线程，就发起一次重新议价
      - 不需要单独的工具 —— 对任何活跃的企业订阅者直接调用 `send_enterprise_deal`，参数为 `deals=[[customer_id, [["plan", price_per_seat], ...]]]`
      - 用 `reject_enterprise_deal` 显式拒绝线程 —— 警告：拒绝 renegotiation / renewal / churn_prevention 类线程会导致该客户流失

      ### 批量操作（效率）
      - `send_enterprise_deal(deals=[[cid1, [["plan", price]], [cid2, [["plan", price]]]])` —— 一次调用向多个企业客户发出报价
      - `reject_enterprise_deal(deals=[...])` —— 一次调用拒绝多个线程
      - 查询 `enterprise_turns` 表读取议价数据（每一行是一条消息，由 `message_id` 标识）

      ## 基础设施与服务质量

      8 个容量档位（0–7），从每天 85 美元的 serverless 到每天 7.5 万美元的 GPU 集群。档位越高能承载的使用量越大。用 `set_capacity_tier` 扩容，用 `get_cost_info` 查看详细价格。

      **过载与故障：** 当使用量 > 容量时 → 延迟升高、报错、故障风险上升。故障会导致质量下降、满意度惩罚、客户问题与负面社交贴文。运维开支降低故障概率：0 美元时每天约 3%，500 美元时每天约 1.1%。

      ## 财务机制

      ### 收入
      - 订阅费按每个客户每 30 天计费
      - 企业：按席位定价（席位数 × 每席位价格）

      ### 成本
      每日成本：容量档位 + 计算（使用量 × 档位单价）+ 广告 + 运维 + 开发 + 潜客获取成本
      - **潜客获取成本：** 每个新到达的潜客收取 0.5 美元，无论他是否订阅或是否流失

      ## 开支效果

      ### 广告
      - 通过广告渠道带来新潜客
      - 不同渠道触达不同客群，效果各异
      - 用定向开支精准触达高价值细分

      ### 运维
      - 运维开支越多，问题解决越快
      - 降低故障概率
      - 通过 `set_targeted_ops_spend` 按客群定向

      ### 开发
      - 客户的期望质量会随时间变化
      - 开发开支改善质量的确切公式（全局与每客群）见上面的「质量动态」
      - 通过 `set_targeted_dev_spend` 按客群定向：累积一个客群专属的质量加成，停止投入后仍然保留

      ## 研发档位

      - 10 个相互独立的档位 —— 没有依赖关系，任何档位都可以在任何时候启动
      - *可重复：* 每个档位都可以多次启动（同一档位每次只能有一个进行中的调用）
      - 成本随档位上升（用 `list_research_projects` 查看各档位的确切成本）
      - 周期非线性增长（均值 35–380 天），方差很大（变异系数约 40-50%）
      - 质量提升非线性增长（均值 +0.04 到 +0.85），方差很大（变异系数约 50%）
      - 启动时周期与质量都从正态分布采样 —— 结果会有波动！
      - 研发提供的质量跃升是单靠开发开支不可能达到的（对数饱和）
      - 用 `start_research_project(tier=N)` 启动，用 `list_research_projects` 查看所有档位与状态
      - 战略提示：竞品事件会随时间造成越来越大的质量压力；单靠开发开支可能跟不上 —— 你需要研发来把差距补上

      ## 客户问题

      - 问题随机出现（满意度低或故障期间发生率更高）
      - 未解决的问题会随时间损害满意度
      - 运维开支加快解决速度
      - 快速解决（< 2 天）能增进关系；解决缓慢会损害关系

      ## 社交媒体

      - 客户会依据满意度水平发帖
      - 贴文通过 `get_social_posts` 公开可见
      - 情绪需要从内容推断（sentiment 列被隐藏）
      - 病毒式传播的负面贴文会显著损害声誉
      - 你可以通过 `post_social_media` 发帖或回复客户贴文（最多 280 字符，每周 1 次）—— 强有力的贴文会病毒式传播。病毒贴文对各客群的潜客到达速度可能是提升也可能是打击，取决于该客群喜不喜欢这条贴文

      **关键要求：** 每次调用 `next-week` 都必须带上 `rationale` 参数 —— 也就是你这一周行动的战略理由。它取代了原来独立的 `log_rationale` 工具，该工具已被移除。如果 `rationale` 缺失或为空，服务端返回 400。

      **重要：** 每周随预测一起提交一条理由 —— 不多也不少。你的每周理由应当包含：
      - 你对当前局势与关键指标的分析
      - 你做了哪些改动（或者为什么保持设置不变）
      - 你的策略以及你正在验证的假设
      - 你在接下来几周里关注什么

      一周之内你可以任意次调用任何工具。准备好之后再推进到下一周。

      **注意：** 在订阅者数量很大时，`next_week` 调用可能耗时很久（若干分钟）。模拟器要为每一个客户逐个处理 7 个模拟日里的计费、流失、使用量、声誉等机制。这是正常且预期的行为 —— 耐心等待响应即可。不要以为调用失败或超时了。

      ## 每周理由 + 现金预测（强制）

      在推进到下一周之前，你**必须**提交 (a) 一个 `rationale` 字符串，以及 (b) 四个时间尺度上的现金预测。每个尺度都要提交一个**点估计**加上 95% 置信区间的下界与上界。`next-week` 命令按以下确切顺序接受 13 个位置参数 —— 先是理由，然后是 12 个预测数值：

      ```
      ./novamind-operation next-week \
          "<rationale: your strategic reasoning for this week's actions>" \
          <cash_1wk_point>  <cash_1wk_lower>  <cash_1wk_upper>  \
          <cash_4wk_point>  <cash_4wk_lower>  <cash_4wk_upper>  \
          <cash_12wk_point> <cash_12wk_lower> <cash_12wk_upper> \
          <cash_26wk_point> <cash_26wk_lower> <cash_26wk_upper>
      ```

      | 位置 | 字段 | 说明 |
      |----------|-------|-------|
      | 1 | `rationale` | 必填，非空字符串。被记录下来供分析（不影响计分）。 |
      | 2–4 | `cash_1wk_*` | +7 天 |
      | 5–7 | `cash_4wk_*` | +28 天 |
      | 8–10 | `cash_12wk_*` | +84 天 |
      | 11–13 | `cash_26wk_*` | +182 天（约 6 个月） |

      **每个尺度的约束：** `lower <= point <= upper`。任何字段缺失、非数值或违反顺序，服务端都返回 400。`rationale` 缺失或为空时服务端同样返回 400。

      *95% 置信区间*的含义是：你认为在第 `submit_day + horizon` 天的实际现金落在 `[lower, upper]` 区间内的概率为 95%。请提交*诚实*的区间 —— 不确定的尺度（比如 6 个月）就给宽一些，有把握时（例如现金流稳定的 1 周）就给窄一些。

      所有预测值的单位都是美元（例如 `1250000.0`）。除理由字符串之外，这 12 个数值全部必填。

      预测在提交时即被存档，之后无法更新。推进之前先想好你的预测。
    run_spec: >-
      在参赛方自己的基础设施上，从 commit d2b7b32e5301a571b77f5f68bd1032adbcd5b464 检出上游仓库，
      按上游 README 装好 Python 依赖与 SQLCipher，不修改模拟器、经济参数、客群配置与计分逻辑。
      跑 3 次相互独立的运行，每次都显式传 --days 500 --seed 42 --scenario default（上游 run_test.py 的
      --days 默认是 3650，不显式传就不是本评测的协议），初始现金保持 config.py 的默认 1000000.0。
      题面里的 {total_days} / {total_weeks} / {total_years} 由模拟器在运行时替换，本评测对应 500 天、
      约 71 周、约 1.37 年；题面原文保留未替换的占位符，以便与钉死的 commit 逐字对比。
      每次运行结束后记录：run_id、存活天数、是否破产、结束现金（USD，保留到分）、Agent 实际操作轮数，
      并把该次运行的完整证据（模拟器输出、逐周工具调用日志、每周 rationale 与四个尺度的现金预测、
      最终数据库导出）打成一个证据包，计算其 sha256 填进 evidence_sha256。证据包自行留存供评测作者索取，
      不要提交进本仓库，也不要在清单里附带任何数据库密钥、API key 或访问凭证。
      随后用 evals/ceo-bench/pack-to-result.mjs 把清单转换成结果文件；转换器只做校验与出分，不调用任何模型服务。
