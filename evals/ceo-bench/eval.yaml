            - column_id: tools
              value: marketing.set_targeted_ad_spend, marketing.set_lead_promotion
        - id: product-rd
          cells:
            - column_id: category
              value: 产品质量与研发
            - column_id: actions
              value: 选择模型档位、投入日常开发、立项研究项目
            - column_id: tools
              value: pricing.set_model_tiers, research.start_research_project
        - id: operations
          cells:
            - column_id: category
              value: 运维与可靠性
            - column_id: actions
              value: 采购基础设施算力并投入客户支持
            - column_id: tools
              value: infrastructure.set_capacity_tier, analytics.set_targeted_ops_spend
        - id: enterprise-sales
