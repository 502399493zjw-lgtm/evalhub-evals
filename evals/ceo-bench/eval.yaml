id: ceo-bench
protocol_revision: 3
name: CEO-Bench（NovaMind 创业经营）
category: useful
display_category: agent
description: CEO-Bench 让 Agent 以 100 万美元开局经营一家 AI 创业公司，连续处理定价、研发、增长、算力与企业客户决策，以终局现金衡量长期经营能力。
hook_title: 给 Agent 500 天，它能把公司经营到最后吗
