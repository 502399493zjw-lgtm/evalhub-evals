      description: 论文与官网使用 500 天口径；EvalHub 新证据的整周复现边界固定为 497 天。
      source_url: https://arxiv.org/html/2606.18543v2
    - value: 3 次
      label: 每个模型的公开实验运行数
      description: 论文实验设置按模型运行三次，并以完成或破产状态汇总。
      source_url: https://arxiv.org/html/2606.18543v2
    - value: "34"
      label: 可用经营工具
      description: 覆盖查询、定价、增长、研发、运营、企业销售、信息获取和公开沟通。
      source_url: https://ceobench.com/#benchmark
    - value: "19"
      label: 可查询业务表
      description: Agent 需要主动查询业务数据库，而不是直接观察完整环境状态。
      source_url: https://ceobench.com/#benchmark
    - value: "26"
      label: 客户群
      description: 客户群具有隐藏偏好，市场还包含宏观周期、竞争冲击和延迟反馈。
      source_url: https://ceobench.com/#benchmark
  caveats:
    - title: 成绩来源不是 EvalHub 复跑
      description: 签入的 18 份数值成绩只转录 Princeton 官网的模型级公开汇总；不附带 EvalHub usage、逐题结果、模型输出或执行轨迹。
    - title: 500 天发表口径与 497 天复现边界不同
      description: 上游论文和官网声明 500 天；当前 EvalHub 协议因官方 CLI 只能整周推进而固定 71 周、497 天，不能把历史成绩重新命名为同配置复跑。
    - title: 模拟环境不能覆盖真实公司经营
      description: 论文指出模拟器仍简化了现实，产品质量被数值化，并未覆盖合规、安全和融资等真实经营环节；harness 选择也会显著影响表现。
    - title: 许可与背书边界
      description: 论文 v2 标注 CC BY 4.0，但上游两个 GitHub 仓库未声明代码许可证；本目录不重新分发其代码、数据库或可执行物，也不代表 Princeton 认证或背书。
