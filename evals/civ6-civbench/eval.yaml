      使用 lmwilki/civ6-mcp commit dd2019056371b92ea4854e879ddf05a8cad95e8a 的 civbench_standard，保持完整 AGENTS.md
      系统提示、固定 react() Agent、默认消息/token/time 限制和禁止 run_lua 的设置；在已安装正版 Steam《文明 VI》与 Gathering Storm、
      已启用 FireTuner 且端口 4318 可用的本机环境执行 `inspect eval evals/civbench.py@civbench_standard --model <provider/model>
      -T scenarios=cry_havoc -T model_id=<provider/model>`。必须从 0C_CRY_HAVOC T1 存档独立开始，运行至胜负、330 回合预算或不可恢复
      失败；保留 Inspect .eval、telemetry manifest、diary 与 log，并按 tasks/README.md 生成提交清单，不得省略非胜利场景。
