    run_spec: >-
      Substitute max_days=365 and initial_balance=100000; prepend the fixed SYSTEM_PROMPT and rendered CONTEXT_WINDOW_PROMPT from the pinned agent/prompts.py;
      use the pinned repository's default environment and tool registry, max_turns=4000, max_token_capacity=128000, and exactly five independent episodes.
      Preserve every early termination in the five-run mean. The scored final assets are bank balance + platform wallet + pending settlement after the runner's final pipeline settlement.
