      2. **商品选择**：用 `list_products` 浏览。高价商品每单位仓储占用能带来更多收入，因此要混合高客单与走量商品。单店可吸收的需求有限，堆积大量库存会边际递减。用 `check_store_status` 查看销售速度，只扩大畅销品。
      3. **定价**：围绕市场参考价设置零售价。高于参考价会减少需求并提高退货；低于参考价会增加销量但压缩利润。参考价不一定是利润最优价。最佳价格取决于商品需求弹性：低弹性商品可以高于参考价来获取更高单位利润；高弹性商品降价后可能靠销量获得更高总利润。两种方向都要试，根据真实销售数据调整，并用 `set_prices` 持续调价。
      4. **供应商谈判**：用 `supplier_search` 找供应商，再用 `chatbox` 谈判。采购价越低，利润越高。并非所有供应商都诚信或按约履行，因此要横向比较价格，并检查实际到货数量与退货率，以识别应避开的对象。不了解供应商前不要投入大笔资金。
      5. **库存管理**：监控库存，断货前补货，并清理滞销品（仓储费会随库龄上升）。
      6. **平台活动**：平台会提前公布促销活动（如年中大促、金秋嘉年华）。使用 `join_promotion` 并设置折扣率；折扣越高，吸引的顾客越多。

