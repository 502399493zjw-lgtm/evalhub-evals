    ## 关于此评测

    Ego Browser Benchmark 的 Real-World Bench 用 31 道多步骤任务测试浏览器智能体。任务覆盖真实网页搜索、筛选与比较、表单填写、网页应用操作、政府数据读取和基于网页信息的计算。固定任务快照共有 154 项二元评分项，每题包含 3–6 项。

    官方主成绩是完美完成率：

    **完美完成率 = 100 × 全部评分项均通过的任务数 ÷ 31**

    评分项平均分用于显示部分完成情况，但不替代主成绩。报告中的执行成本、时长和轮数来自每题最终有效会话；Judge 产物由统一判定流程读取会话材料后逐项给出二元结论。

    ### 重要限制

    - 真实网页、登录状态、反爬机制和页面内容会变化，不同日期的运行不是严格受控的同环境实验。
    - 各模型的并发设置并不完全相同，因此平均时长不能单独当作模型速度排名。
    - 部分任务在执行错误后进行了选择性重跑；报告保留每题最终状态。
    - 完美完成率非常严格，部分完成只会反映在评分项平均分中。
    - 成本受模型价卡、缓存规则和汇率影响，不能脱离计费说明直接比较。

    ## 研究观察

    ![评分项微通过率与 Stage A 执行成本散点图](https://github.com/502399493zjw-lgtm/evalhub-evals/releases/download/ego-browser-value-map-2026-08-04/codex-clipboard-23633f2c-be88-48ee-9b5f-7b987667458a.png)

    图中横轴是 31 题的 Stage A 执行成本（USD，对数刻度），纵轴是评分项微通过率（通过评分项 ÷ 154）。图片与上面的统一数据表并列展示，不替代表格中的可比较数值。

    ## 题目案例

    以下 5 题按任务顺序等距抽取，包含完整英文题面和完整中文翻译。

    ### OpenAI X 近 7 天互动表现

    #### 题目原文

    ```text
    I'm reviewing OpenAI's social media performance over the past week and want to see which posts received the most attention and engagement. Collect the main posts from the X account https://x.com/OpenAI from the past 7 days (excluding pinned posts, pure reposts, and posts labeled "Replying to @"), and list the top 5 by Views, including the date, Views, Replies, Likes, and engagement rate. At the end, provide the average Views and average engagement rate across all main posts.
    ```

    #### 中文翻译

    ```text
    我正在回顾 OpenAI 过去一周的社交媒体表现，想了解哪些帖子获得了最多关注和互动。请收集 X 账号 https://x.com/OpenAI 在过去 7 天发布的主要帖子（排除置顶帖子、纯转发帖子，以及标有“Replying to @”的帖子），按 Views 排名前 5，并列出日期、Views、Replies、Likes 和互动率。最后，请给出所有主要帖子的平均 Views 和平均互动率。
    ```

    ### Yahoo Finance 五股观察列表

    #### 题目原文

    ```text
    I'm comparing the recent performance of several U.S. stocks on my watchlist and want to see today's moves, their strength over the past month, and their combined performance weighted by market capitalization. Visit finance.yahoo.com and look up these 5 stocks: AAPL, MSFT, NVDA, TSLA, and META. For each stock, record the Current Price, % Change Today, Market Cap, and 1M Return. Obtain the 1M Return either by switching the chart range to 1M and calculating it from the first and last prices, or by reading the 1M Return directly from the Performance section. Organize the results in a table with Ticker, Current Price, % Change Today, Market Cap, and 1M Return. At the end, identify the largest gainer and largest decliner over the past month with their returns, and calculate the market-cap-weighted average daily percentage change across the 5 stocks.
    ```

    #### 中文翻译

    ```text
    我正在比较观察列表中几只美国股票近期的表现，想了解它们今天的涨跌、过去一个月的表现强度，以及按市值加权后的综合表现。请访问 finance.yahoo.com，查询以下 5 只股票：AAPL、MSFT、NVDA、TSLA 和 META。对每只股票，记录 Current Price、% Change Today、Market Cap 和 1M Return。获取 1M Return 的方式可以是将图表范围切换到 1M，并使用第一个和最后一个价格计算；也可以直接从 Performance 部分读取 1M Return。请用表格整理结果，列为 Ticker、Current Price、% Change Today、Market Cap 和 1M Return。最后，找出过去一个月涨幅最大和跌幅最大的股票及其回报率，并计算这 5 只股票按市值加权的平均日百分比变动。
    ```

    ### StockAnalysis 科技股估值

    #### 题目原文

    ```text
    I'm considering adding to my technology stock holdings and first want to understand how expensive the largest U.S.-listed technology companies are by valuation. Open the Stock Analysis stock screener at https://stockanalysis.com/stocks/screener/, add a Sector filter for Technology only, switch the table to the Valuation view so the valuation metrics are visible, and sort by Market Cap from highest to lowest. Take the 8 largest companies at the top and record each one's rank, ticker, company name, Market Cap, PE Ratio, PS Ratio, and PB Ratio in a table. Then calculate the average PE Ratio across the 8 companies, rounded to two decimal places. Identify the company with the highest PE Ratio—the most expensive by earnings—and provide its PE Ratio, then identify the company with the highest PS Ratio and provide its PS Ratio.
    ```

    #### 中文翻译

    ```text
    我正在考虑增持科技股，首先想了解按估值计算，美国上市的大型科技公司价格有多高。请打开 Stock Analysis 股票筛选器 https://stockanalysis.com/stocks/screener/，添加仅限 Technology 的 Sector 筛选条件，将表格切换到 Valuation 视图以显示估值指标，并按 Market Cap 从高到低排序。取最上方市值最大的 8 家公司，在表格中记录每家的排名、股票代码、公司名称、Market Cap、PE Ratio、PS Ratio 和 PB Ratio。然后计算这 8 家公司的平均 PE Ratio，四舍五入到两位小数。找出 PE Ratio 最高的公司，即按盈利计算最昂贵的公司，并给出其 PE Ratio；再找出 PS Ratio 最高的公司，并给出其 PS Ratio。
    ```

    ### Scratch《Apple Dash》游戏

    #### 题目原文

    ```text
    I'm preparing a classroom demo of a small collect-and-dodge game and need a playable Scratch prototype rather than a static animation. In a new Scratch project, keep the Scratch Cat as the player, add the Apple and Crab sprites, and name the project "Apple Dash." When the green flag is clicked, reset Score to 0, Lives to 3, and Time to 30; place the Cat at x: 0, y: 0, the Apple at x: 150, y: 80, and the Crab at x: -150, y: -80.

    First make the Cat move with all four arrow keys while staying on the stage. Once movement works, build the collection loop so touching the Apple adds 1 to Score and immediately moves the Apple to a new random position. Use that scoring loop as the win target: reaching 5 points must make the Cat say "YOU WIN!" and stop the game.

    Then turn the Crab into a moving hazard. It should keep moving around the stage and bounce at the edges; when it touches the Cat, it should subtract 1 from Lives and return the Cat to x: 0, y: 0 without draining multiple lives from one continuous collision. Add a one-second countdown for Time. If Lives reaches 0 or Time reaches 0 before Score reaches 5, the Cat must say "GAME OVER!" and stop.

    Run the project from the green flag and play through one complete winning round so the retained stage shows Score 5, Lives at 1 or more, Time above 0, and the "YOU WIN!" message. At the end, give me a concise summary of the controls, collection rule, hazard rule, and both end conditions. Leave the Scratch editor open with the winning stage and the relevant code visible, and do not share or publish the project.
    ```

    #### 中文翻译

    ```text
    我正在为课堂演示准备一个小型“收集并躲避”游戏，需要一个可玩的 Scratch 原型，而不是静态动画。在一个新的 Scratch 项目中，保留 Scratch Cat 作为玩家，添加 Apple 和 Crab 角色，并将项目命名为 “Apple Dash”。点击绿旗时，将 Score 重置为 0、Lives 重置为 3、Time 重置为 30；将 Cat 放在 x: 0、y: 0，Apple 放在 x: 150、y: 80，Crab 放在 x: -150、y: -80。

    首先，让 Cat 能够使用四个方向键移动，同时始终留在舞台内。移动功能正常后，构建收集循环：当 Cat 碰到 Apple 时，Score 增加 1，并立即将 Apple 移到新的随机位置。以该计分循环作为获胜目标：达到 5 分时，Cat 必须说出 “YOU WIN!” 并停止游戏。

    然后将 Crab 变成移动障碍物。它应持续在舞台上移动并在边缘反弹；当它碰到 Cat 时，应从 Lives 中减去 1，并将 Cat 放回 x: 0、y: 0，同时不能因为一次持续碰撞而连续扣除多条生命。为 Time 添加每秒一次的倒计时。如果在 Score 达到 5 之前 Lives 降至 0 或 Time 降至 0，Cat 必须说出 “GAME OVER!” 并停止游戏。

    从绿旗运行项目，并完整玩出一轮胜利局面，使保留在舞台上的状态显示 Score 为 5、Lives 至少为 1、Time 大于 0，以及 “YOU WIN!” 消息。最后，请简要总结控制方式、收集规则、障碍规则和两种结束条件。保持 Scratch 编辑器打开，显示获胜舞台及相关代码；不要分享或发布该项目。
    ```

    ### Lumen Tickets 抢票

    #### 题目原文

    ```text
    I'm trying to get two tickets for Northstar's Afterglow Tour in Chicago for a friend and me. On Lumen Tickets, choose the later of the two Saturday performances—the Saturday two weeks out from today's Chicago date—then select Lower Bowl and 2 tickets. Enter the buyer details as Morgan Chen, morgan.c@example.com, 312-555-0166, with billing ZIP code 60601, and agree to the ticket and venue terms. I only want one claim attempt: if it doesn't succeed, stop and do not refresh the page or try again. Once the reservation is confirmed, leave the receipt visible and tell me the performance date, section, quantity, total, and confirmation code.
    ```

    #### 中文翻译

    ```text
    我想为我和一位朋友购买两张 Northstar 的 Afterglow Tour 芝加哥场门票。在 Lumen Tickets 上，从两场星期六演出中选择较晚的一场——即以芝加哥当地今日日期起算两周后的星期六——然后选择 Lower Bowl 和 2 张门票。填写购票人信息：Morgan Chen、morgan.c@example.com、312-555-0166，账单 ZIP code 为 60601，并同意票务和场馆条款。

    我只允许一次申领尝试：如果没有成功，请停止，不要刷新页面，也不要再次尝试。预订一经确认，保持收据可见，并告诉我演出日期、座位区域、数量、总价和确认码。
    ```

