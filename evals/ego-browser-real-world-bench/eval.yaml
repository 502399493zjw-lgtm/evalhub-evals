  - "id": "rwb-courtlistener-sec-helix-01"
    "label": "CourtListener/SEC Helix 诉讼尽调档案"
    "prompt": "I'm a litigation associate preparing for a deposition next Tuesday against a company called 'Helix Energy Solutions Group'. I need to pull together a background dossier before the depo. Start on CourtListener (the RECAP Archive, which mirrors federal court dockets originally sourced from PACER) and search for any federal civil cases naming Helix Energy Solutions Group filed in the last 5 years — for each case, list the case number, the court, the filing date, the parties, and a one-line nature of suit, and leave the docket page open for the most recent case so I can scan it. Be aware that RECAP only captures cases that PACER users have browsed, so explicitly flag if coverage looks thin or if a case you'd expect to exist appears to be missing, rather than treating 'no results' as proof of no litigation. Once you've got that case list, go to SEC EDGAR and pull up Helix's most recent 10-K annual report — extract the total revenue, net income, the name of the auditor, and anything disclosed in the legal proceedings section about pending litigation — leave that 10-K filing tab open. After that, check the Delaware Court of Chancery website (since they're Delaware-incorporated) for any corporate governance disputes naming Helix filed within the same five-year window ending at the task start time, and note any case captions and filing dates you can find; if the site asks you to log in to view details, say so and record what's publicly visible without an account. At the end, give me a concise deposition-prep brief that combines the litigation history from CourtListener, the financial snapshot from the 10-K, and any red flags from the legal proceedings disclosure, and clearly point out any uncertainty about whether the older federal cases are still active versus settled, as well as any coverage gaps from relying on RECAP instead of a live PACER account. Keep the CourtListener docket tab and the 10-K tab open."
    "run_spec": "Run the unchanged upstream task through the Real-World Bench external workflow at commit f566ac293e4e6bd80c4e9b062b5699f04eac41f4. After the upstream judge finishes, record the binary all-rubrics-passed verdict in the packing manifest for this task ID. This EvalHub package does not execute the upstream workflow or access the task website."
  - "id": "rwb-scratch-apple-dash-01"
    "label": "Scratch《Apple Dash》游戏"
    translation: |-
      我正在为课堂演示准备一个小型“收集并躲避”游戏，需要一个可玩的 Scratch 原型，而不是静态动画。在一个新的 Scratch 项目中，保留 Scratch Cat 作为玩家，添加 Apple 和 Crab 角色，并将项目命名为 “Apple Dash”。点击绿旗时，将 Score 重置为 0、Lives 重置为 3、Time 重置为 30；将 Cat 放在 x: 0、y: 0，Apple 放在 x: 150、y: 80，Crab 放在 x: -150、y: -80。

      首先，让 Cat 能够使用四个方向键移动，同时始终留在舞台内。移动功能正常后，构建收集循环：当 Cat 碰到 Apple 时，Score 增加 1，并立即将 Apple 移到新的随机位置。以该计分循环作为获胜目标：达到 5 分时，Cat 必须说出 “YOU WIN!” 并停止游戏。

      然后将 Crab 变成移动障碍物。它应持续在舞台上移动并在边缘反弹；当它碰到 Cat 时，应从 Lives 中减去 1，并将 Cat 放回 x: 0、y: 0，同时不能因为一次持续碰撞而连续扣除多条生命。为 Time 添加每秒一次的倒计时。如果在 Score 达到 5 之前 Lives 降至 0 或 Time 降至 0，Cat 必须说出 “GAME OVER!” 并停止游戏。

      从绿旗运行项目，并完整玩出一轮胜利局面，使保留在舞台上的状态显示 Score 为 5、Lives 至少为 1、Time 大于 0，以及 “YOU WIN!” 消息。最后，请简要总结控制方式、收集规则、障碍规则和两种结束条件。保持 Scratch 编辑器打开，显示获胜舞台及相关代码；不要分享或发布该项目。
    "prompt": "I'm preparing a classroom demo of a small collect-and-dodge game and need a playable Scratch prototype rather than a static animation. In a new Scratch project, keep the Scratch Cat as the player, add the Apple and Crab sprites, and name the project \"Apple Dash.\" When the green flag is clicked, reset Score to 0, Lives to 3, and Time to 30; place the Cat at x: 0, y: 0, the Apple at x: 150, y: 80, and the Crab at x: -150, y: -80.


      First make the Cat move with all four arrow keys while staying on the stage. Once movement works, build the collection loop so touching the Apple adds 1 to Score and immediately moves the Apple to a new random position. Use that scoring loop as the win target: reaching 5 points must make the Cat say \"YOU WIN!\" and stop the game.


      Then turn the Crab into a moving hazard. It should keep moving around the stage and bounce at the edges; when it touches the Cat, it should subtract 1 from Lives and return the Cat to x: 0, y: 0 without draining multiple lives from one continuous collision. Add a one-second countdown for Time. If Lives reaches 0 or Time reaches 0 before Score reaches 5, the Cat must say \"GAME OVER!\" and stop.


      Run the project from the green flag and play through one complete winning round so the retained stage shows Score 5, Lives at 1 or more, Time above 0, and the \"YOU WIN!\" message. At the end, give me a concise summary of the controls, collection rule, hazard rule, and both end conditions. Leave the Scratch editor open with the winning stage and the relevant code visible, and do not share or publish the project."
    "run_spec": "Run the unchanged upstream task through the Real-World Bench external workflow at commit f566ac293e4e6bd80c4e9b062b5699f04eac41f4. After the upstream judge finishes, record the binary all-rubrics-passed verdict in the packing manifest for this task ID. This EvalHub package does not execute the upstream workflow or access the task website."
  - "id": "rwb-2048-reach-256-01"
    "label": "Classic 2048 达成 256"
    "prompt": "I'm testing whether a browser agent can sustain a long sequence of stateful game decisions without resetting when the board becomes inconvenient. Open the original Classic 2048 and start one new game. Without refreshing the page or restarting the game, keep playing until you create a 256 tile. As soon as the 256 tile appears, stop making moves, report the current score, and leave the Classic 2048 tab open with the board, the 256 tile, and the score visible."
