 - id: idle-factory-planet
   label: "放置 · Idle Factory Planet"
   prompt: "# Idle Factory Planet\n\nBuild an **Idle Factory Planet** game in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe player places machines on a planet surface that automatically produce\nresources, chains production lines together, and researches upgrades until the\nplanet is depleted — then prestiges to a new planet with better technology. The\nfantasy is industrial scale: watching conveyor belts carry ore to smelters to\nfabricators, output numbers climbing exponentially, and the planet surface\nfilling with an intricate factory network. The idle loop runs production\ncontinuously; the player optimises layouts and unlocks new machine types.\n\n## What the Player Experiences\n\n1. **Title Screen** — A small planet covered in tiny factories with conveyor\n   belts, the game name in industrial stencil font, and a play button shaped\n   like a gear.\n2. **Planet Surface** — A top-down grid representing the planet surface. The\n   player places machines on tiles. Conveyor belts connect machines visually,\n   showing resources flowing between them.\n3. **Machine Placement** — Machines include: miners (extract raw ore), smelters\n   (ore to metal), fabricators (metal to parts), and sellers (parts to credits).\n   Each machine auto-produces when supplied. The player drags machines from a\n   panel onto the grid.\n4. **Production Chains** — Machines must be connected in sequence. Output from\n   one feeds input of the next via conveyor. Longer chains produce more valuable\n   goods. A production rate display shows throughput.\n5. **Research** — Credits fund research that unlocks better machines: faster\n   miners, multi-input fabricators, and storage buffers. A tech tree shows\n   available upgrades with costs and effects.\n6. **Planet Depletion** — The planet has finite resources. A depletion meter\n   shows remaining ore. As resources thin, miners slow down. When depleted, the\n   player must prestige.\n7. **Prestige (New Planet)** — Prestiging moves to a fresh planet with more\n   resources. The player keeps research progress and gains a permanent production\n   multiplier. Each new planet starts faster and scales higher.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Idle；rubric 13 条（M3/D4/V2/A4，mean 3），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: idle-spell-tower
   label: "放置 · Idle Spell Tower"
   prompt: "# Idle Spell Tower\n\nBuild an **Idle Spell Tower** game in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe player builds a wizard's tower that generates mana passively, researches\nspells, and automates magical casting for ever-increasing power. The fantasy is\narcane accumulation: watching mana flow from crystal to crystal, spells firing\nautomatically at targets, and the tower growing taller with each prestige cycle.\nThe idle loop generates mana continuously; the player's decisions shape which\nspells to research and how to allocate mana between offence, defence, and\ngrowth. Prestige collapses the tower and rebuilds it higher with better\nfoundations.\n\n## What the Player Experiences\n\n1. **Title Screen** — A tall wizard tower against a starry sky with magical\n   particles flowing upward, the game name in arcane script, and a play button\n   glowing with mana.\n2. **Tower View** — A vertical tower cross-section showing floors. Each floor\n   has a function: mana generators, spell labs, crystal storage, automated\n   casters. The tower grows as floors are added.\n3. **Mana Generation** — Base mana ticks up automatically. Mana generators on\n   each floor contribute to the rate. The player can click a crystal to manually\n   generate bursts. A large mana counter dominates the UI.\n4. **Spell Research** — A research tree shows available spells. Each spell costs\n   mana and time to research. Researched spells can be assigned to auto-casters\n   or cast manually for immediate effect.\n5. **Automated Casting** — Auto-caster floors fire spells at targets (monsters\n   approaching the tower base) without player input. Each caster has a rate and\n   spell assignment. Defeating monsters yields mana crystals.\n6. **Tower Growth** — Spending mana builds new floors, each with a specific\n   function. Higher floors generate more mana but cost exponentially more. The\n   tower visually grows taller.\n7. **Prestige** — When the tower reaches maximum height, the player can collapse\n   it (prestige). The tower resets to one floor but gains a permanent height\n   multiplier, faster mana generation, and access to higher-tier spells. Each\n   rebuild reaches greater heights faster.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Idle；隐藏 rubric 13 条（M3/D4/V2/A4，3 条按 demo 均值聚合，其余取最大值），四类权重 0.15 / 0.35 / 0.15 / 0.35，本题得分 ∈ [0,1]。证据留存：reward.txt、breakdown.json、judge_log.json、build.log 与 demos/<id>/ 的 mp4 与抽帧；提交清单需给出本题 reward、build_ok、scored_demos 与产物目录 sha256。"
 - id: openworld-airship-trader
   label: "开放世界 · Open-World Airship Trader"
   prompt: "# Open-World Airship Trader\n\nBuild a **2D open-world airship trading game** in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe player pilots an airship through a sky filled with floating islands, each\nwith its own economy and goods to trade. The fantasy is freedom above the clouds:\ncharting routes between distant ports, buying low and selling high, upgrading\nyour vessel with better engines and cargo holds, and fending off sky pirates who\nlurk along trade lanes. Tension comes from fuel management, pirate ambushes, and\nvolatile market prices that shift as you trade.\n\n## What the Player Experiences\n\n1. **Title Screen** — A styled opening with the game name over a parallax sky\n   backdrop with drifting clouds and distant islands. A play button begins the\n   journey.\n2. **The Sky Map** — The player flies their airship freely across a large open\n   sky. Multiple floating islands are visible, each with a distinct silhouette\n   and colour palette. Clouds drift in parallax layers.\n3. **Docking** — Approaching an island triggers a docking prompt. Once docked,\n   the player enters a trade menu showing local goods, prices, and their cargo\n   hold contents.\n4. **Trading** — Each island produces certain goods cheaply and demands others at\n   premium prices. The player buys cargo, flies to another island, and sells for\n   profit. Prices fluctuate over time.\n5. **Upgrades** — Profits fund ship upgrades: faster engines, larger cargo hold,\n   better fuel efficiency, and hull armour. Upgrades are visible on the ship\n   sprite.\n6. **Sky Pirates** — Along certain routes, pirate ships appear and chase the\n   player. The player can outrun them, fight with a mounted cannon, or pay a\n   toll. Combat is real-time with simple projectile shooting.\n7. **Fuel & Risk** — The airship consumes fuel while flying. Running out means\n   drifting helplessly. Fuel can be bought at islands or found in floating\n   crates.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
