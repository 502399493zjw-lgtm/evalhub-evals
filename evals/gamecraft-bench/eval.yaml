 - id: tycoon-railroad-baron
   label: "经营模拟 · Railroad Baron"
   prompt: "# Railroad Baron\n\nBuild **Railroad Baron**, a **railroad empire tycoon game** in Godot 4 at\n`/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nThe player lays rail tracks across a map of cities, buys trains, and profits\nfrom cargo demand. Each city produces and consumes different goods — connecting\na lumber town to a construction city creates a profitable route, but only if\nthe track is efficient and the train has capacity. Terrain drives costs:\nmountains require expensive tunnels, rivers need bridges, and flat plains are\ncheap but long. A competitor AI builds its own network, racing to claim the\nmost lucrative routes. The tension is capital allocation: every mile of track\nis an investment that only pays off once trains run, and overbuilding before\nrevenue flows means bankruptcy. The tone is industrial-era ambition: steam,\niron, and the romance of connecting a frontier.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new map. The view shows a top-down\nterrain map with cities marked by icons showing their goods (lumber, grain,\nore, manufactured goods). The player lays track by clicking city-to-city,\npaying costs that vary by terrain crossed.\n\nOnce two cities are connected, the player buys a train and assigns it to the\nroute. Trains move automatically along tracks, picking up goods at one city\nand delivering to another. Revenue depends on distance, cargo value, and\ndemand — delivering goods a city needs pays well; delivering surplus pays\npoorly.\n\nThe player expands by connecting more cities, upgrading tracks for speed,\nbuying faster trains, and reading the demand map to find profitable routes.\nA competitor AI builds its own network and competes for the same demand — if\nthey connect a route first, the player must find alternatives.\n\nMoney management is critical: track costs are upfront, train purchases are\nlarge, and revenue trickles in over time. Taking on debt accelerates growth\nbut interest compounds. The game ends after a set number of years; the player\nwith the highest net worth wins. A styled result screen shows network maps,\nrevenue history, and final ranking.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Tycoon；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: tycoon-space-colony
   label: "经营模拟 · Space Colony"
   prompt: "# Space Colony\n\nBuild **Space Colony**, an **asteroid colony management tycoon game** in Godot 4\nat `/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nA small crew lands on a barren asteroid and must build a self-sustaining colony\nfrom nothing. Oxygen, food, and power are the three lifelines — lose any one\nand colonists die. The player builds modules on a grid surface: habitats for\nliving, farms for food, solar arrays for power, and oxygen generators to keep\neveryone breathing. Each colonist has needs and a job assignment; idle colonists\nconsume without producing. The tension is that expansion requires resources\nthat are already stretched thin, and random meteor strikes can destroy modules\nwithout warning. The fantasy is frontier survival in the void — every new\nmodule is a small victory against the emptiness of space.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new colony. The view shows a\ntop-down asteroid surface with a grid overlay. The initial lander provides\nminimal oxygen, food, and power for a small crew.\n\nThe player builds modules by spending materials mined from the asteroid.\nHabitats house colonists, farms grow food, solar panels generate power, and\noxygen recyclers keep the air breathable. Each module connects to adjacent\nones, and the colony must maintain positive balance in all three resources or\ncolonists begin dying.\n\nColonists are assigned to jobs: miners extract materials, farmers tend crops,\nengineers maintain modules, and researchers unlock new building types. Each\ncolonist has morale affected by living conditions, workload, and whether their\nhabitat has amenities.\n\nMeteor events strike randomly, damaging or destroying modules. The player must\nmaintain redundancy and repair capacity. Research unlocks advanced modules:\ngreenhouses, fusion reactors, shield generators, and deep-mining rigs.\n\nThe game tracks population, days survived, and colony rating. A styled result\nscreen shows colony achievements when the colony is lost or reaches a\npopulation milestone.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`