 - id: roguelike-breach-tactics
   label: "Roguelike · Breach Tactics"
   prompt: "# Breach Tactics\n\nBuild **Breach Tactics**, a tactics roguelike on a small grid with visible enemy\nintents in Godot 4 at `/workspace/game/`. This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam\nas a polished vertical slice.\n\n## Core Vision\n\nA squad of three mechs defends a city grid from waves of alien invaders. The\ntwist: every enemy telegraphs its next move before the player acts, turning\neach turn into a spatial puzzle of displacement, blocking, and sacrifice. The\ngrid is small (8x8) and buildings occupy tiles that must be protected — if too\nmany are destroyed, the timeline is lost. Between battles the player earns\nreactor cores to upgrade mech abilities or unlock new pilots with passive\ntraits. A timeline-reset mechanic gives the player a limited number of full\nturn undos per battle, allowing recovery from catastrophic mistakes. Four\nislands of escalating difficulty each culminate in a boss encounter with unique\ngrid mechanics.\n\n## What the Player Experiences\n\nA title screen shows mechs dropping onto a grid. An island-select map shows\nfour islands with branching mission paths.\n\nEach mission places the mech squad on a grid with buildings and spawning\nenemies. Before the player moves, every enemy displays its intended action:\nattack direction, movement target, or spawn location. The player moves each\nmech and uses one ability per mech — push, shoot, shield, repair, or special.\nAfter all mechs act, enemies execute their telegraphed moves simultaneously.\n\nProtecting buildings is the priority — each destroyed building reduces a\nstructural integrity bar. Losing all integrity fails the mission. Timeline\nresets (limited per battle) rewind one full turn. Between missions, upgrade\nscreens offer new weapons, pilot abilities, and reactor power allocation.\nCompleting an island unlocks the next. A final victory screen shows missions\ncompleted, buildings saved, and resets used.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Roguelike；rubric 18 条（M5/D5/V4/A4，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: roguelike-dice-throne
   label: "Roguelike · Dice Throne"
   prompt: "# Dice Throne\n\nBuild **Dice Throne**, a dice-rolling roguelike with reroll mechanics and\nequipment that modifies die faces in Godot 4 at `/workspace/game/`. This is not\na prototype. It is a **complete, shippable micro-game** that could sit on an\nitch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nA warrior battles through a dungeon using dice as their combat system. Each\nturn the player rolls a set of dice, then chooses which to keep and which to\nreroll (up to two rerolls). Die faces map to abilities: swords deal damage,\nshields block, hearts heal, and skulls trigger special attacks. The twist:\nequipment found in the dungeon physically modifies die faces — a flame sword\nreplaces one sword face with a fire-sword that deals double damage, enchanted\narmor adds a shield face to a die. The enemy rolls visible dice too, creating\na transparent contest where both sides see what is coming. Building a set of\ndice with synergistic faces is the meta-progression within each run.\n\n## What the Player Experiences\n\nA title screen shows dice tumbling with glowing face icons. Starting a run\ngives the player 5 standard dice (each with sword, sword, shield, heart,\nskull, blank faces).\n\nIn combat, the player rolls all dice simultaneously with a satisfying tumble\nanimation. Results land face-up. The player selects dice to keep (they lock in\nplace) and rerolls the rest — up to two rerolls per turn. After finalizing,\nfaces activate: swords deal damage to the enemy, shields reduce incoming damage,\nhearts heal, skulls trigger a special ability. The enemy then rolls their own\nvisible dice and resolves similarly.\n\nBetween encounters, loot screens offer equipment that modifies die faces —\nreplacing, upgrading, or adding faces. A map shows branching paths with combat,\nelite, shop, and rest nodes. Shops sell face modifications and new dice. The\nrun ends at a boss with powerful custom dice. Death shows floor reached, best\nroll, and equipment collected.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Roguelike；隐藏 rubric 18 条（M5/D5/V4/A4，5 条按 demo 均值聚合，其余取最大值），四类权重 0.15 / 0.35 / 0.15 / 0.35，本题得分 ∈ [0,1]。证据留存：reward.txt、breakdown.json、judge_log.json、build.log 与 demos/<id>/ 的 mp4 与抽帧；提交清单需给出本题 reward、build_ok、scored_demos 与产物目录 sha256。"
 - id: roguelike-dungeon-shop
   label: "Roguelike · Dungeon Shop"
   prompt: "# Dungeon Shop\n\nBuild **Dungeon Shop**, a shopkeeper roguelike where you price items and defend\nfrom thieves in Godot 4 at `/workspace/game/`. This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam\nas a polished vertical slice.\n\n## Core Vision\n\nThe player runs a dungeon item shop, stocking shelves with weapons, potions,\nand armor that adventurers browse and buy. The twist: the player sets prices,\nand pricing is the core mechanic. Price too high and adventurers leave empty-\nhanded. Price too low and profit evaporates. Some customers are thieves who\ngrab items and bolt for the door — the player must physically chase and tackle\nthem or deploy traps. Between shopping days, the player ventures into a\nprocedural dungeon to acquire new stock, fighting monsters with whatever unsold\ninventory is on hand. Gold funds shop upgrades: display cases, security\nmeasures, and larger floor space. Each run spans multiple days until the shop\neither thrives to a target gold amount or goes bankrupt.\n\n## What the Player Experiences\n\nA title screen shows a cozy shop interior with a sword on display. Starting a\nrun opens the shop on Day 1 with basic starter inventory.\n\nDuring the shop phase, adventurers enter and browse. The player drags items\nonto shelves and sets prices via a slider. Adventurers have visible budget\nindicators and preferences. Satisfied customers pay and leave; overcharged\ncustomers scoff and exit. Thieves grab items and run — the player clicks to\nchase or activates pre-placed traps.\n\nDuring the dungeon phase, the player enters a procedural side-scrolling dungeon\nwith simple combat, collecting loot to stock the shop. Better dungeon\nperformance means better inventory. Between days, an upgrade screen offers shop\nimprovements. The run ends in victory (reaching a gold target) or bankruptcy\n(running out of stock and gold). A results screen shows days survived, total\nprofit, and thieves caught.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fre