 - id: strategy-ant-colony
   label: "策略 · Ant Colony"
   prompt: "# Ant Colony\n\nBuild **Ant Colony**, a **top-down ant colony management strategy game** in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nThe player commands an ant colony from above, directing workers to dig tunnels,\ngather food, tend larvae, and defend against invaders. The colony is a living\norganism: ants need roles assigned, tunnels need planning for efficient flow,\nand the food stockpile determines how many mouths can be fed. The tension comes\nfrom competing priorities — every ant digging is an ant not foraging, every\ntunnel extended is a new front to defend. Seasons change the surface: summer\nbrings abundant food but also predators; winter cuts supply lines and forces\nthe colony to survive on reserves. The fantasy is being the invisible mind of\nthe hive, orchestrating thousands of tiny decisions into a thriving\nunderground civilization.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new colony. The view shows a\ncross-section of earth with the surface above and soil below. The queen sits\nin a starting chamber and the player directs initial workers to dig outward.\n\nDigging creates tunnels and chambers. The player designates chamber roles:\nnurseries hatch eggs faster, food stores prevent spoilage, barracks train\nsoldiers. Workers are assigned roles by dragging them to task zones — foragers\ngo to the surface, diggers extend tunnels, nurses tend larvae, soldiers patrol\nentrances.\n\nFood appears on the surface as scattered resources. Foragers carry it back\nalong tunnel routes — shorter, wider paths mean faster delivery. The colony\ngrows as the queen produces eggs that hatch into new ants, but each ant\nconsumes food daily. Overexpansion without food income starves the colony.\n\nThreats arrive periodically: rival insects invade through tunnel entrances,\nrain floods shallow tunnels, and winter freezes surface food. The player must\nbalance growth against defense and plan tunnel depth for flood resistance.\n\nThe game tracks colony population and days survived. A styled result screen\nshows colony statistics when the queen dies or a survival milestone is reached.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Strategy；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: strategy-ashen-spire
   label: "策略 · Strategy: Ashen Spire"
   prompt: "# Strategy: Ashen Spire\n\nBuild **Ashen Spire**, a compact **dark-fantasy roguelike deckbuilding card\nbattler** in Godot 4 at `/workspace/game/`. This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam as\na polished vertical slice.\n\n## Core Vision\n\nThe fantasy is climbing a cursed tower one floor at a time with nothing but a\nthin deck of cards and whatever you scavenge along the way. Each combat is a\nsmall tactical puzzle: energy is scarce, the enemy telegraphs its next move, and\nevery card played reshapes the odds for the rest of the run. The interesting\ntension is that the deck is both your weapon and your liability -- adding\npowerful cards dilutes consistency, while staying lean means fewer answers to\nescalating threats. The pressure comes from reading enemy intent, rationing\nenergy across attack and defense, and gambling on which reward cards will pay off\nthree fights from now. The risk is always that one greedy pick or one misread\nintent leaves you one hit from death with no block in hand.\n\n## What the Player Experiences\n\nThe player arrives at a dark, atmospheric title screen that sets the tone of a\ngrim tower ascent. Starting a run reveals a branching route map -- a web of\nnodes stretching upward toward a final confrontation, with forks that force the\nplayer to choose which dangers to face and which to skip.\n\nEntering a combat node drops the player into a turn-based card duel. A small\nhand is drawn, energy refills, and the enemy displays what it intends to do next\nturn. The player spends energy playing cards -- strikes that chip away at the\nenemy, guards that raise a shield, and stranger tactical effects that poison,\nburn, draw extra cards, or bend the rules. When the hand is spent or the player\nis satisfied, ending the turn lets the enemy act, then a fresh hand is drawn and\nthe cycle repeats.\n\nWinning a fight offers a choice of new cards to weave into the deck, each with\nits own identity and cost. The map updates, the player picks the next node, and\nthe deck grows richer and riskier with every floor. Different encounters reveal\ndifferent pixel monsters with distinct silhouettes and behaviors, so no two\nclimbs feel identical.\n\nThe run resolves at the top: defeat the boss and a styled victory screen\ncelebrates the climb, or fall to zero health anywhere along the way and a defeat\nscreen marks how far you got. Either way, the player can retry or return to the\ntitle without restarting the application.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
