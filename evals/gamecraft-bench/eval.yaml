 - id: shooter-hotline-heist
   label: "射击 · Hotline Heist"
   prompt: "# Hotline Heist\n\nBuild **Hotline Heist**, a top-down fast-action shooter in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe fantasy is bursting through doors into rooms full of armed guards, clearing\nentire floors in seconds with precise aim and brutal efficiency. The interesting\ntension is fragility: both the player and enemies die in one hit, making every\nroom entry a lethal puzzle where hesitation means death. Combo scoring rewards\nspeed — chaining kills without pause multiplies the score, encouraging reckless\naggression balanced against the instant-death stakes. Weapon variety scattered\nacross floors forces improvisation: a shotgun clears a cluster but alerts the\nnext room, while a silenced pistol preserves surprise but demands accuracy.\n\n## What the Player Experiences\n\nThe player sees a stylized title screen, selects a floor from the campaign list,\nand spawns outside the building's entrance. The camera shows the full floor plan\nfrom above — rooms, corridors, doors, and enemy patrol routes are partially\nvisible. The player moves with WASD, aims with the mouse, and clicks to attack.\nDoors can be kicked open to stun enemies behind them.\n\nEach floor is a self-contained puzzle of 4-8 rooms connected by doors and\nhallways. Guards patrol set routes; some stand still, others pace. Weapons litter\nthe ground — bats, pistols, shotguns, SMGs, thrown knives — each with limited\nammo or single-use. Clearing all enemies on a floor triggers a score screen\nshowing time, combo chain, and weapon variety bonus. Dying restarts the floor\ninstantly. The campaign offers 8+ floors with escalating guard density, new enemy\ntypes (armored, dogs, gunners), and tighter layouts.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Shooter；rubric 18 条（M5/D5/V4/A4，mean 6），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: shooter-mech-sortie
   label: "射击 · Mech Sortie"
   prompt: "# Mech Sortie\n\nBuild **Mech Sortie**, a top-down mech shooter in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe fantasy is piloting a heavily armed walking mech through hostile territory,\ncustomizing its weapon hardpoints between missions to match the threats ahead.\nThe interesting tension is loadout planning: the mech has limited hardpoint slots\n(arms, shoulders, back) and each weapon has weight, ammo, and range tradeoffs.\nA missile rack dominates at range but leaves the mech vulnerable up close; dual\nautocannons shred nearby targets but overheat. Missions yield salvage from\ndestroyed enemies that funds new weapons and chassis upgrades, creating a\nsatisfying loop of deploy, destroy, salvage, customize, redeploy.\n\n## What the Player Experiences\n\nThe player opens to a hangar screen showing their mech with labeled hardpoints.\nAvailable weapons are listed in an armory panel; dragging a weapon onto a\nhardpoint equips it, with weight and energy constraints shown. Selecting a\nmission from the campaign map deploys the mech into a top-down battlefield.\n\nThe mech moves with WASD (slower than infantry, with momentum), rotates the\ntorso independently with mouse aim, and fires equipped weapons with mouse\nbuttons and number keys. Missions have objectives: destroy all enemies, defend a\npoint, escort a convoy, or eliminate a target. Enemy variety includes infantry,\nlight vehicles, rival mechs, and turret emplacements. Destroying enemies drops\nsalvage crates collected on contact. Mission completion shows a debrief with\nsalvage earned, damage taken, and accuracy stats. The campaign spans 8+ missions\nwith escalating difficulty and a final boss mech encounter.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/wo