 - id: platformer-echo-climb
   label: "平台跳跃 · Echo Climb"
   prompt: "# Echo Climb\n\nBuild **Echo Climb**, a tower-climbing platformer where past runs become ghost\nplatforms in Godot 4 at `/workspace/game/`. This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam\nas a polished vertical slice.\n\n## Core Vision\n\nA climber ascends an impossibly tall tower, but the tower is mostly empty air.\nThe trick: every failed attempt leaves behind a ghost that replays the run, and\nthe ghost's body becomes a solid platform for future attempts. The first run\nmight reach only a few ledges before falling. The second run can stand on the\nghost of the first to reach higher. Each attempt layers another ghost into the\ntower, gradually building a scaffold of past selves that makes previously\nimpossible heights reachable. The player decides when to sacrifice a run to\ncreate a useful stepping stone versus when to push for maximum height. A\npersistent best-height marker and ghost count track progress across sessions.\n\n## What the Player Experiences\n\nA title screen shows the tower stretching upward with ghost silhouettes\nvisible. Starting a run places the player at the tower base.\n\nThe climber can run, jump, and wall-slide. The tower has sparse fixed platforms\nbut large vertical gaps that seem impassable. When the player falls or quits,\nthe run is recorded as a ghost. On the next attempt, all previous ghosts replay\nsimultaneously — their bodies are semi-transparent but physically solid. The\nplayer can stand on ghosts, use them as moving platforms, or ride them upward.\n\nA height meter shows current altitude and best-ever altitude. Every five\nattempts the player can choose to \"solidify\" one ghost into a permanent\nplatform (it stops replaying and becomes a fixed ledge). The game saves ghost\ndata between sessions. Reaching milestone heights unlocks cosmetic trail\neffects for the climber.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Platformer；rubric 18 条（M5/D5/V4/A4，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: platformer-ink-trail
   label: "平台跳跃 · Ink Trail"
   prompt: "# Ink Trail\n\nBuild **Ink Trail**, a platformer where the player leaves a trail that becomes\nsolid platform after a delay in Godot 4 at `/workspace/game/`. This is not a\nprototype. It is a **complete, shippable micro-game** that could sit on an\nitch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nAn ink spirit dashes through empty voids, leaving behind a wet trail of ink\nthat solidifies into walkable platforms after a short delay. The spirit has\nlimited ink — once the reservoir empties, no more trail is created until\nreaching an ink well refill. The core puzzle: plan a path through empty space\nsuch that the trail you leave behind creates the platforms you need to reach\nthe exit. Sometimes you must double back to stand on your own trail. Sometimes\nyou must draw a bridge mid-jump and land on it as it solidifies. Ink wells are\nsparse, forcing efficient routing. Thirty-six levels across six worlds\nintroduce wind that displaces wet ink, erasers that dissolve trails, color-coded\nink that only solidifies near matching surfaces, and timed ink that fades after\nseconds.\n\n## What the Player Experiences\n\nA title screen shows ink dripping into the game name. A world-select grid shows\nsix worlds of six levels each.\n\nThe player moves and jumps normally. While moving, ink trails behind the\ncharacter as a visible wet line. After a 1-second delay, the wet ink hardens\ninto a solid platform with a satisfying visual pop. An ink meter shows remaining\nsupply — when empty, movement leaves no trail. Ink wells scattered in levels\nrefill the meter.\n\nEarly levels teach basic trail-platforming: cross a gap by running through air\nand doubling back onto your solidified trail. Later levels add complexity: wind\npushes wet ink sideways before it hardens, erasers delete sections of trail,\nand timed ink fades after a few seconds requiring speed. Each level has a\nthree-star rating based on ink efficiency. A level-complete screen shows ink\nused, time, and stars earned.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
