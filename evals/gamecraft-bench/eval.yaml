 - id: strategy-chess-variant
   label: "策略 · Chess Variant"
   prompt: "# Chess Variant\n\nBuild **Chess Variant**, a **tactical chess game with cooldowns and terrain** in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nClassic chess pieces gain special abilities on cooldown timers, and the board\nitself becomes terrain — some tiles heal, some damage, some block movement.\nThe result is a game that rewards chess intuition but demands new tactical\nthinking: a knight's fork matters less when the bishop can teleport every four\nturns, and controlling the healing fountain tile can swing an endgame. A\ncampaign mode unlocks new pieces and abilities level by level, teaching the\nplayer each mechanic before combining them into complex puzzles. The tone is\nmedieval-fantasy: stone boards, glowing runes, and pieces that feel like\nenchanted warriors.\n\n## What the Player Experiences\n\nFrom the title screen the player enters a campaign map with sequential levels.\nEach level is a chess puzzle or skirmish on a themed board with specific terrain\ntiles and piece rosters. Early levels teach one mechanic at a time — a piece\nwith a dash ability, a tile that blocks, a cooldown that must be tracked.\n\nDuring play the board shows terrain overlays on specific tiles: green for\nhealing, red for damage, grey for impassable. Pieces move by standard chess\nrules but each also has a unique ability (charge, shield, teleport, area\nattack) shown as a button with a cooldown counter. Using an ability consumes\nthe turn and starts the cooldown.\n\nThe AI opponent uses the same rules and abilities. Capturing the enemy king\nwins; losing yours loses. The campaign escalates by introducing new piece types\nwith new abilities and more complex terrain layouts. Completing a level unlocks\nthe next and sometimes adds a new piece to the player's roster for future\nlevels.\n\nA styled result screen shows victory or defeat with the option to retry or\nadvance.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Strategy；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: strategy-hex-conquest
   label: "策略 · Hex Conquest"
   prompt: "# Hex Conquest\n\nBuild **Hex Conquest**, a **turn-based hex-grid conquest strategy game** in Godot 4\nat `/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nTwo factions clash over a hex-tiled continent shrouded in fog. Each turn the\nplayer spends income from captured cities to recruit units, moves armies across\nterrain that shapes every engagement, and pushes the fog back tile by tile. The\ntension lives in incomplete information: the enemy builds behind the fog, and\nevery advance risks stumbling into a prepared defense. Victory demands balancing\nexpansion for income against consolidation for defense, reading the map's\nchokepoints, and timing a decisive strike before the opponent's economy\noutpaces yours.\n\n## What the Player Experiences\n\nFrom the title screen the player picks a faction — each has a distinct roster\nand economic bonus that shapes early strategy. The map generates with cities,\nforests, mountains, and plains on a hex grid, fog covering everything beyond\nthe player's starting territory.\n\nEach turn has clear phases: collect income from owned cities, recruit units at\ncities, move units across hexes, and attack adjacent enemies. Terrain matters —\nforests slow movement, mountains block it, rivers cost extra to cross. Units\nhave types: infantry hold ground cheaply, cavalry strike fast, and siege units\ncrack fortified cities.\n\nFog lifts only around the player's units, so scouting is a real investment.\nThe AI opponent expands, builds, and attacks with its own strategy. Capturing\na city flips its income to the conqueror and pushes the front line forward.\n\nThe game ends when one faction controls all cities or destroys the enemy's last\nunit. A styled result screen shows the outcome with territory statistics and\noffers a rematch.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspa