 - id: platformer-stealth-shadow-courier
   label: "平台跳跃 · Stealth: Shadow Courier"
   prompt: "# Stealth: Shadow Courier\n\nBuild **Shadow Courier**, a compact **top-down stealth infiltration game** in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nThe fantasy is being a lone courier who survives not by fighting but by reading\nthe room -- memorizing patrol rhythms, threading gaps in overlapping vision\ncones, and choosing the exact moment to slip through a door or kill the lights.\nThe interesting tension is that every objective changes the player's exposure:\npicking up the key means crossing a lit corridor, stealing the document means\nlingering in the most guarded room, and reaching the exit means retracing ground\nwhere patrols have shifted. The pressure comes from the gap between what the\nplayer can see (cone arcs, shadow pools, locked routes) and what they must risk\nto advance. One miscalculated step collapses the whole plan into alarm bells and\nclosing nets.\n\n## What the Player Experiences\n\nThe player arrives at a dark, atmospheric title screen that establishes the\ncovert tone -- the game name, a shadowy facility silhouette, and a way to begin.\n\nA brief mission briefing sets the stakes: an archive holds a sealed document,\nguards patrol the corridors, and the courier must get in, steal it, and get out\nunseen.\n\nControl begins in a top-down facility map. The courier moves smoothly through\nrooms and corridors, hugging walls and cover objects. Guards walk visible patrol\nroutes, their vision cones sweeping ahead of them like searchlights. The player\nreads the timing, waits for a gap, and slips past -- or finds another way\naround.\n\nDeeper in, a locked door blocks the direct path. The player hunts for a key or\ncredential, picks it up, and sees the HUD confirm possession. A light switch or\nfuse box offers a different kind of power: flipping it plunges a section into\ndarkness, shrinking guard awareness and opening shadow routes that were\npreviously exposed.\n\nThe document sits in the most dangerous room. Stealing it updates the mission\nstate and shifts the objective to escape. The player retraces or finds a new\nroute to the exit, now aware that patrol timing has changed or alert levels have\nrisen.\n\nGetting spotted triggers escalation -- a warning state, then capture if the\ncourier lingers. Reaching the exit with the document produces a styled success\nscreen; getting caught produces a failure screen. Either way, retry and\nreturn-to-title controls keep the player in the loop without restarting the\napplication.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Platformer；rubric 18 条（M5/D5/V4/A4，mean 6），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: platformer-thunder-valkyrie
   label: "平台跳跃 · Thunder Valkyrie"
   prompt: "# Thunder Valkyrie\n\nBuild **Thunder Valkyrie**, a 2D vertical scrolling bullet-hell shoot-'em-up in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nA lone starfighter threads through mathematically dense curtains of enemy fire,\nwhere every pixel of the hitbox matters and every split-second dodge buys another\nbreath. The tension lives in reading bullet geometry: patterns sweep, spiral, and\nconverge while the player traces the one safe seam through the chaos. Between\nsorties the pilot reinvests plundered gold into hull upgrades, sub-weapons, and\nwingman attachments, reshaping how the next wave feels. The tone is bright,\nkinetic, and relentless — an arcade reflex challenge wrapped in deep-space neon\nand spectacular particle destruction.\n\n## What the Player Experiences\n\nA styled title screen introduces the game with a cosmic backdrop and a clear\npath into the hangar.\n\nIn the hangar the player reviews their persistent loadout — starfighter level,\nshield type, sub-weapon, wingman — and spends gold earned from prior runs to\nupgrade slots. Each upgrade visibly changes projectile patterns or survivability\nfor the next sortie.\n\nFrom a sector map the player selects a constellation stage. Each stage has a\ndistinct stellar backdrop and its own enemy composition. Locked stages remain\ngated until the previous boss falls.\n\nOnce deployed, the screen scrolls vertically over a layered starfield. The\nstarfighter moves smoothly in response to input, its tiny glowing core hitbox\nthe only vulnerable point. Primary lasers fire continuously; sub-weapons and\nwingmen add flanking fire. Waves of enemy interceptors enter in geometric\nformations, releasing scripted bullet configurations that sweep downward. Elite\ncapital ships drop red power crystals; collecting them triggers a frenzy state\nthat doubles fire rate and vacuums nearby pickups.\n\nEach stage culminates in a multi-phase boss that locks the scroll and floods the\narena with layered patterns. Taking damage degrades the shield; if it breaks the\nrun ends with a results overlay showing gold earned and waves survived. Defeating\nthe boss unlocks the next stage and awards premium components.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x,