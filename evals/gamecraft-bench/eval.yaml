 - id: tycoon-gladiator-arena
   label: "经营模拟 · Gladiator Arena"
   prompt: "# Gladiator Arena\n\nBuild **Gladiator Arena**, a **gladiator arena management tycoon game** in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nThe player owns a gladiatorial arena in a fantasy-Roman setting, recruiting\nfighters, training them, scheduling bouts, and upgrading the arena to attract\nbigger crowds and richer sponsors. Each gladiator has stats, a fighting style,\nand a personality — some are crowd favorites who draw spectators, others are\nefficient killers who win but bore the audience. The tension is between\nspectacle and survival: the crowd wants blood and drama, but dead gladiators\nare expensive to replace. Betting adds a layer of risk-reward: the player can\nwager on their own fighters for extra gold, but upsets happen. The tone is\nsand-and-steel grandeur: roaring crowds, clashing weapons, and the drama of\nthe arena floor.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new arena season. The main view\nshows the arena compound: training grounds, barracks, the arena floor, and a\nmanagement office. Time advances day by day toward scheduled fight nights.\n\nGladiators are recruited from a slave market or free-fighter pool — each has\ncombat stats (strength, speed, defense), a weapon preference, and a crowd\nappeal rating. Training improves stats over days but costs food and trainer\nfees. The player assigns training regimens: strength drills, sparring, or\nshowmanship practice.\n\nFight nights are scheduled on the calendar. The player picks matchups from\ntheir roster against visiting challengers or rival arena fighters. During\nfights, gladiators battle automatically based on their stats and style — the\nplayer watches but cannot intervene. Crowd excitement builds with dramatic\nmoments (near-deaths, comebacks, finishing moves).\n\nRevenue comes from ticket sales (based on crowd size), sponsor deals (based on\narena prestige), and betting winnings. Expenses include gladiator upkeep,\ntraining costs, arena maintenance, and medical bills for injured fighters.\n\nThe game tracks gold, arena prestige, and season wins. A styled result screen\nshows season statistics and champion gladiator highlights.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Tycoon；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: tycoon-music-label
   label: "经营模拟 · Music Label"
   prompt: "# Music Label\n\nBuild **Music Label**, a **music label management tycoon game** in Godot 4 at\n`/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nThe player runs an independent music label, signing artists, producing albums,\nmarketing releases, and scheduling tours. Each artist has a genre, talent\nlevel, morale, and fanbase that grow or shrink based on management decisions.\nThe market shifts — genres trend up and down, and timing a release to ride a\nwave multiplies sales. The tension is resource allocation: studio time is\nlimited, marketing budgets are finite, and pushing an artist too hard burns\nthem out. The tone is creative-industry drama: recording studios, chart\nbattles, and the thrill of a breakout hit.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new label. The main view shows the\nlabel dashboard: signed artists, upcoming releases, financial summary, and\ngenre trend charts. Time advances week by week.\n\nArtists are scouted from a pool — each has a genre, talent rating, and\npersonality traits that affect studio behavior. Signing costs an advance and\ncommits to producing their album. In the studio, the player allocates\nproduction weeks and chooses a producer style (polished, raw, experimental)\nthat affects album quality and genre fit.\n\nMarketing is a budget allocation: spend on social media, radio, press, or\ntouring. Each channel reaches different audiences and has diminishing returns.\nTiming matters — releasing during a genre's peak trend multiplies exposure.\n\nTours generate revenue and grow fanbases but cost money upfront and drain\nartist morale. An exhausted artist produces worse albums and may leave the\nlabel. The player must balance exploitation against artist care.\n\nRevenue comes from album sales, streaming royalties, tour profits, and\nmerchandise. Expen