 - id: puzzle-sokoban-dungeon
   label: "解谜 · Sokoban Dungeon"
   prompt: "# Sokoban Dungeon\n\nBuild **Sokoban Dungeon**, a 2D turn-based crate-pushing dungeon puzzle in\nGodot 4 at `/workspace/game/`. The player pushes crates through procedurally\ngenerated dungeon rooms while enemies move simultaneously on each turn,\ncollecting keys and items to unlock deeper floors.\n\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe game is a turn-based puzzle-roguelike hybrid where every player step\ntriggers an enemy step. Each dungeon room is a spatial puzzle: crates must be\npushed onto pressure plates to open doors, but enemies patrol the grid and\nmove toward the player whenever the player moves. The tension comes from the\nsimultaneous-turn system — pushing a crate takes a turn, during which enemies\nclose in, so the player must solve spatial puzzles under mounting threat. Keys\nunlock new rooms, items provide one-use abilities (freeze enemies, pull crates,\nteleport), and procedural room layouts ensure variety. The best version feels\nlike chess merged with a warehouse puzzle, where every move has tactical\nconsequences.\n\n## What the Player Experiences\n\nA title screen sets the dungeon tone with stone textures and a clear way to\nbegin. The player enters a dungeon room where walls, crates, pressure plates,\nlocked doors, keys, enemies, and the exit staircase are visible on a grid.\nMovement is turn-based: arrow keys move one tile, and all enemies move one\ntile simultaneously.\n\nEarly rooms teach basic pushing: move a crate onto a plate to open a door.\nSoon enemies appear that mirror the player's movement timing, forcing the\nplayer to plan push sequences that also avoid or trap threats. Mid-game\nintroduces multiple crate types (heavy crates need two pushes, ice crates\nslide until hitting a wall), keys that unlock color-coded doors, and items\nfound in chests. Late rooms combine all mechanics in procedurally arranged\nlayouts where the player must solve the spatial puzzle while managing enemy\npositions.\n\nAn undo system lets the player rewind turns. Reaching the exit staircase\nadvances to the next floor. Death from enemy contact offers retry. The\ncampaign generates increasingly complex floors with more enemies, more crate\ntypes, and tighter spatial constraints.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Puzzle；rubric 14 条（M4/D4/V3/A3，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: racing-drift-circuit
   label: "竞速 · Racing Drift Circuit"
   prompt: "# Racing Drift Circuit\n\nBuild a Racing Drift Circuit in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nA precision time-trial racing game where mastering the drift is everything. The\nplayer pilots a car through tight circuits, initiating controlled drifts around\ncorners to maintain speed. Each track is a puzzle of racing lines — brake too\nearly and you lose seconds; drift too wide and you clip the barrier. Ghost\nreplays of your best run haunt every attempt, pushing you to shave milliseconds.\nA medal system (Gold/Silver/Bronze) across 10+ tracks provides clear progression\ngoals, and the satisfaction of a perfect drift chain through a complex chicane\nis the core reward.\n\n## What the Player Experiences\n\n1. **Title Screen** — A dynamic menu with the game name in speed-styled italic\n   font, a blurred track in the background with a ghost car drifting past, and\n   buttons for Campaign and Time Trial. No plain Godot grey.\n2. **Track Select** — A grid of 10+ tracks with preview thumbnails, medal\n   status (empty/bronze/silver/gold), and best time displayed. Tracks unlock\n   sequentially by earning at least bronze on the previous track.\n3. **Driving Feel** — Top-down or angled-top view. The car accelerates smoothly,\n   brakes with visible deceleration, and steers with momentum. Holding a drift\n   key while turning initiates a drift: the car slides sideways with tyre smoke\n   particles trailing behind.\n4. **Drift Boost** — Maintaining a drift builds a boost meter. Releasing the\n   drift at the right moment grants a speed burst with a visible flame/trail\n   effect. Longer drifts yield bigger boosts but risk hitting walls.\n5. **Ghost Replay** — A translucent ghost of the player's best lap drives\n   alongside them in real time. The ghost is clearly distinguishable (different\n   colour, slight transparency) and shows exactly where time is being gained\n   or lost.\n6. **Medal System** — Each track has Gold/Silver/Bronze time thresholds shown\n   before the race. Finishing awards the appropriate medal with a podium\n   animation. Medals are tracked on the track select screen.\n7. **Track Variety** — Tracks range from simple ovals to complex circuits with\n   hairpins, chicanes, elevation changes (visual only), and varying widths.\n   Each track has a distinct visual theme (city, desert, forest, night).\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
