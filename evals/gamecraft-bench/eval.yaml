 - id: puzzle-lemming-factory
   label: "解谜 · Lemming Factory"
   prompt: "# Lemming Factory\n\nBuild **Lemming Factory**, a 2D creature-guiding puzzle game in Godot 4 at\n`/workspace/game/`. The player assigns jobs to a stream of marching factory\nworkers — diggers, builders, blockers, climbers — to guide them safely from\nan entrance hatch to an exit door, saving a required quota each level.\n\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe game is a real-time puzzle about indirect control. Creatures march\nautonomously in a straight line, turning at walls, falling off ledges, and\nwalking into hazards unless the player intervenes. The player cannot move\ncreatures directly but can click on individual workers to assign them a job\nfrom a limited toolbar. Each job transforms the creature's behavior: diggers\ncarve downward through terrain, builders construct diagonal staircases, blockers\nbecome impassable walls that redirect traffic, and climbers scale vertical\nsurfaces. The tension comes from limited job supplies, time pressure as\ncreatures march toward danger, and the spatial reasoning needed to route a\ncrowd through complex terrain. The best version feels like conducting an\norchestra of tiny workers where every assignment ripples through the crowd's\npath.\n\n## What the Player Experiences\n\nA title screen sets the factory tone with marching creature silhouettes and a\nclear way to begin. The player enters a level where terrain, hazards (pits,\nsaws, lava), an entrance hatch, and an exit door are visible. A toolbar shows\navailable jobs with remaining counts. The hatch opens and creatures begin\nmarching out at a steady rate.\n\nEarly levels teach one job at a time: assign a digger to carve through a floor,\nor a builder to bridge a gap. Soon levels require combining jobs — a blocker\nredirects traffic while a digger opens an alternate path. Mid-game introduces\nclimbers for vertical navigation, floaters for safe falls, and bombers for\nemergency terrain removal. Each level specifies a save quota; losing too many\ncreatures to hazards means failure.\n\nThe player can adjust release rate and pause to plan. When enough creatures\nreach the exit, a results screen shows the save percentage and offers the next\nchallenge. The campaign has levels grouped into difficulty tiers, each\nintroducing new terrain types and job combinations.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Puzzle；rubric 14 条（M4/D4/V3/A3，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: puzzle-pipe-crisis
   label: "解谜 · Pipe Crisis"
   prompt: "# Pipe Crisis\n\nBuild **Pipe Crisis**, a 2D pipe-routing puzzle game in Godot 4 at\n`/workspace/game/`. The player places and rotates pipe segments on a grid to\nroute colored fluids from sources to matching drains before pressure builds\nand the system overflows.\n\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe game is a time-pressure spatial puzzle built on fluid routing. Each level\nhas one or more fluid sources that begin pumping after a countdown. The player\nmust lay pipe segments from a queue onto a grid, rotating and placing them to\ncreate continuous paths from each source to its matching drain. The tension\ncomes from the countdown timer and multiple fluid types: red chemicals cannot\nmix with blue coolant, green acid dissolves standard pipes, and crossing paths\nrequire special junction pieces. The best version feels like a frantic plumbing\nemergency where every second of planning pays off when the fluids start flowing\nand the paths light up with color.\n\n## What the Player Experiences\n\nA title screen sets the industrial tone with pipe imagery and pressure gauges.\nThe player enters a grid-based facility where sources, drains, obstacles, and\nempty cells are visible. A pipe queue shows upcoming pieces. The countdown\ntimer ticks toward flow start.\n\nEarly levels teach basic routing: connect one source to one drain with simple\nstraight and corner pipes. Soon multiple sources demand parallel paths, color\nmatching prevents cross-contamination, and obstacles force creative detours.\nMid-game introduces special pipe types: cross junctions that allow two fluids\nto pass without mixing, reservoir tanks that buy extra time, and acid-resistant\npipes for corrosive fluids. Late levels combine all mechanics with tight\ntimers and complex multi-source layouts.\n\nWhen flow begins, fluid visibly travels through the pipes. Successful routing\nfills the drain and completes the level. Overflow from dead ends or mixing\nviolations triggers a failure state. A results screen shows completion time\nand efficiency rating. The campaign progresses through themed facilities with\nescalating routing demands.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
