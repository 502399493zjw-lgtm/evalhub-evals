 - id: tycoon-dungeon-master
   label: "经营模拟 · Dungeon Master"
   prompt: "# Dungeon Master\n\nBuild **Dungeon Master**, a **dungeon management tycoon game** in Godot 4 at\n`/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nThe player is the villain: dig rooms in the earth, fill them with traps and\nmonsters, and watch greedy heroes stumble in to be defeated. But monsters are\nnot free — they need gold to recruit, food to keep happy, and rooms that suit\ntheir nature. Heroes arrive in waves of increasing strength, and each one that\nescapes spreads word of an easy dungeon, attracting tougher adventurers. The\ntension is economic: gold comes from defeated heroes' loot, but spending it all\non offense leaves nothing for creature comforts, and unhappy monsters desert.\nThe fantasy is running an evil enterprise where the product is doom and the\ncustomers are uninvited.\n\n## What the Player Experiences\n\nFrom the title screen the player starts a new dungeon. The view shows a\ncross-section of earth. The player digs rooms by spending gold, creating a\nlayout of corridors and chambers. Each room can be designated: treasure rooms\nlure heroes deeper, trap rooms damage them, barracks house monsters, and\nhatcheries produce food.\n\nMonsters are recruited from a roster — each type has a gold cost, preferred\nroom type, and combat strength. Placing monsters in rooms they like keeps\nmorale high; cramming them into unsuitable spaces makes them grumpy and\neventually causes desertion. The creature happiness meter is always visible.\n\nHeroes arrive periodically, entering from the surface and navigating toward\ntreasure. They fight monsters, trigger traps, and either die (dropping loot)\nor escape. Escaped heroes increase the dungeon's fame, attracting stronger\nparties next wave. The player must balance dungeon depth, trap density, and\nmonster strength against the escalating threat.\n\nThe game tracks gold, creature count, and waves survived. A styled result\nscreen shows dungeon statistics when the dungeon heart is destroyed by heroes\nor a wave milestone is reached.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Tycoon；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: tycoon-farm
   label: "经营模拟 · Tycoon: Village Farm"
   prompt: "# Tycoon: Village Farm\n\nBuild a **2D village-farm tycoon** in Godot 4 at `/workspace/game/`.\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe player inherits a small plot of land and turns it into a living farm through\ndaily ritual. The fantasy is cozy accumulation — waking each morning to tend\ncrops that grew overnight, selling the harvest for just enough gold to plant\nsomething new, and watching the homestead slowly fill with colour and life. The\ninteresting tension is that every day is finite: stamina runs out before\nambition does, so the player must choose which chores matter most right now.\nThe pressure is gentle but real — skip watering and crops stall, overextend and\ntomorrow starts hungry. The risk is never catastrophic, just the quiet cost of\na wasted day. Over many mornings the farm transforms from bare dirt into a\nthriving patchwork, and the satisfaction is entirely earned one tile at a time.\n\n## What the Player Experiences\n\nThe player opens a saved farm or starts fresh and sees their homestead — a\nfenced plot of tillable earth, a farmhouse, a shop, and water glinting at the\nedge. Early mornings are simple: till a few squares, drop seeds, water them,\nand head inside to sleep. Each action visibly marks the land and costs a sliver\nof the day's energy.\n\nAs gold accumulates the player diversifies — new seed types with longer growth\nbut bigger payoffs, a fishing spot for side income, maybe an expanded field.\nThe daily loop stays the same but the decisions inside it deepen: which crops\nto prioritize, when to harvest versus when to water the next batch, whether to\nspend the last stamina fishing or saving it for tomorrow's planting.\n\nCrops grow only overnight, so sleeping is the punctuation that gives each day\nmeaning. The morning reveal — seeing sprouts advance a stage, mature plants\nready to pick — is the hook that pulls the player into one more day. Progress\nis banked at bedtime, so a returning player wakes to the same farm, the same\nseason of growth, and the same quiet momentum.\n\nThe art direction is warm, sunlit, cartoon-pastoral — greens, ochres, soft\nwood — never naked Godot grey. The tone is gentle and unhurried, the opposite\nof a twitch game.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Tycoon；rubric 17 条（M5/D4/V4/A4，mean 7），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: tycoon-funfair
   label: "经营模拟 · Tycoon: Funfair"
   prompt: "# Tycoon: Funfair\n\nBuild a **grid-based theme-park management tycoon** in Godot 4 at\n`/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nThe fantasy is turning a bare patch of land into a roaring amusement park that\npeople love to visit. The player is part architect, part accountant: every path\nlaid and ride placed shapes how a living crowd moves, spends, and feels. The\ninteresting tension is that growth feeds on itself — a happy crowd generates the\ncash to build more attractions, which draws a bigger crowd — but the snowball\nworks in reverse too. Neglect paths, gouge prices, or let queues balloon and the\npark empties faster than it filled. The pressure comes from balancing ambition\nagainst the crowd's patience: expand too fast and you're broke, too slow and\nguests get bored. The risk is always that one bad decision — a dead-end path, a\nprice hike, a missing amenity — quietly poisons satisfaction before the numbers\ncatch up.\n\n## What the Player Experiences\n\nThe player starts with an empty lot, a gate, and a small pile of cash. The first\nminutes are about laying a spine of paths out from the entrance and dropping a\nfirst ride — watching the first handful of guests trickle in and spend money is\nthe hook. From there the arc is organic growth: earnings fund new rides and\nstalls, the crowd swells, and the grid fills with colour and motion.\n\nWhat the player notices most is the crowd itself — little visitors streaming\nalong paths, pooling at popular rides, drifting toward food stalls. A well-built\npark hums with movement; a badly planned one has lonely corners and bottlenecks.\nThe satisfaction readout and the cash counter tell the story at a glance, but the\nreal feedback is visual: a thriving park looks busy and alive.\n\nPricing is the lever that keeps things interesting even in a mature park. Charge\nmore and each guest is worth more, but fewer come and they leave sooner. Drop\nprices and the gates flood, but margins thin. The player is always tuning this\ndial alongside layout decisions — where to put the next ride, whether to upgrade\nan existing one into a headline attraction, when to add another food stall to\nkeep the far side of the park happy.\n\nOver time the lot transforms from a bare grid into a sprawling, bustling\nfairground. Progress persists across sessions, so the player returns to the same\npark and picks up where they left off. The tone throughout is bright, cheerful,\nand colourful — a sunlit carnival of spinning rides and candy colours.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
