id: gamecraft-bench
protocol_revision: 1
cover: assets/cover.webp
name: GameCraft-Bench（真实引擎里的端到端做游戏）
category: useful
description: >-
  GameCraft-Bench 考察 Agent 能不能把一段自然语言游戏需求，做成一个在 Godot 4 里真能跑起来的完整 2D 游戏：
  140 道题覆盖平台跳跃、策略、经营、开放世界、Roguelike、视觉小说等 15 个游戏族，每题都要交出可启动的工程，
  外加自己写的确定性输入轨迹。判分不看代码，只看游戏被真人式操作时屏幕上发生了什么——验分器先用无头命令验证工程能否启动，
  启动失败直接 0 分；能启动才回放轨迹、录屏抽帧，交给多模态裁判按一份对 Agent 隐藏的评分细则打分，
  分成核心机制、内容深度、可读视觉、美术表现四类合成本题得分。
hook_title: 你的 Agent 能做出一个真能玩的游戏吗
upstream:
  repo: FreedomIntelligence/gamecraft-bench
  commit: 7385d326fb25ba9af8b353615987bf680a25b657
  paper: https://arxiv.org/abs/2606.17861
references:
  homepage: https://tongxuluo.github.io/gamecraft-bench-website/
  repository: https://github.com/FreedomIntelligence/gamecraft-bench
  paper: https://arxiv.org/abs/2606.17861
dimensions: [代码, 推理]
interface: agent
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: required
baseline_policy: required
score_unit: 分
scoring_note: >-
  参赛方必须在上游官方仓库钉死的 commit 7385d326 上，用官方验分器
  `python -m gamecraft_bench.verifier` 跑完全部 140 道题，不得替换判分链路、不得改动 tests/rubric.json、
  不得自行放宽闸门命令或提高 demo 上限。每题判分口径完全由上游代码决定：先在 shell 里跑闸门命令
  `godot --headless --path /workspace/game --quit-after 5`，退出码为 0 则 BUILD=1，否则 BUILD=0——
  BUILD=0 时验分器直接跳过回放与判分，该题得 0 分。BUILD=1 时按文件名取前 10 个 demo_outputs/*.json 轨迹，
  逐个在 Xvfb 虚拟屏上以 1280×720、30 fps 重启一次游戏并用合成鼠标键盘事件回放，ffmpeg 录屏并压到 854×480，
  每 0.5 秒抽一帧；超过 20 秒的录像按 demo_id 确定性随机抽取一个 20 秒连续窗口。每个 demo 调用一次多模态裁判，
  一次性给出该题全部 requirement 的 0–1 分，裁判最多尝试 5 次（即首次加 4 次重试），仍失败则该 demo 全部 requirement 记 0。
  每条 requirement 先跨 demo 聚合（rubric 里 agg=max 的取最大值、agg=mean 的取均值，无可用 demo 记 0），
  再按 rubric 的 score_formula 合成本题得分：BUILD ×（各类 requirement 等权均值再按类权重加权），结果裁剪到 [0,1]。
  四类为 Core Mechanics、Content Depth、Functional Visuals、Presentation & Art；140 题中 132 题以十进制公式写作
  0.15/0.35/0.15/0.35，openworld-fishing 与两道策略题以不同但数学等价的写法使用同一权重，
  5 道视觉小说题（visualnovel-arcaneacademy、visualnovel-grimfable、visualnovel-keepsake、
  visualnovel-lastsignal、visualnovel-pactbound）为 0.20/0.30/0.15/0.35，每题权重之和均为 1。
  总分 = 140 题得分的等权平均 × 100，按上游榜单口径保留两位小数；提交清单必须给出全部 140 道题的逐题成绩，
  转换器会与 upstream.commit 上的任务集合逐一核对，缺题、多题或重复即拒收。
  上游默认裁判为 openai 后端的 gpt-5.5；换裁判模型即改变可比性，不能与本榜现有成绩同列。
  scored_by=author 表示转换器只做结构、协议边界与计数合法性的确定性校验，
  成绩仍须评测作者核对官方验分器产物（reward.txt、breakdown.json、judge_log.json、build.log 与逐 demo 的
  mp4/抽帧）后才认可；启动失败、无轨迹、轨迹不可解析与裁判失败一律保持为低分或 0 分，不豁免、不重试补分。
command_template:
  argv: [node, evals/gamecraft-bench/pack-to-result.mjs, "{input}", --out, "{output}"]
  output: gamecraft-bench-result.json
trials: 1
detail_profile:
  source_kind: upstream_publication
  overview_note: >-
    下面的协议说明来自钉死在 commit 7385d326 的官方作者仓库（140 份任务题面、隐藏 rubric 与验分器源码）、
    论文 arXiv:2606.17861v1（2026-06-16 提交，CC BY 4.0）与官方项目页 2026-08-10 快照；
    判分细节以仓库里真正被执行的代码为准，逐条与论文表述交叉核对过。
  summary:
    plain_language: >-
      Agent 拿到的是一段散文式的游戏需求（世界观、玩家会经历什么、要有哪些系统），要交出两样东西：
      一个放在 /workspace/game/ 的完整 Godot 4 工程，和 1–10 个自己写的输入轨迹 JSON——
      轨迹里逐帧写明什么时候点哪个坐标、按哪个键，用来向验分器演示这游戏真的能玩。
      验分器不读代码，而是照着轨迹把游戏重新启动、真的操作一遍、录下屏幕，再让多模态裁判看录像和抽帧，
      判断需求里的每一条到底有没有在画面上被演示出来。工程启动不了，这题直接 0 分。
    why_it_matters: >-
      做游戏是少有的"必须让脚本、场景、资源、渲染、运行时配置和玩家交互同时成立"的任务：
      单独看每个文件都对，合起来跑不起来或者玩不动，就等于没做完。
      传统代码评测大多只验单元测试或片段正确性，测不出这种整体可运行性；
      这套评测把判分放在"真实引擎里被操作时屏幕上发生了什么"，逼着 Agent 交出可交付的成品而不是能过测的片段。
  method_steps:
    - title: 发题与工作区
      description: >-
        每题给出一份 instruction.md 散文需求（核心愿景、玩家体验，以及交付格式、轨迹格式的统一说明），
        一个 Godot 工作区，以及两个只读挂载的 2D 资产库（Kenney 与 OpenGameArt，后者每个子目录带自己的 LICENSE.txt）。
        评分细则放在 /tests/rubric.json，Agent 阶段拿不到内容，属于隐藏 rubric。单题给 Agent 的名义预算是 7200 秒。
    - title: 交付工程与输入轨迹
      description: >-
        Agent 要在 /workspace/game/ 交出完整工程，并在 demo_outputs/ 下放 1–10 个确定性轨迹 JSON，
        每个含 duration_frames（≤600，即 30 fps 下 20 秒）与按帧排序的事件序列，
        支持 mouse_click/mouse_down/mouse_up/mouse_move/key_press/key_down/key_up/wait，坐标按 1280×720 视口。
        需要特定局面的演示要实现 `-- --scenario <id>` 入口：跳过菜单、确定性地构造该状态并立即接受输入。
    - title: 启动闸门
      description: >-
        验分器先在 shell 里跑 `godot --headless --path /workspace/game --quit-after 5`，
        退出码 0 才算 BUILD=1。BUILD=0 时直接跳过回放与判分，该题记 0 分——工程能不能起来是硬前提。
    - title: 回放录屏取证
      description: >-
        BUILD=1 后按文件名取前 10 个轨迹，逐个在 Xvfb 虚拟屏上重启游戏，用 xdotool 注入合成鼠标键盘事件回放，
        ffmpeg 录制 1280×720 画面并压到 854×480，每 0.5 秒抽一帧。
        录像超过 20 秒时按 demo_id 确定性随机取一个 20 秒连续窗口，保证复跑抽到同样的帧。
    - title: 多模态裁判按隐藏细则打分
      description: >-
        每个 demo 调用裁判一次，一次性对该题全部 requirement 给 0–1 分（0 未演示、0.5 部分演示、1 清晰演示）；
        裁判最多尝试 5 次（首次加 4 次重试），仍失败则该 demo 全部 requirement 记 0。每题 12–21 条 requirement，全库共 2305 条。
    - title: 合成本题分与总分
      description: >-
        每条 requirement 先跨 demo 聚合（agg=max 取最大值，agg=mean 取均值），
        再按 score_formula 合成：BUILD ×（四类各自 requirement 等权均值，按类权重加权），裁剪到 [0,1]。
        140 题得分等权平均 ×100 即榜单总分。
  score_interpretation: >-
    分数是百分制总分，越高越好，单位是分，理论上限 100，等于 140 题各自 [0,1] 得分的等权平均再乘 100。
    它衡量的是"隐藏评分细则里的各项要求，有多大比例真的在可操作的游戏画面里被演示出来"，
    而不是代码风格或单元测试通过率。因为每题都乘以启动闸门，一个起不来的工程无论代码多完整都记 0 分。
    四个分项 Mechanics/Depth/Visuals/Art 对应 Core Mechanics、Content Depth、Functional Visuals、
    Presentation & Art 四类，只作解释用，不参与排序。比较边界：同一个来源 commit 7385d326 的 140 道题与隐藏 rubric、
    同一套 Godot 4.6.2-stable 与 Xvfb/xdotool/ffmpeg 取证链路、同一个多模态裁判 gpt-5.5、
    每题至多 10 个 demo 与 20 秒取证窗口。换裁判模型、改闸门命令或放宽 demo 上限都会破坏可比性。
  key_facts:
    - value: 140 题 / 15 个游戏族
      label: 任务规模（不含 example 模板题）
      description: 平台跳跃 19、策略 17、经营 16、开放世界 15、Roguelike 14、视觉小说 11、解谜 8、射击 7、模拟 6、卡牌 5、恐怖 5、音乐节奏 5、放置 4、竞速 4、体育 4。
      source_url: https://github.com/FreedomIntelligence/gamecraft-bench/tree/7385d326fb25ba9af8b353615987bf680a25b657/tasks
    - value: 2305 条
      label: 隐藏评分细则的 requirement 总数
      description: 逐份统计 140 份 tests/rubric.json 的 requirements 得到；每题 12–21 条，按 Core Mechanics / Content Depth / Functional Visuals / Presentation & Art 四类归组。
      source_url: https://github.com/FreedomIntelligence/gamecraft-bench/tree/7385d326fb25ba9af8b353615987bf680a25b657/tasks
    - value: "65.72"
      label: 官方榜单当前最高总分
      description: Claude Code 编排、上游标识为 Fable 5 high 的配置，2026-07-20；同一榜单最低为 2.15。
      source_url: https://tongxuluo.github.io/gamecraft-bench-website/
    - value: "41.46"
      label: 论文期最强配置的总分
      description: 论文 v1（2026-06-16）主表 7 个配置中的最高分，由 Claude Code + Opus-4.7 high 取得。
      source_url: https://arxiv.org/abs/2606.17861
    - value: 10 个 / 20 秒
      label: 单题取证上限
      description: 每题最多回放 10 个轨迹，单个录像最多取 20 秒窗口，每 0.5 秒抽一帧交裁判。140 份 rubric 全部一致。
      source_url: https://github.com/FreedomIntelligence/gamecraft-bench/blob/7385d326fb25ba9af8b353615987bf680a25b657/gamecraft_bench/verifier/cli.py
    - value: gpt-5.5
      label: 上游默认多模态裁判
      description: 默认后端 openai 的默认模型；仓库另注册了 claude、opus、kimi、gemini 与 stub 五个可选后端。
      source_url: https://github.com/FreedomIntelligence/gamecraft-bench/blob/7385d326fb25ba9af8b353615987bf680a25b657/gamecraft_bench/verifier/judges/openai_gpt.py
  caveats:
    - title: 榜单跨越两个时间点，论文只覆盖其中 7 个配置
      description: >-
        论文 v1（2026-06-16）主表是 7 个配置、最高 41.46；官方榜单到 2026-08-10 已扩到 12 个配置、最高 65.72，
        新增的 Fable 5 high、GPT-5.6-sol high、Kimi-K3、Seele02-pro 与 Deepseek-V4-Flash-0731 都不在论文里。
        上游没有声明这几次新测与论文用的是否为同一版验分器、同一裁判模型，仓库也没有 tag 或 release 可区分版本。
        跨这两个时间点比较请谨慎。另外仓库 README 正文写最强配置为 65.70%，但同一页表格与官方项目页都写 65.72；
        本目录采用逐格数据 65.72，并如实记录这处来源自身的差异，不做平均或推断。
    - title: 本目录只收录 9 个可解析身份的配置，3 行如实略去
      description: >-
        官方榜单 12 行里，SeeleAgent · Seele02-pro（50.70）、Claude Code · Deepseek-V4-Flash-0731（30.66）
        与 Code Buddy · MiniMax-M2.7（10.95）
        在 EvalHub 平台模型注册表中没有对应条目，写进成绩文件会被身份校验判为未知模型；
        把它们改映射到别的模型属于事实篡改，因此这三行不进入成绩文件。完整 12 行官方榜单见 README、
        `official-full-leaderboard` 辅助视图与官方项目页。
        另外上游把推理档位写进模型字符串（Fable 5 high、GPT-5.6-sol high、GPT-5.5 high、Opus-4.7 high），
        平台注册表只认不含档位的 canonical 名，因此成绩文件用 Claude Fable 5 / GPT-5.6 Sol / GPT-5.5 /
        Claude Opus 4.7，并在每条成绩的 detail 里原样保留上游字符串与 high 档位；这是身份规范化，不改动任何分数。
    - title: 裁判是打分链路里最主要的不确定来源
      description: >-
        分数由多模态裁判看录像抽帧给出，仓库没有钉死裁判的采样温度或随机种子；
        论文用固定证据重复 10 次裁判来展示稳定性，但这属于经验证据而非固定解码配置。
        裁判连续失败 5 次会让该 demo 全部条目记 0，因此裁判侧的可用性问题会直接压低分数。
    - title: 覆盖面与不评项
      description: >-
        只覆盖 Godot 引擎里的 2D 游戏生成，不含 Unity/Unreal、3D、多人联机、大规模物理与长周期生产流程；
        判分只看可见的游戏行为，音频相关要求通过画面上的可见反馈间接体现；
        评测衡量的是"有没有按需求实现出可运行的机制、内容、视觉状态与表现"，不试图衡量游戏是否好玩。
    - title: 复现成本高，且依赖付费裁判与特定 Linux 取证栈
      description: >-
        单题名义预算是 Agent 7200 秒 + 验分 1800 秒（140/140 一致），多数题目为 1 CPU / 2048 MB，其中 7 道开放世界题为 4096 MB，另有少数 task.toml 省略了部分环境字段；跑满 140 题还要叠加每个 demo 一次的多模态裁判调用；
        取证链路需要 Ubuntu 环境下的 Godot 4.6.2-stable、Xvfb、xdotool 与 ffmpeg。
        这不是能在本地免费快速复跑的评测，被评 Agent 在解题阶段还允许联网。
