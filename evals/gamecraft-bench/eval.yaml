 - id: roguelike-train-heist
   label: "Roguelike · Train Heist"
   prompt: "# Train Heist\n\nBuild **Train Heist**, a procedural train-car roguelike with car-by-car\nencounters in Godot 4 at `/workspace/game/`. This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam\nas a polished vertical slice.\n\n## Core Vision\n\nA bandit boards the caboose of a procedurally generated train and must fight\nforward car by car to reach the engine before the train arrives at the station.\nEach car is a self-contained encounter: a passenger car with civilians to rob,\na guard car with armed defenders, a cargo car with locked safes to crack, a\ndining car with cover-based shootouts, or a mail car with time-locked vaults.\nThe bandit carries limited ammo and health, spending both as they push forward.\nLoot from earlier cars funds purchases at a black-market car that appears\nmid-train. A turn counter represents distance to the station — if it hits zero\nbefore reaching the engine, the heist fails. Each run generates a new train\nwith different car sequences and lengths.\n\n## What the Player Experiences\n\nA title screen shows a steam train silhouette against a sunset. Starting a run\nshows the full train in side-view with car types partially visible (some\nhidden).\n\nThe player enters the caboose and encounters the first car's challenge. Combat\nis turn-based with cover mechanics — the bandit and enemies take positions\nbehind furniture and exchange fire. Ammo is limited and must be looted from\nfallen guards. Passenger cars offer robbery choices: intimidate for quick cash\nor search thoroughly for better loot but risk alerting guards ahead.\n\nA progress bar shows position along the train and turns remaining. The black-\nmarket car offers health kits, ammo, special weapons, and disguises. Reaching\nthe engine triggers a boss fight against the conductor. Victory shows total\nloot, cars cleared, and turns remaining. Failure (health zero or time out)\nshows how far along the train the bandit reached.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Roguelike；rubric 18 条（M5/D5/V4/A4，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: roguelike-wildwood
   label: "Roguelike · Roguelike: Wildwood"
   prompt: "# Roguelike: Wildwood\n\nBuild a **node-map forest-exploration roguelike with turn-based combat** in\nGodot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nThe fantasy is reading a dangerous forest. Every fork in the trail is a bet\nplaced with incomplete information: claw marks on a trunk, smoke curling above\nthe canopy, a glint of metal in the undergrowth. The player pushes deeper not\nbecause the path is safe but because the clues make the risk feel knowable. When\na beast appears, combat is deliberate and positional — a small kit of skills\nspent against creatures that each punish a different mistake. Health never\nrefills for free, so every scratch from three clearings ago still matters at the\nfinal gate. Death is permanent for the run, but not for the player: banked gold\nand a dwindling supply of entry tickets give each expedition weight without\nmaking failure a dead end. The tone is hushed and watchful — dappled light,\ndistant howls, the crackle of a campfire earned by surviving one more node.\n\n## What the Player Experiences\n\nThe player begins at a trailhead camp that remembers them between sessions —\ntickets, gold, and whatever lasting advantages they have earned are all visible\nhere. Entering the forest costs a ticket, so the decision to set out already\ncarries stakes.\n\nOnce inside, the run unfolds as a branching map of trail nodes stretching deeper\ninto the wood. Nodes are not fully revealed; instead the map offers partial\nevidence — tracks, smoke, glitter, disturbed brush — that lets the player weigh\nrisk against their current health, gold, and depth. Committing to a node strips\naway the mystery: it might be a beast, a chest, a campfire, a trader, a trap, or\nsomething worse.\n\nCombat is turn-based and skill-driven. The hero carries several distinct\nabilities that cost a resource, and different beasts demand different responses —\na fast wolf, an armored bear, a venomous serpent. Lingering conditions like\npoison or bleed play out over multiple turns, rewarding the player who reads the\nthreat and plans ahead.\n\nBetween fights the player collects relics and gear that reshape how the hero\nfights, not just refill health. Growth within a run is tangible: new buttons, new\noptions, new ways to handle what the forest throws next.\n\nA run ends in victory — reaching the heart of the wood and overcoming its\nguardian — or in death, which sends the player back to camp minus a ticket but\nricher in banked gold. Progress persists across sessions, so quitting and\nreturning picks up the same hoard and the same slow accumulation of power.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
