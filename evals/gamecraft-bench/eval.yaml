 - id: strategy-plant-defense
   label: "策略 · Plant Defense"
   prompt: "# Plant Defense\n\nBuild **Plant Defense**, a **lane-based tower defense strategy game** in Godot 4\nat `/workspace/game/`. This is not a prototype. It is a **complete, shippable\nmicro-game** that could sit on an itch.io page or Steam as a polished vertical\nslice.\n\n## Core Vision\n\nA garden grid stands between a homestead and waves of encroaching creatures.\nThe player plants defenders on a multi-lane lawn, spending sunlight that must\nbe actively collected. Each plant type fills a tactical role — some shoot, some\nblock, some generate economy — and the creatures come in varieties that punish\na one-note defense. The tension is resource scarcity: sunlight arrives slowly,\nplants cost real economy, and a misplaced defender means a lane falls before\nreinforcements grow. An adventure map connects levels with escalating challenge\nand new plant unlocks, giving the player a reason to master each tool before\nthe next threat arrives.\n\n## What the Player Experiences\n\nFrom the title screen the player enters an adventure map showing a trail of\nlevels. Selecting a level shows the upcoming creature types and lets the player\npick a loadout of plant defenders from their unlocked roster.\n\nThe level plays on a grid of lanes. Sunlight drops periodically and the player\nclicks to collect it, building a resource pool. Plants are dragged from a\ntoolbar onto empty grid cells, each costing sunlight. Shooters fire\nprojectiles down their lane, walls absorb hits, and sun-producers accelerate\nthe economy. Creatures march from the right edge in waves, each lane\nindependent.\n\nCreature variety forces adaptation: armored types shrug off weak shots, fast\ntypes outrun slow-firing plants, and flying types bypass ground walls. Later\nlevels introduce night conditions where sun production drops, forcing the\nplayer to rely on alternative economy plants.\n\nA level is won when all waves are defeated; lost when any creature reaches the\nleft edge. Victory unlocks the next map node and sometimes a new plant type.\nThe result screen shows stars earned and the map updates visibly.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   translation: |
    # Plant Defense

    在 Godot 4 中于 `/workspace/game/` 构建 **Plant Defense**：一款**基于多条路线的塔防策略游戏**。这不是原型，而是一款**完整、可交付的微型游戏**，能够作为打磨完成的垂直切片发布到 itch.io 页面或 Steam。

    ## Core Vision

    一片花园网格挡在家园与不断逼近的生物浪潮之间。玩家要在多路线草坪上种植防御植物，并花费必须主动收集的阳光。每种植物承担一种战术职责——有的射击、有的阻挡、有的创造经济——敌方生物则以不同特性惩罚单一化防线。紧张感来自资源稀缺：阳光缓慢到来，种植需要真实成本，错放一个防御者就可能让某条路线在增援长成前失守。冒险地图把难度逐步提高的关卡与新植物解锁串联起来，使玩家必须在下一种威胁出现前掌握每件工具。

    ## What the Player Experiences

    玩家从标题界面进入冒险地图，地图上显示由关卡组成的路径。选择关卡后，界面会展示即将出现的生物类型，并允许玩家从已解锁植物中挑选防御阵容。

    关卡在多路线网格上进行。阳光会定期掉落，玩家点击收集并积累资源。玩家把植物从工具栏拖到空网格中，每株植物都消耗阳光。射手沿所在路线发射投射物，墙类植物吸收攻击，阳光生产植物加速经济。生物从右侧边缘分波前进，每条路线彼此独立。

    敌方差异要求玩家调整策略：装甲生物能抵御弱小攻击，快速生物可越过射速缓慢的火力，飞行生物则能绕开地面墙体。后期关卡加入夜间条件，阳光产量下降，迫使玩家依赖替代经济植物。

    消灭全部波次即可通关；任一生物抵达左侧边缘则失败。胜利会解锁下一个地图节点，有时还会解锁一种新植物。结算界面显示获得的星星，地图也要产生可见更新。

    ## Assets

    2D 素材以只读方式挂载于：

    - `/workspace/assets/library/` —— Kenney CC0 素材包（sprites、tiles、UI、fonts）。
    - `/workspace/assets/library-oga/` —— OpenGameArt 条目；须遵守各子目录中的 `LICENSE.txt`。

    浏览素材库并选择合适的素材包，把需要的内容复制到项目的 `assets/` 目录。

    ## Project layout

    ```
    /workspace/game/
      project.godot
      Main.tscn
      demo_outputs/    <- your input traces (1-10 files)
      scripts/  scenes/  assets/
    ```

    构建产物必须能通过以下命令干净启动：

    ```
    godot --headless --path /workspace/game --quit-after 5
    ```

    Godot CLI 参数参考位于 `/workspace/tools/godot_command_line.md`。**诸如 `--headless` 和 `--quit-after N` 的引擎参数必须放在 `--` 之前**——`--` 后的内容会作为用户参数转发给项目，并被引擎静默忽略。正确形式：
    `godot --headless --quit-after 5 --path . -- --scenario near_victory`。

    截图辅助工具位于 `/workspace/tools/screenshot.sh`。请用它实际检查 UI、战场和结算界面的显示效果。

    ```
    /workspace/tools/screenshot.sh --path /workspace/game \
          -- --out /workspace/frame.png --frames 60
    ```

    如需为特定 scenario 截图，请在 `--` 后追加 `--scenario <id>`。辅助工具只消费 `--out` / `--frames` / `--scene`，其余参数保留在 `OS.get_cmdline_user_args()` 中供游戏代码读取。示例：

    ```
    /workspace/tools/screenshot.sh --path /workspace/game \
          -- --out /workspace/battle_debug.png --frames 120 --scenario battle
    ```

    ## Demos

    在 `/workspace/game/demo_outputs/` 下交付 **1-10 个输入轨迹文件**，每个 demo 一个，均命名为 `*.json`。评测器会为每条轨迹启动全新的游戏，以 1280x720 分辨率将轨迹回放为合成鼠标与键盘输入，并录制屏幕。仅按文件名排序的前 10 条轨迹会被评测；超过 20 s 的录像会从随机的 20 s 窗口中采样。

    ### Scenarios

    常规游玩应从标题界面开始，并展示本题的核心游戏循环。Demo 回放必须具有确定性。若 demo 需要特定状态（特定关卡、战斗状态、升级界面、结算状态或后期配置），请定义具名 scenario，并通过以下方式加载：

    ```
    godot --path /workspace/game -- --scenario <id>
    ```

    当存在 `--scenario <id>` 时，游戏必须跳过菜单，以确定性方式建立该具名状态（为所有 RNG 设置种子），并立即开始接受输入。

    ### Trace file format

    ```json
    {
      "scenario": "title_flow",
      "duration_frames": 360,
      "events": [
        {"frame": 30,  "type": "mouse_click", "button": "left", "x": 300, "y": 360},
        {"frame": 90,  "type": "key_press",   "keycode": "1"},
        {"frame": 180, "type": "key_press",   "keycode": "SPACE"},
        {"frame": 300, "type": "wait"}
      ]
    }
    ```

    - `scenario` —— 可选；从标题界面正常启动时省略。
    - `duration_frames` —— 按 30 fps 录制的总帧数；上限为 **600（20 s）**。
    - `events` —— 按时间排序的输入，坐标是 1280x720 视口中的像素值。支持：
      - `mouse_click`：`{frame, type, button: "left"|"right", x, y}`
      - `mouse_down` / `mouse_up`：`{frame, type, button: "left"|"right", x, y}` —— 用于拖拽：起点发出 `mouse_down`，途中发出一个或多个 `mouse_move`，终点发出 `mouse_up`。一次 `mouse_click` 等价于在同一点紧邻发生的 `mouse_down` + `mouse_up`。
      - `mouse_move`：`{frame, type, x, y}`
      - `key_press` / `key_down` / `key_up`：`{frame, type, keycode}` —— keycode 可取 `A`-`Z`、`0`-`9`、`ESCAPE`、`ENTER`、`SPACE`、`TAB`、`BACKSPACE`、`DELETE`、`SHIFT`、`CTRL`、`ALT`、`UP`、`DOWN`、`LEFT`、`RIGHT`。
      - `wait`：`{frame, type}` —— 仅锚定帧，不产生输入。

    回放必须具有确定性：相同轨迹、全新启动，每次都得到相同结果。
   run_spec: "上游族 Strategy；rubric 18 条（M5/D5/V3/A5，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: strategy-puzzle-magnet-lab
   label: "策略 · Puzzle Magnet Lab"
   prompt: "# Puzzle Magnet Lab\n\nBuild **Puzzle Magnet Lab**, a 2D grid-based magnetic puzzle mini-game in Godot\n4 at `/workspace/game/`. The player manipulates polarity to push and pull\nmagnetic objects through a laboratory, solving spatial puzzles to guide an\nenergy core to the exit.\n\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe game is a turn-based spatial logic puzzle built on one central rule:\nopposite polarities attract, same polarities repel. Every level is a closed\nsystem of magnets, metal crates, gates, and hazards where the player must\nreason about chain reactions before committing a move. The tension comes from\nirreversibility and cascading consequences: flipping a polarity switch might\nsolve one gate while slamming a crate into a hazard. The best version feels\nlike a miniature physics sandbox wrapped in clean laboratory aesthetics, where\neach puzzle teaches a new interaction between familiar magnetic rules.\n\n## What the Player Experiences\n\nA title screen sets the laboratory tone with magnetic imagery and a clear way\nto begin. The player enters a grid-based puzzle chamber where walls, floor\ntiles, magnetic crates, polarity indicators, switches, gates, and an exit are\nall readable at a glance. Movement is deliberate, one tile at a time, and the\ngrid enforces strict spatial reasoning.\n\nEarly puzzles teach the basics: push a same-polarity crate out of the way, or\npull an opposite-polarity block onto a pressure plate to open a gate. As the\nplayer progresses, levels layer mechanics together. A polarity-swap switch\ninverts the player's field, turning a repulsion problem into an attraction\nopportunity. Hazard tiles punish careless moves. Multi-step sequences demand\nplanning several moves ahead, where an early push sets up a later pull across\nthe room.\n\nAn undo or reset option keeps frustration in check. When the core reaches the\nexit, a completion screen celebrates the solve and offers the next challenge.\nFailure states are clear and recoverable. The arc moves from simple single-crate\nrooms to intricate multi-gate chambers that require the full toolkit of push,\npull, swap, and sequencing.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    ← your input traces (1–10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1–10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280×720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280×720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`–`Z`, `0`–`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
