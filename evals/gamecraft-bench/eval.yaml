 - id: platformer-wall-dancer
   label: "平台跳跃 · Wall Dancer"
   prompt: "# Wall Dancer\n\nBuild **Wall Dancer**, a precision platformer with wall-climb and dash mechanics\nin Godot 4 at `/workspace/game/`. This is not a prototype. It is a **complete,\nshippable micro-game** that could sit on an itch.io page or Steam as a polished\nvertical slice.\n\n## Core Vision\n\nA nimble climber ascends through crystalline caverns one screen at a time,\nclinging to walls, launching off with a directional dash, and threading through\nspike-lined corridors that demand pixel-perfect timing. The game is built around\ntwo verbs: cling and dash. Clinging to a wall lets the player slide slowly\ndownward while scanning the room for the next safe surface. Dashing consumes a\nsingle charge that resets on landing or wall-grab, creating a rhythm of\ncommit-recover-commit that makes every room feel like a tiny puzzle solved\nthrough muscle memory. Five chapters introduce new hazards — wind currents,\ncrumbling walls, moving spikes, gravity flips, and timed gates — each layering\ncomplexity without changing the core two-verb vocabulary.\n\n## What the Player Experiences\n\nA title screen presents the game name and a chapter-select option (locked until\ncleared). Pressing Start drops the player into Chapter 1, Room 1.\n\nEach room fills exactly one screen. The player character clings to walls on\ncontact, sliding slowly downward. Pressing jump while clinging launches away\nfrom the wall. Pressing dash mid-air sends the character in the aimed direction\nat high speed, consuming the dash charge. Landing on ground or grabbing another\nwall restores the charge. Spikes, pits, and moving hazards kill instantly,\nrespawning the player at the room entrance with no loading screen.\n\nClearing a room scrolls the camera to the next. Each chapter contains 8-12\nrooms culminating in a final room that combines all chapter hazards. Completing\na chapter returns to the hub with the next chapter unlocked. A death counter\nand best-time tracker per chapter encourage mastery replays.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/workspace/game/demo_outputs/`, one per\ndemo, each named `*.json`. The evaluator launches a fresh game per trace,\nreplays your trace as synthetic mouse and keyboard input at 1280x720, and\nrecords the screen. Only the first 10 traces by filename are evaluated;\nrecordings longer than 20 s are sampled from a random 20 s window.\n\n### Scenarios\n\nNormal play should start from the title screen and demonstrate the task's\ncore gameplay loop.\nDemo playback must be deterministic. For demos that need a specific state\n(a specific level, combat state, upgrade screen, result state, or late-game\nsetup), define named scenarios your game loads when launched with:\n\n```\ngodot --path /workspace/game -- --scenario <id>\n```\n\nWhen `--scenario <id>` is present the game must skip menus, set up the named\nstate deterministically (seed any RNG), and begin accepting input immediately.\n\n### Trace file format\n\n```json\n{\n  \"scenario\": \"title_flow\",\n  \"duration_frames\": 360,\n  \"events\": [\n    {\"frame\": 30,  \"type\": \"mouse_click\", \"button\": \"left\", \"x\": 300, \"y\": 360},\n    {\"frame\": 90,  \"type\": \"key_press\",   \"keycode\": \"1\"},\n    {\"frame\": 180, \"type\": \"key_press\",   \"keycode\": \"SPACE\"},\n    {\"frame\": 300, \"type\": \"wait\"}\n  ]\n}\n```\n\n- `scenario` — optional; omit for a normal game launch from the title screen.\n- `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.\n- `events` — time-ordered inputs. Coordinates are pixels in the 1280x720\n  viewport. Supported types:\n  - `mouse_click`: `{frame, type, button: \"left\"|\"right\", x, y}`\n  - `mouse_down` / `mouse_up`: `{frame, type, button: \"left\"|\"right\", x, y}` —\n    use these for drag interactions: emit `mouse_down` at the start point,\n    one or more `mouse_move` events along the way, and `mouse_up` at the end.\n    A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight\n    succession.\n  - `mouse_move`: `{frame, type, x, y}`\n  - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:\n    `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,\n    `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.\n  - `wait`: `{frame, type}` — anchor frame, no input.\n\nReplay must be deterministic: same trace, fresh launch, same outcome every time.\n"
   run_spec: "上游族 Platformer；rubric 18 条（M5/D5/V4/A4，mean 5），权重 0.15 / 0.35 / 0.15 / 0.35，得分 ∈ [0,1]。判分与证据留存口径见 README。"
 - id: puzzle-circuit-wizard
   label: "解谜 · Circuit Wizard"
   prompt: "# Circuit Wizard\n\nBuild **Circuit Wizard**, a 2D logic-circuit puzzle game in Godot 4 at\n`/workspace/game/`. The player places and connects logic gates (AND, OR, NOT,\nXOR) on a board to route signals from inputs to outputs, solving increasingly\ncomplex signal-routing challenges across a campaign.\n\nThis is not a prototype. It is a **complete, shippable micro-game** that could\nsit on an itch.io page or Steam as a polished vertical slice.\n\n## Core Vision\n\nThe game is a digital logic puzzle where the player builds circuits from\ndiscrete components. Each level provides fixed input signals (on/off or\npatterned) and requires specific output signals. The player places gates from\na toolbox onto a grid board and draws wires between them to create the correct\nlogic path. The tension comes from spatial constraints (limited board space,\nwire crossing rules) and logical complexity (multi-bit signals, timing\nsequences, feedback loops). The best version feels like being an engineer\nwith a soldering iron, where each completed circuit produces a satisfying\ncascade of signals lighting up from input to output.\n\n## What the Player Experiences\n\nA title screen sets the electronic workshop tone with circuit imagery and a\nclear way to begin. The player enters a puzzle board where input terminals\n(left side), output terminals (right side), and an empty grid workspace are\nvisible. A toolbox shows available gate types with quantities.\n\nEarly levels teach individual gates: connect an input through a NOT gate to\ninvert the signal, or wire two inputs through an AND gate. Soon levels require\nmulti-gate chains where the player must decompose a complex boolean expression\ninto a physical circuit. Mid-game introduces XOR gates, multi-bit buses,\nsignal splitters, and delay elements that add timing constraints. Late levels\npresent real-world-inspired challenges: build an adder, construct a\nmultiplexer, or create a latch with feedback.\n\nSignals flow visually through wires when the player activates the test button.\nCorrect outputs light up green; incorrect ones flash red with the expected\nvalue shown. A completion screen celebrates the solve and shows gate count\nefficiency. The campaign progresses through themed chapters: basic logic,\narithmetic circuits, memory circuits, and challenge rounds.\n\n## Assets\n\n2D assets are mounted read-only at:\n\n- `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).\n- `/workspace/assets/library-oga/` — OpenGameArt entries; respect each\n  subdir's `LICENSE.txt`.\n\nBrowse the library and choose packs.\nCopy what you need into your project's `assets/` folder.\n\n## Project layout\n\n```\n/workspace/game/\n  project.godot\n  Main.tscn\n  demo_outputs/    <- your input traces (1-10 files)\n  scripts/  scenes/  assets/\n```\n\nThe build must launch cleanly with:\n\n```\ngodot --headless --path /workspace/game --quit-after 5\n```\n\nA reference for Godot CLI flags is at `/workspace/tools/godot_command_line.md`.\n**Engine flags like `--headless` and `--quit-after N` must come BEFORE `--`** —\nanything after `--` is forwarded to the project as user args and silently\nignored by the engine. Correct shape:\n`godot --headless --quit-after 5 --path . -- --scenario near_victory`.\n\nA screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /\nresult screens look like.\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/frame.png --frames 60\n```\n\nTo screenshot a specific scenario, append `--scenario <id>` after `--`. The\nhelper consumes only `--out` / `--frames` / `--scene`; remaining args stay in\n`OS.get_cmdline_user_args()` for your game code to read. Example:\n\n```\n/workspace/tools/screenshot.sh --path /workspace/game \\\n      -- --out /workspace/battle_debug.png --frames 120 --scenario battle\n```\n\n## Demos\n\nShip **1-10 input-trace files** under `/wor