id: mg-animation-replication
protocol_revision: 1
name: 葬AI 单图 MG 视频 Bench
category: useful
description: >-
  给多模态 Agent 一张人物参考图，要求它在离线工作目录中自由创作并实际制作一支 30 秒、1080×1920、带音轨的竖屏 MG 动画。
  作者观看完整成片并按参考图利用、创意、视觉运动、叙事节奏、声音、技术质量与品牌规范给出 0–100 分；未完成人工评审前不生成榜单分数。
hook_title: 只给一张人物图，Agent 能独立完成一支真正可看的 30 秒 MG 动画吗
dimensions: [代码]
interface: agent
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: author_fill
baseline_policy: optional
score_unit: 分
scoring_note: >-
  作者先核对任务版本、完整运行日志、成片链接和 SHA-256，再运行冻结的 ffprobe/ffmpeg 验收并观看完整 30 秒视频。
  主分数为七项直接相加：参考图利用与人物可辨认度 25，创意概念与独特性 20，MG 视觉设计、运动与转场 20，
  30 秒叙事与节奏完整性 10，音乐、音效与音画配合 10，成片技术质量与规格 10，Web4 品牌 UI 与文件命名 5。
  静态图轻微缩放或循环撑满 30 秒、看不出参考图来源、缺少最终视频、读取其他模型结果或违反离线边界，均判为无效结果。
  自动验收只验证时长、分辨率、帧率、H.264/yuv420p、AAC、文件名和三时点品牌像素特征，不等同于最终分数。
  转换器输出 score=null，只有作者完成全部复核后才补写 0–100 的正式总分。
command_template:
  argv: [node, evals/mg-animation-replication/pack-to-result.mjs, "{input}", --out, "{output}"]
  output: mg-animation-replication-result.json
trials: 1
detail_profile:
  source_kind: evalhub_native
  overview_note: >-
    当前协议采用最新文件状态的“单图自由创作 30 秒 MG 动画”题面。工程目录沿用历史名称，但历史题面、复测和对照信息
    都不属于本评测，也不会进入成绩或证据区。
  summary:
    plain_language: >-
      Agent 只看到一张人物照片、品牌素材和完整题面。它要自己观察人物、构思主题、写脚本、画图形、做动画、安排镜头与转场、
      合成音乐和音效，并真正编码出一支 30 秒竖屏成片；只交创意方案、分镜或教程不算完成。
    why_it_matters: >-
      视频交付把多模态理解、长时间规划、代码与媒体工具使用、视觉设计、声音和工程自检压在同一个任务里。
      最终观众看到的是一条完整时间线，而不是一张好看的静态图，因此能检验 Agent 是否真的完成了跨工具创作闭环。
  method_steps:
    - title: 冻结单图与品牌输入
      description: >-
        所有参赛 Agent 使用同一人物参考图、Logo、像素字体、品牌 UI 规范和完整中文题面；五项当前输入均以 SHA-256 锁定，
        不提供旧宣传片、旧分镜、文稿、转写或其他模型结果。
    - title: 隔离运行一次
      description: >-
        每个模型进入结构相同的全新工作目录，以 Pi 0.82.0、thinking=max、同一工具白名单和 5400 秒超时单槽串行运行一轮；
        禁用 session、context files、extensions、skills、prompt templates 和 themes。
    - title: 生成唯一成片
      description: >-
        Agent 必须在本地离线生成 `<模型版本号>.mp4`：30.0±0.5 秒、1080×1920、30 fps、H.264、yuv420p、AAC 音轨，
        并让右上角品牌卡片在全片保持稳定。
    - title: 自动媒体验收
      description: >-
        冻结验证器用 ffprobe 检查媒体规格，再在 1 秒、中点和结束前 1 秒抽取右上区域，检查米白、深墨紫与品牌紫的像素数量，
        以确认标准品牌卡片持续存在；这一步只判合格条件，不生成主分数。
    - title: 完整观看并人工评分
      description: >-
        作者观看整段视频，核对参考图来源、人物关系、时间线变化、叙事节奏、声音与品牌边界，按七项 100 分量表给分；
        无效条件优先于分项加总。
  score_interpretation: >-
    主分数为单次成片的 0–100 分人工总分，越高越好，七项直接相加，不跨题、不跨轮平均。比较边界固定为同一张 2026-08-03
    人物图、同一输入资产、同一完整题面、同一 Pi 0.82.0/max harness、一次运行和同一媒体合同；自动验收通过只表示规格合格，
    不能解释为 100 分。score=null 表示作者尚未完成正式评审。
  key_facts:
    - value: 30.0 ± 0.5 秒
      label: 唯一成片时长合同
      description: 最终交付为 1080×1920、30 fps、H.264/yuv420p，并包含 AAC 音轨。
      source_url: https://github.com/502399493zjw-lgtm/evalhub-evals/tree/main/evals/mg-animation-replication
    - value: 25 + 20 + 20
      label: 参考图、创意与视觉运动三项占 65 分
      description: 其余 35 分来自叙事节奏、声音、技术质量和品牌规范。
      source_url: https://github.com/502399493zjw-lgtm/evalhub-evals/tree/main/evals/mg-animation-replication
    - value: 1 轮
      label: 每个模型只有一次正式成片
      description: 失败、超时或无产物不通过自动补跑来抬分；无效尝试不混入当前结果。
      source_url: https://github.com/502399493zjw-lgtm/evalhub-evals/tree/main/evals/mg-animation-replication
  caveats:
    - title: 创意视频需要人工判断
      description: >-
        参考图利用、独特性、运动质量、叙事和声音无法由当前规格验证器可靠代替；作者评审仍可能受审美偏好影响。
    - title: 品牌检测只是像素启发式
      description: >-
        三时点颜色计数能发现缺卡片或明显错误样式，但不能证明每一帧的文字完全正确，也不能代替实际观看完整成片。
    - title: 输入二进制不随投稿仓库分发
      description: >-
        人物图、Logo、字体和成片均不放入 eval 目录；参赛运行从作者审阅的冻结素材包取得文件，并用公开摘要核对字节一致性。
    - title: 当前没有可发布的完整基线
      description: >-
        当前没有完成媒体复验和七项人工评审的可发布数值基线。因此本版本不导入任何 published-results，也不把自动验收
        布尔值、历史成片或不同协议的结果冒充正式榜单。
    - title: 历史题面不具可比性
      description: >-
        当前题不提供参考视频且鼓励自由创作；历史题面的输入、目标和评分不同，任何数字都不可合并。
  resources_note: 以下链接指向本评测合并后的第一方协议、转换器和来源台账；原始人物图、Logo、字体和模型成片不在投稿仓库中公开分发。
  resources:
    - title: 葬AI 单图 MG 视频 Bench 协议目录
      summary: 完整题面、七项评分量表、媒体合同、外部提交清单、证据边界和无网络转换器。
      url: https://github.com/502399493zjw-lgtm/evalhub-evals/tree/main/evals/mg-animation-replication
    - title: EvalHub 评测集仓库
      summary: 本协议的版本历史、审阅记录和后续可比性修订均以该仓库为准。
      url: https://github.com/502399493zjw-lgtm/evalhub-evals
tasks:
  - id: mg-animation-image-creative-v2-20260803
    label: 单图自由创作 30 秒 MG 动画
    prompt: |
      # 单图自由创作 30 秒 MG 动画

      工作目录中提供：`人物参考图.jpg`、`logo.png`、`fusion-pixel-12px-proportional.woff2` 和 `品牌UI规范.json`。

      请先实际读取并观察 `人物参考图.jpg`，再使用本机已有工具，围绕图中人物、关系、造型和现场气氛，自由创作并实际制作一支完整的 30 秒竖屏 MG 动画。不要只写创意方案、分镜或教程，直接生成成片。

      ## 创作要求

      1. 不指定剧情、文案、画风和转场方案；请自行决定主题、叙事、镜头、色彩、字体、运动节奏、视觉梗、音乐与音效，充分发挥创意。
      2. 成片必须让观众看得出创意来自参考图，并保留图中主体人物可辨认的外形、服饰和互动关系；允许 Q 版化、扁平化、剪纸、像素、拼贴、矢量或其他 MG 风格。
      3. 可以使用参考图的裁切、抠像或纹理，也可以完全重绘；但不得用一张静态图加轻微缩放、平移或循环撑满 30 秒。成片应包含明确的时间线、持续动画、镜头或场景变化，并形成有起承转合的完整短片。
      4. 最终视频时长必须为 `30.0 ± 0.5` 秒，画面为 `1080×1920` 竖屏、30 fps，H.264、`yuv420p`，并包含 AAC 音轨。音频内容可自行合成，不能联网下载素材。
      5. 所有脚本、图形、动画、声音和最终视频必须在当前工作目录内离线完成；仅使用当前目录提供的素材，不联网、不安装新依赖、不调用外部生成服务。
      6. 只提交一个最终版本。提交前必须实际构建，并用 `ffprobe` 验证时长、分辨率、帧率、编码和音轨。
      7. 抽图、脚本、缓存、渲染帧等中间文件必须放在临时目录；最终工作目录根目录只保留指定成片和必要日志。

      ## 葬AI Web4 右上角标识

      成片右上角必须全程显示葬AI Logo 和当前实际模型版本号，并严格读取 `品牌UI规范.json`：

      - 使用 `logo.png` 原始透明素材和 `fusion-pixel-12px-proportional.woff2`。
      - 米白色不透明直角卡片，禁止圆角、半透明、毛玻璃和白色胶囊样式。
      - 深墨紫 2px 硬边框，右下 8px 同色硬阴影，无模糊。
      - 左侧使用葬AI紫色竖条；型号文字使用 30 px Fusion Pixel 和葬AI紫。
      - 卡片锚定右上角，右边距和上边距均为 22px；位置、尺寸和内容全片稳定。
      - 品牌标识只是覆盖层，不限制正片的创意方向。

      最终文件名必须使用当前实际模型版本号：`<模型版本号>.mp4`。禁止提交 `final.mp4`。

      ## 唯一交付

      - `<模型版本号>.mp4`：直接放在工作目录根目录。
    run_spec: |-
      使用作者审阅的当前冻结素材包：人物参考图.jpg sha256=ce3f35f378b1890b3c26415f6f9576bcd4b787102264bca466eb9a01f0f4ca64，logo.png sha256=e3bf841329f81c1f4b269f930299306cbc9a614a030049ba5e9369ad65a02086，fusion-pixel-12px-proportional.woff2 sha256=b4f59dce22df0f43425262611a786b7f1581fa2667fad5861afbfb249e5a8dba，品牌UI规范.json sha256=6f3574901581975f0fdd923c5026df555d63597f4af453de4bee747b415bf414，完整题面 sha256=fd078a340b67206623a6b245d702d8419e4b6adeb47eb6c4ee29f963f7ef5e4b。品牌配置中的模型版本字号按权威机器规范固定为 30 px。每个参赛模型只运行一轮；参考实现使用 Pi 0.82.0、thinking=max、5400 秒超时和 read,bash,edit,write,grep,find,ls 工具白名单，禁用 session、context files、extensions、skills、prompt templates 和 themes，且单槽串行。不得提供旧宣传片、旧分镜、转写或其他模型产物。成片完成后运行冻结的 ffprobe/ffmpeg 验收并观看完整视频。`pack-to-result.mjs` 只登记成片与证据摘要，score 保持 null，直到作者完成七项人工评审。
    translation: |-
      # Create a 30-Second MG Animation Freely from One Image

      The working directory provides `人物参考图.jpg`, `logo.png`, `fusion-pixel-12px-proportional.woff2`, and `品牌UI规范.json`.

      First inspect `人物参考图.jpg`. Then use the tools already available on the machine to freely conceive and actually produce a complete 30-second vertical MG animation based on the people, relationships, appearance, and atmosphere in the image. Do not submit only a creative proposal, storyboard, or tutorial; generate the finished video.

      ## Creative requirements

      1. The plot, copy, visual style, and transitions are not prescribed. Choose the theme, narrative, shots, colors, typography, motion rhythm, visual jokes, music, and sound effects yourself.
      2. Viewers must be able to tell that the concept came from the reference image, and the main people's appearance, clothing, and interactions must remain recognizable. Chibi, flat, paper-cut, pixel, collage, vector, and other MG styles are allowed.
      3. You may crop, cut out, or texture with the reference image, or redraw it completely. Do not stretch one static image to 30 seconds with only slight zooming, panning, or looping. The video must have a clear timeline, continuous animation, shot or scene changes, and a complete beginning, development, turn, and conclusion.
      4. The final video must be `30.0 ± 0.5` seconds, `1080×1920` vertical, 30 fps, H.264, `yuv420p`, with an AAC audio track. Audio may be synthesized locally; do not download media from the internet.
      5. All scripts, graphics, animation, sound, and the final video must be created offline inside the current working directory. Use only the supplied assets; do not access the internet, install dependencies, or call external generation services.
      6. Submit only one final version. Build it and use `ffprobe` to verify duration, resolution, frame rate, codecs, and audio before submission.
      7. Put extracted images, scripts, caches, and render frames in a temporary directory. The working-directory root should retain only the specified final video and necessary logs.

      ## ZangAI Web4 top-right identifier

      The video must display the ZangAI logo and the actual model version in the top-right corner for its full duration, following `品牌UI规范.json` exactly:

      - Use the original transparent `logo.png` and `fusion-pixel-12px-proportional.woff2`.
      - Use an opaque cream rectangular card. Rounded corners, translucency, glass effects, and white pill styling are forbidden.
      - Use a 2 px hard dark-ink-purple border and an 8 px hard shadow at bottom-right, with no blur.
      - Use a ZangAI-purple vertical bar at left; model text uses 30 px Fusion Pixel in ZangAI purple.
      - Anchor the card at top-right with 22 px top and right margins; position, size, and content must remain stable throughout.
      - The brand identifier is an overlay and does not constrain the creative direction of the main video.

      The final filename must use the actual model version: `<model-version>.mp4`. `final.mp4` is forbidden.

      ## Sole deliverable

      - `<model-version>.mp4`: place it directly in the working-directory root.
