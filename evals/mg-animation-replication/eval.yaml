      summary: EvalHub 原生题面、运行规范、品牌合同、人工量表、证据清单与确定性转换器。
      url: https://github.com/502399493zjw-lgtm/evalhub-evals/tree/main/evals/mg-animation-replication
tasks:
  - id: mg-animation-replication-v1
    label: 56.704 秒 MG 宣传片复刻
    prompt: |
      # MG 动画复刻测试

      工作目录中提供：`测试视频.mp4`、`logo.png`、`fusion-pixel-12px-proportional.woff2` 和 `品牌UI规范.json`。

      请使用本机已有工具，自行分析参考片并实际制作一支 MG 动画，尽可能复刻原片。不要只写方案或教程，直接生成成片。

      ## 复刻要求

      1. 尽量还原镜头顺序、时间线、构图、色调、排版、关键文字、转场、运动节奏与音画同步。
      2. 自行读取参考片的分辨率、帧率、时长和音轨参数；最终成片应尽量保持一致。
      3. 所有可见画面必须独立重建；禁止把参考片原始帧或视频片段拼入、叠加、转码或重封装到成片中。允许保留原片音轨。
      4. 不联网、不安装新依赖、不调用外部生成服务、不读取其他模型结果。
      5. 只提交一个最终版本。提交前必须实际构建并用 `ffprobe` 验证。
      6. 抽帧、脚本、缓存、渲染帧等中间文件必须放在临时目录并在完成后清理。

      ## 葬AI Web4 右上角标识

      成片右上角必须全程显示葬AI Logo 和当前实际模型版本号，并严格读取 `品牌UI规范.json`：

      - 使用 `logo.png` 原始透明素材和 `fusion-pixel-12px-proportional.woff2`。
      - 米白色不透明直角卡片，禁止圆角、半透明、毛玻璃和白色胶囊样式。
      - 深墨紫 2px 硬边框，右下 8px 同色硬阴影，无模糊。
      - 左侧使用葬AI紫色竖条；型号文字使用 Fusion Pixel 和葬AI紫。
      - 卡片锚定右上角，右边距和上边距均为 22px；位置、尺寸和内容全片稳定。
      - 除该覆盖层外，不得因品牌处理剪辑、调色、变速或重混其他内容。

      标准文件名：`GPT-5.6-Sol.mp4`、`Kimi-K3.mp4`、`Qwen3.8-Max-Preview.mp4`、`GLM-5.2.mp4`。以后更换模型时使用实际新版本名，禁止提交 `final.mp4`。

      ## 唯一交付

      - `<模型版本号>.mp4`：直接放在工作目录根目录。
    run_spec: >-
      作者向每个全新隔离工作目录提供完全相同的四项输入：参考视频 SHA-256 86cab73954c05b6811e23c6ebefa5c923af585db19c65ac6a9eb5bd51a625ce9，
      Logo SHA-256 e3bf841329f81c1f4b269f930299306cbc9a614a030049ba5e9369ad65a02086，字体 SHA-256
      b4f59dce22df0f43425262611a786b7f1581fa2667fad5861afbfb249e5a8dba，品牌 JSON SHA-256
      8fa8bbc2d279a9d8a1f3c742c589e82cbfd8d8b8b181066608336ffb0f6c59da；题面 SHA-256
      17d3870e7fca163d8a7c269968bd9462254244c64aaed670ae7d40f6af8d438f。参考片为 1280×720、H.264、30000/1001 fps、
      56.704 秒，含 48 kHz 双声道 AAC。每个模型一轮、墙钟上限 5400 秒、不重试；工作目录隔离，禁止联网与读取其他结果。
      保留唯一 MP4、原始运行日志、ffprobe 报告、帧复用审计和冻结盲审表；作者按 tasks/README.md 生成清单。参考片、Logo、字体、成片和日志均不上传本仓库。
