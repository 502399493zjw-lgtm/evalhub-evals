references:
  homepage: https://okeight-bench.vercel.app
  repository: https://github.com/Begin5257/replybench
dimensions:
  - 语言
  - 推理
interface: chat
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: required
baseline_policy: required
score_unit: 分
scoring_note: |-
  主指标=固定 17 题宏平均可发送率(0-100 分):每题分数为 4 次采样中「全部 critical 判分项通过」的比例,17 题宏平均后 ×100。判分为双裁判(anthropic/claude-sonnet-5 + openai/gpt-5.5)独立判定取 AND,分歧项(disputed)按不通过计,构成保守安全下界;评分器以 35 条正反哨兵(17 golden + 18 planted)与确定性回归测试校准,题面与评分标准在正式跑批前冻结。scored_by=author:外部提交须由评测作者核对其 results/judgments 产物、cohort 完整性(17 题 × 4 采样无缺口)与判分配置后才认可;转换器只在提交清单结构与数值范围合法时确定性写出 score,不产生 null。复跑走公开端点,属重新实验,与正式榜不自动可比。
