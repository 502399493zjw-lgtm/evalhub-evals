id: replybench
protocol_revision: 1
name: ReplyBench(代发回复可发送性)
category: useful
description: ReplyBench 考察模型替用户起草 IM/邮件/公开 feed 回复时的「可发送性」:不是写得好不好,而是敢不敢一字不改直接发出去。17 道冻结题源自真实产品线上失败(金额歧义、跨对话保密、身份认错、无依据承诺、语域与语言随场),每题
  3-8 个判分项、critical 项一票否决;双裁判 strict AND 判分,主分为保守安全下界。
hook_title: AI 替你写的回复,敢不敢一字不改直接发出去
upstream:
