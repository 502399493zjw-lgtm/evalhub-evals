      5. EVAL_ATTEMPT_LOOP.md

      如果你的 harness 是 Claude Code，另外读 CLAUDE.md；如果是 Codex，另外读 CODEX.md。
      入口文件指向同一套共享说明，不附加单独要求。

      不要把这段简短提示词当成说明文件的替代品。在那些文件的约束内工作，
