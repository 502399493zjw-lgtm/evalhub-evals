        "schema_version": "0.1.0",
        "benchmark_key": "swe_bench_verified",
        "benchmark_id": "swe-bench-verified@1.0",
        "target_benchmark": "swe-bench-verified",
        "name": "SWE-bench Verified",
        "display_name": "SWE-bench Verified",
        "aliases": [
          "swe-bench-verified",
          "swe_bench_verified"
        ],
        "task_family": "swe",
        "harbor_dataset": "benchmarks/swe_bench_verified/datasets/seed23_random_100",
        "harbor_agent": "mini-swe-agent",
