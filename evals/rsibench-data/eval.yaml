trials: 1
detail_profile:
  source_kind: upstream_publication
  markdown: |-
    **RSIBench-Data** 是一个数据中心型后训练研究评测：它不只看模型能不能答对题，而是看研究者 Agent 能不能从失败证据出发，合成训练数据、训练出检查点、读取评测反馈，并在固定预算内选出最可靠的候选。

    > 这是上游作者公开结果的整理页。本文中的官方成绩、成本和图片均标注了来源口径；EvalHub 没有独立复跑，也不代表上游作者对 EvalHub 的认证或背书。

    ## 评测目标

    目标模型固定为 `Qwen/Qwen3.5-35B-A3B-Base`。训练后端、检查点服务、E2B 工具调用代理、Harbor 评测环境、任务子集和预算边界都固定，研究者 Agent 能改变的主要是新合成训练数据与白名单训练配置。

    训练数据必须来自非评测的公开来源。评测任务、补丁、测试、轨迹和标签不得被复制、过滤、改写或蒸馏进训练集；训练前需要完成污染审计。

    ## 固定运行协议

    每个 profile 都是一次独立的名义 **16 小时墙钟 / 500 USD Tinker** 预算运行。Agent 通过 Tinker LoRA SFT 训练检查点，再接入 E2B 与 Harbor 做选择性评测，预算用尽前锁定最终检查点，之后由官方在全新环境中完成复评。

    | Profile | 数据集或子集 | Agent | 分母 | 解码次数 | 权重 |
    | --- | --- | --- | ---: | ---: | ---: |
    | swe-bench-verified | seed-23 随机 100 题 SWE-bench Verified | mini-swe-agent | 100 | 1 | 0.2 |
    | swe-bench-multilingual | seed-23 随机 100 题 SWE-bench Multilingual | mini-swe-agent | 100 | 1 | 0.2 |
    | swe-bench-pro | seed-23 随机 100 题 SWE-bench Pro | mini-swe-agent | 100 | 1 | 0.2 |
    | terminal-bench-2 | terminal-bench 2.0 | terminus-2 | 89 | 1 | 0.2 |
    | gpqa-diamond | seed-23 随机 100 题 GPQA Diamond | terminus-2 | 100 | 1 | 0.1 |
    | aime | MathArena AIME 2026 完整 30 题 | terminus-2 | 120（30 × 4） | 4 | 0.1 |

    六个 profile 的分项分数按官方权重加权：SWE-bench Verified、SWE-bench Multilingual、SWE-bench Pro、Terminal-Bench 2.0 各占 0.2，GPQA Diamond 与 AIME 2026 各占 0.1。

    ## 一次运行怎么走

    1. **锁定协议**：固定目标模型、profile、数据子集、Harbor agent、并发数、步数上限、解码次数和预算。
    2. **诊断失败**：阅读允许查看的基线材料，提出失败模式假设，完成训练前污染审计。
    3. **合成与训练**：新建 `train_messages.jsonl`，通过 Tinker LoRA SFT 生成 `tinker://` 检查点。
    4. **读取反馈**：用 E2B 工具调用代理接入 Harbor，比较不同任务类型、校验策略和失败模式覆盖的变化。
    5. **选择候选**：在预算用尽前选定最终检查点，不能在官方复评之后改选。
    6. **官方复评**：官方按同一 profile 的固定数据、并发、步数与判定器复跑，得到可公开核验的分项成绩。

    ## 官方榜单结果

    下表是 2026-08-09 官方榜单快照。前三个总分由官方榜单直接显示；`Opus-4.8` 和 `gpt-5.6-terra` 的总分是 EvalHub 按同一官方公式对公开六项成绩计算出的派生值。

    | 排名 | 编排模型 | Harness | 总分 | 口径 |
    | ---: | --- | --- | ---: | --- |
    | 1 | Kimi K3 | Kimi Code | 27.317 | 官方榜单直接显示 |
    | 2 | gpt-5.6-sol | Codex | 27.277 | 官方榜单直接显示 |
    | 3 | Sonnet-5 | Claude Code | 23.441 | 官方榜单直接显示 |
    | 4 | Opus-4.8 | Claude Code | 22.305 | 按官方公式派生 |
    | 5 | gpt-5.6-terra | Codex | 22.005 | 按官方公式派生 |

    ## 六项分项成绩

    分项成绩是官方复评通过率或精确匹配准确率，统一以百分比展示。Base model 一行只用于参照，不属于参赛排名。

    | 编排模型 | SWE Verified | SWE Multilingual | SWE Pro | Terminal-Bench 2.0 | GPQA Diamond | AIME 2026 |
    | --- | ---: | ---: | ---: | ---: | ---: | ---: |
    | Kimi K3 | 50.00% | 11.00% | 17.00% | 9.00% | 55.00% | 44.17% |
    | gpt-5.6-sol | 33.00% | 15.00% | 9.00% | 20.22% | 65.00% | 53.33% |
    | Sonnet-5 | 35.00% | 22.00% | 4.00% | 5.62% | 52.00% | 49.17% |
    | Opus-4.8 | 46.00% | 5.00% | 2.00% | 10.11% | 56.00% | 40.83% |
    | gpt-5.6-terra | 42.00% | 6.00% | 1.00% | 12.36% | 64.00% | 33.33% |

    计算方式为：

    ```text
    total = 0.2 × SWE Verified
          + 0.2 × SWE Multilingual
          + 0.2 × SWE Pro
          + 0.2 × Terminal-Bench 2.0
          + 0.1 × GPQA Diamond
          + 0.1 × AIME 2026
    ```

    用同一组权重对官方矩阵中的未微调 Base model 六项成绩计算，得到 **13.124 分**的派生参照分。它不是参赛结果；低于它只能说明该候选在这套固定协议下没有超过未微调参照。

    ## 资源与运行成本

    资源数据只做展示，不进入评分。数值来自官方榜单快照，对每个模型的六个 profile 求和；Kimi K3 没有公开资源数据，因此用 `—` 表示缺失，不表示 0。

    | 编排模型 | 六项合计小时 | 六项合计 Tinker USD |
    | --- | ---: | ---: |
    | Kimi K3 | — | — |
    | gpt-5.6-sol | 42.89 | 577.83 |
    | Sonnet-5 | 63.24 | 885.27 |
    | Opus-4.8 | 44.94 | 674.05 |
    | gpt-5.6-terra | 21.49 | 351.31 |

    两个官方页面有两处成本差异：Sonnet-5 的 Terminal-Bench 2.0 为 `156.93` USD（榜单）对 `157.85` USD（rsibench.co 矩阵），gpt-5.6-sol 的 AIME 2026 为 `63.65` USD（榜单）对 `63.87` USD（矩阵）。本文统一采用官方榜单快照中的数值，不做平均或推算。

    ## 任务案例与研究观察

    评测任务不是单一问答题，而是围绕失败证据组织的研究循环：

    - **软件工程案例**：在 SWE-bench Verified、Multilingual 和 Pro 中，Agent 需要让训练后的检查点完成真实代码仓库中的 issue，并通过专属测试。
    - **终端操作案例**：在 Terminal-Bench 2.0 中，Agent 需要通过 `terminus-2` 完成终端环境里的工具与系统任务。
    - **科学问答案例**：在 GPQA Diamond 中，Agent 面对研究生级科学问题，按答案文件精确匹配计分。
    - **竞赛数学案例**：在 AIME 2026 中，每题进行 4 次解码，按整数答案精确匹配计算 `avg@4`。
    - **反馈驱动迭代**：Agent 应根据选择性评测反馈调整数据构成、验证策略和失败模式覆盖，而不是只更换随机种子或堆叠同质样本。

    论文报告了两个值得注意的搜索行为：24 个 Agent × 基准设定中有 14 个在反馈后找到过优于首个有效尝试的候选，即 **58.33%**；23 条曾越过历史最佳后继续搜索的轨迹中有 18 条最终收在更差候选，其余打平，没有一条再创新高，即 **78.26%**。这些观察描述的是公开研究轨迹，不是本地复跑统计。

    ## 图片与研究框架

    ![RSIBench-Data 的研究动机图](https://arxiv.org/html/2607.25886v1/x1.png)

    论文图 1：固定外围训练、服务和评测栈后，把评测焦点放在研究者 Agent 的数据中心型后训练能力上。

    ![RSIBench-Data 的实验框架图](https://arxiv.org/html/2607.25886v1/x2.png)

    论文图 2：目标模型、共享服务、Harbor 评测和预算控制保持一致，Agent 通过受限接口迭代数据策略并选择检查点。

    ![官方候选轨迹图](https://arxiv.org/html/2607.25886v1/x3.png)

    论文图 3：按时间顺序展示有效尝试得分，星号标记首次达到该运行历史最佳的候选。

    ## 证据边界与局限

    - 这是上游作者发布结果的转录，不是 EvalHub 独立复跑；所有比较都应限定在相同来源 commit、目标模型和复评协议内。
    - 每个 Agent × 基准只公开一个预设代表性运行，AIME 在每题内部使用 4 次解码；公开数据无法估计跨运行方差，也不是留出集泛化测试。
    - 榜单额外列出的 Kimi K3 不在论文四个研究者 Agent 的主实验内，且没有公开用时和 Tinker 成本。
    - 跑满一个 profile 需要 Tinker、E2B 和 Agent 推理额度，公开矩阵中的单项成本最高达到 363.77 USD、单项用时最长达到 14.91 小时，不能视为本地免费评测。
    - 上游仓库 README 的许可证徽章指向 CC BY-NC 4.0，但固定 commit 没有 LICENSE 文件；本文只引用论文托管的图片，不搬运上游数据集、轨迹或产物。

    ## 一手资料

    - [RSIBench-Data 论文（arXiv:2607.25886v1）](https://arxiv.org/abs/2607.25886v1)：主协议、固定栈设计和研究观察。
    - [RSIBench-Data 作者仓库](https://github.com/evolvent-ai/RSIBench-Data)：profile 规格、Harbor/E2B 路径、Tinker 训练脚本和数据隔离规则，固定 commit `4c807610243e7b481d382c5ed360c71c79a22f61`。
    - [Evolvent AI 官方榜单](https://evolvent.co/en/leaderboard)：六项权重、分项成绩与官方总分快照（2026-08-09）。
    - [rsibench.co 官方矩阵](https://rsibench.co/data/)：分项成绩、用时与 Tinker 成本的交叉核对来源。
    - [官方研究文章](https://evolvent.co/en/research/RSIBench-Data)：协议动机和研究图的发布页。
tasks:
  - id: swe-bench-verified
    label: SWE-bench Verified profile
    prompt: |-
      # RSIBench-Data SWE-Bench Agent Prompt

      You are the data generation and post-training agent for this RSIBench-Data
      SWE-bench run.

      The fixed train/eval chain is:

      ```text
      attempts/<attempt_id>/train_messages.jsonl
        -> Tinker LoRA SFT
        -> tinker:// sampler checkpoint
        -> E2B tool-call proxy sandbox
        -> Harbor SWE-bench target from RUN_CONTRACT.md with mini-swe-agent
      ```

      Training and sampling are Tinker-only. Do not replace the fixed Tinker training,
      E2B proxy, or Harbor evaluation chain.

      Start by reading the workspace instruction files:

      1. RUN_CONTRACT.md
      2. AGENT_RULES.md
      3. DATA_GENERATION.md
      4. MINI_SWE_DATA_FORMAT.md
      5. EVAL_ATTEMPT_LOOP.md

      If your harness is Claude Code, also read CLAUDE.md. If your harness is Codex,
      also read CODEX.md. The entrypoint file points to the same shared instructions
      and does not add separate requirements.

      Do not treat this short prompt as a replacement for the instruction files. Work
      within those files, run sufficient eval-driven attempts within the available
      budget, and submit the most reliable final checkpoint only after an official
      eval can be completed.
