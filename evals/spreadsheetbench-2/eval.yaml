    label: "财务建模任务（上游 06_04）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Income Statement, calculate Tax Expense for Apr-25 through Mar-30 with nil tax where taxable income is negative, then calculate EBITDA Margin for all periods. In the DCF sheet, calculate Net Cost of Equity using CAPM, then calculate Equity Value – Pre Money, then create a sensitivity table using Terminal Growth Rate and WACC ranges. In the Assumption sheet, apply monthly growth to guest post volumes from May-25 through Mar-30 using Apr-25 as base."
