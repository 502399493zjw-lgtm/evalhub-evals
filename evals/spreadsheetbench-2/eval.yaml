    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Cashflow (Monthly) sheet, create a combo chart titled \"Cumulative Income vs Expenses\" showing stacked areas for Cumulative Soft Costs, Cumulative Hard Costs, Cumulative Approval Costs, Cumulative Acquisition, and Cumulative Landowner Revenue Sharing with a dashed line for Cumulative Sales across Months 1–38. In the Cashflow (Quarterly) sheet, calculate Phase 1 Base Rate under Sale by summing values across all periods. In the Construction Schedule (1) sheet, calculate Mobilization Logistics Amount/sf by dividing the amount by Total Saleable Area, then distribute Mobilization Logistics evenly across periods between its Start Date and End Date. In the Executive Summary sheet, calculate Aggregate LP Contribution by summing all quarterly LP Contribution values, then link Projected Duration from Cashflow (Monthly)."
