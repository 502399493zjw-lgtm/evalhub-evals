    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the BS_Sch sheet, link Fixed Assets Additions from CapEx assumptions for 2022E–2027E, then calculate Closing Gross Block for 2022E–2027E, then calculate Net PPE for 2022E–2027E. Calculate Loan Repayment for 2022E–2027E, then calculate Interest Expense for 2022E–2027E using average outstanding loan balance. In the Valuation Summary and Football sheet, calculate Implied EBITDA Multiple for all blended valuation methods."
