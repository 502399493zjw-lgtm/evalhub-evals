    prompt: "Create a football field valuation chart titled 'Project Mars - Standalone Valuation Summary'. Display horizontal bars showing valuation ranges for each methodology. List methodologies vertically on the Y-axis in this order from top to bottom: DCF (Based on Management Forecast), Precedent Transactions (10.7x - 13.0x Management 2025A EBITDA), Mgmt Projections 2026E (Based on 9.0x - 15.0x Management Projection), Mgmt Projections 2027E (Based on 8.5x - 14.5x Management Projection), Analyst Target Price Range, 52-Week Trading Range. Use light blue bars for Analyst Target Price Range and 52-Week Trading Range, and dark blue bars for all other methodologies. The X-axis should show share price from $15.00 to $65.00 with gridlines every $5.00. Add data labels on each bar showing the low and high values of the range.\n"
    translation: "根据给定的估值方法及其区间数据，创建一张标题为 'Project Mars - Standalone Valuation Summary' 的足球场估值图。完成要求如下：显示水平条形图，以展示每种估值方法的估值区间。按以下从上到下的顺序在 Y 轴上纵向列出估值方法：DCF (Based on Management Forecast)、Precedent Transactions (10.7x - 13.0x Management 2025A EBITDA)、Mgmt Projections 2026E (Based on 9.0x - 15.0x Management Projection)、Mgmt Projections 2027E (Based on 8.5x - 14.5x Management Projection)、Analyst Target Price Range、52-Week Trading Range。Analyst Target Price Range 和 52-Week Trading Range 使用浅蓝色条形，其余所有估值方法使用深蓝色条形。X 轴必须显示 $15.00 至 $65.00 的每股价格，并每隔 $5.00 显示网格线。为每个条形添加数据标签，显示区间的最低值和最高值。"
