  - id: "visualization-aceb537b-3a26-41bf-a344-4569b89aae5e"
    label: "可视化任务（上游 Task 132）"
    prompt: "Create four multi-series line charts from the data in Sheet1. Each chart should have the four cases (Street, Mgmt-Base, Mgmt-Low, Mgmt-High) as separate series with distinct colours and markers, fiscal years FY26E to FY29E on the X-axis, a legend, and data labels at each point.\n\n(i) Revenue chart: Title \"Revenue\" in bold, top center. Y-axis from $400m to $1,600m with $200m increments.\n\n(ii) EBIT chart: Title \"EBIT\" in bold, top center. Y-axis from $(60)m to $90m with $50m increments.\n\n(iii) Revenue Growth chart: Title \"Revenue Growth (%)\" in bold, top center. Y-axis from 0.0% to 35.0% with 5% increments.\n\n(iv) EBIT Margin chart: Title \"EBIT margin (%)\" in bold, top center. Y-axis from (10.0)% to 10.0% with 5% increments."
    translation: "根据 Sheet1 中的数据创建 4 张多系列折线图。每张图都必须将 4 个 cases（Street、Mgmt-Base、Mgmt-Low、Mgmt-High）作为颜色和标记各不相同的独立系列；X 轴为 FY26E 到 FY29E；并包含图例及每个点的数据标签。\n\n(i) Revenue chart：标题 \"Revenue\" 加粗并置于顶部居中。Y 轴范围为 $400m 到 $1,600m，增量为 $200m。\n\n(ii) EBIT chart：标题 \"EBIT\" 加粗并置于顶部居中。Y 轴范围为 $(60)m 到 $90m，增量为 $50m。\n\n(iii) Revenue Growth chart：标题 \"Revenue Growth (%)\" 加粗并置于顶部居中。Y 轴范围为 0.0% 到 35.0%，增量为 5%。\n\n(iv) EBIT Margin chart：标题 \"EBIT margin (%)\" 加粗并置于顶部居中。Y 轴范围为 (10.0)% 到 10.0%，增量为 5%。\n完成结果必须满足上述全部要求。"
