  - id: "financial-model-17-01"
    label: "财务建模任务（上游 17_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Financials sheet, calculate Revenue Growth YoY for all periods, then calculate Gross Profit for 2008–2018F, then calculate EBITDA for 2008–2018F, then calculate Tax Provision for 2014F–2018F using the Effective Tax Rate. In the Assumptions sheet, calculate Personal Care Revenue for 2014F–2018F using the Growth YoY assumption, then calculate Total Capex for 2014F–2018F as a percentage of Revenue, then calculate COGS for 2014F–2018F as a percentage of Revenue."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Financials 工作表中，计算所有期间的 Revenue Growth YoY，然后计算 2008–2018F 的 Gross Profit，再计算 2008–2018F 的 EBITDA，随后使用 Effective Tax Rate 计算 2014F–2018F 的 Tax Provision。在 Assumptions 工作表中，使用 Growth YoY 假设计算 2014F–2018F 的 Personal Care Revenue，然后按 Revenue 的百分比计算 2014F–2018F 的 Total Capex，再按 Revenue 的百分比计算 2014F–2018F 的 COGS。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/17_Project FMCG/17_01_FMCG_input.xlsx; keep spreadsheet/17_Project FMCG/17_FMCG_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-17-01."
