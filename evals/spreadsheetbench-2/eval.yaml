  - id: "financial-model-01-01"
    label: "财务建模任务（上游 01_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Consolidated P&L sheet, calculate the CAGR of Total Revenue from 2025 to 2030. In the Revenue Drivers sheet, reference actual Other Revenue from another tab, and then hardcode the % of Operating Revenue for the forecasted years as the same value as the last actual year’s value. From that, calculate forecasted Other Revenue. Compute operational costs for each Foundation Course line item in the cost drivers. In the Working Capital Schedule sheet, calculate changes in Working Capital for the forecast period using a roll-forward approach based on period-to-period movements in trade receivables, inventory, and trade payables. In the Fixed Assets Schedule sheet, compute depreciation by applying the 25% assumption to opening balance plus capital expenditure for the forecast period. In the Consolidated BS sheet, add a validation check for each year."
    translation: "根据所提供的假设完成财务模型；完成要求是在整个过程中保留模型现有的结构、布局和格式。\n在 Consolidated P&L 工作表中，计算 Total Revenue 从 2025 到 2030 的 CAGR。在 Revenue Drivers 工作表中，从另一个标签页引用实际 Other Revenue，然后将预测年度的 % of Operating Revenue 硬编码为与最后一个实际年度相同的值，并据此计算预测 Other Revenue。在成本驱动因素中，计算每个 Foundation Course 明细项的运营成本。在 Working Capital Schedule 工作表中，采用基于 trade receivables、inventory 和 trade payables 逐期变动的滚动推进方法，计算预测期内 Working Capital 的变动。在 Fixed Assets Schedule 工作表中，对预测期的 opening balance 加 capital expenditure 应用 25% 假设，计算 depreciation。在 Consolidated BS 工作表中，为每个年度添加 validation check。"
