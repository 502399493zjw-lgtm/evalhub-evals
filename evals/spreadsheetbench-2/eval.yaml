  - id: "visualization-96ae351a-4fd6-48fa-915d-a4e2aa4bc02a"
    label: "可视化任务（上游 Task 1426290）"
    prompt: "Based on the daily patrol times, calculate the average patrol duration for each day and place it in a new \"Average\" column at the end of that day's row. Identify all durations strictly greater than the daily average and display them in red text. For each of these above-average durations, apply a soft orange fill to the corresponding start time, finish time, and duration cells.\n\nIn a new \"Avg. Excess Duration\" column (next to \"Average\"), calculate the average of only the above-average durations for that day.\n\nCreate a new sheet named \"Graph Average Patrol Time\" containing:\n\n1. A helper table with dates as column headers and the following as row labels:\n   - Date (in DD-MMM format)\n   - Average Patrol Time\n   - Ideal Average Time (constant 30 minutes)\n   - Avg. Excess Duration\n   - Count Above Average (count of durations exceeding the daily average)\n\n2. A combo chart positioned below the helper table with:\n   - Three line series (straight lines with markers):\n     - Average Patrol Time (blue)\n     - Ideal Average Time (orange)\n     - Avg. Excess Duration (green)\n   - One bar series on a secondary Y-axis:\n     - Count Above Average (gray)\n\n3. Chart title \"Patrol Duration Overview\" at top center, legend at bottom.\n4. X-axis for dates, primary Y-axis for durations, secondary Y-axis for count."
    translation: "根据每日巡逻时间，计算每天的平均巡逻时长，并将结果放在该日所在行末尾新增的 \"Average\" 列中。识别所有严格大于当日平均值的时长，并以红色文本显示。对于每个高于平均值的时长，对相应的 start time、finish time 和 duration 单元格应用浅橙色填充。\n\n在新的 \"Avg. Excess Duration\" 列中（紧邻 \"Average\"），计算当天仅包含高于平均值时长的平均值。\n\n新建名为 \"Graph Average Patrol Time\" 的工作表，其中包含：\n\n1. 一个辅助表，以日期作为列标题，并使用以下行标签：\n   - Date（采用 DD-MMM 格式）\n   - Average Patrol Time\n   - Ideal Average Time（固定为 30 minutes）\n   - Avg. Excess Duration\n   - Count Above Average（超过当日平均值的时长数量）\n\n2. 在辅助表下方放置一张组合图，包含：\n   - 3 个折线系列（带标记的直线）：\n     - Average Patrol Time（蓝色）\n     - Ideal Average Time（橙色）\n     - Avg. Excess Duration（绿色）\n   - 1 个使用次 Y 轴的条形系列：\n     - Count Above Average（灰色）\n\n3. 图表标题 \"Patrol Duration Overview\" 位于顶部居中，图例位于底部。\n4. X 轴表示日期，主 Y 轴表示时长，次 Y 轴表示数量。完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1426290/Task 1426290_input.xlsx; keep spreadsheet/Task 1426290/Task 1426290_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-96ae351a-4fd6-48fa-915d-a4e2aa4bc02a."
