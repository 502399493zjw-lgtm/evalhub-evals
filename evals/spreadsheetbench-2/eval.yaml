    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Balance Sheet Schedules, set Depreciation Rate at 1% monthly from Apr-25 to Mar-30, then calculate Depreciation and Net Block for all months. Set Advance from Customers payable days (5 days Apr-25, 10 days Apr-26, 15 days Apr-27). In the Assumption sheet, set the Cost per Indexing at 10.2 in Apr-25 and then annually, it should escalate using the Inflation Rate from DCF. Also set Tradeshow cost at 2,500 Apr-25 escalating similarly. In the Employee Expense sheet, add Director with count of 2 from Apr-25."
