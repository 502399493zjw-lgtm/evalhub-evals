    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Cashflow (Monthly) sheet, link Design & Preconstruction monthly costs for Years 1–7 from the Construction Schedule. Calculate Approval Cost by distributing the total amount evenly over its duration starting from the Start Date. Calculate EQx for GP Performance by dividing total positive Net Equity Cashflows by the absolute total of negative values. Calculate Equity Injection for Years 1–7 as Opening Balance plus Net Project Cashflows, returning only negative values (otherwise zero). Calculate Equity Distribution During Project for Years 1–7 to distribute positive Net Project Cashflows to equity investors between defined start and end dates when cumulative cashflows are positive. Calculate Equity Balance for Years 1–7 as the maximum of Opening Balance, Equity Injection, Equity Distribution During Project, Equity Balloon Payment, and Total Equity Payout for each period."
