  - id: "financial-model-07-01"
    label: "财务建模任务（上游 07_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Sales Schedule sheet, implement a scenario selector (in cell F16, Scenarios 1–5, default to scenario 1) that drives all sales calculations including pricing, absorption, collections, and ancillary revenue. In the Cashflow (Quarterly) sheet, align Acquisition Costs with the start dates and durations in Inputs, then in the Cashflow (Monthly) sheet, reconstruct the monthly allocation for all time-bound costs across Years 1–7 based on the same timing parameters. In the Executive Summary sheet, link the year and period labels to the Cashflow (Quarterly) timeline, then reconstruct the Closing Balance for each period in Project Cashflows. In the Cashflow (Monthly) sheet, reconstruct the Prestige Financing recognition based on the commencement date in Inputs. In the Cashflow (Quarterly) sheet, reconstruct Approval Costs for Years 1–5 by aggregating monthly values."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Sales Schedule 工作表中，实现情景选择器（位于单元格 F16，情景 1–5，默认为情景 1），由它驱动所有销售计算，包括定价、去化、回款和附加收入。在 Cashflow (Quarterly) 工作表中，使 Acquisition Costs 与 Inputs 中的开始日期和持续时间保持一致；然后在 Cashflow (Monthly) 工作表中，根据相同的时间参数，重新构建 Years 1–7 中所有有时间限制成本的月度分配。在 Executive Summary 工作表中，将年份和期间标签链接到 Cashflow (Quarterly) 时间线，然后重新构建 Project Cashflows 中每个期间的 Closing Balance。在 Cashflow (Monthly) 工作表中，根据 Inputs 中的开始日期重新构建 Prestige Financing 的确认。在 Cashflow (Quarterly) 工作表中，通过汇总月度数值，重新构建 Years 1–5 的 Approval Costs。\n完成结果必须满足上述全部要求。"
