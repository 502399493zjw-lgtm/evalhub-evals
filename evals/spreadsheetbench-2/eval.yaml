  - id: "financial-model-06-01"
    label: "财务建模任务（上游 06_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Assumption sheet, set Content Writing guest post percentage at 8% Apr-25, increasing 15% in Apr-26 and Apr-27, 10% in Apr-28. Also set Content Writing Cost per unit at 0.50 Apr-25, 0.55 Apr-26, 0.60 Apr-27, 0.70 Apr-28, 0.75 Apr-29. In the DCF sheet, calculate Net Cost of Debt. In the Balance Sheet Schedules, apply 10% annual interest. In the Balance Sheet, calculate Total Liabilities and Equity and validate against Total Assets. In the Employee Expenses sheet, set SEO salary from Apr-25 escalating annually through Mar-30 using Inflation Rate from DCF."
