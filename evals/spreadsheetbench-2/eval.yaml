  - id: "visualization-3397711e-d174-4b2e-b252-8279d78f9f88"
    label: "可视化任务（上游 Task 1437004）"
    prompt: "Pull the data from the \"Sharepoint Tracker\" sheet, count the total number of TRUE values in each category for each corresponding month, then populate a monthly summary table in the \"Data\" sheet with columns for Months, Desk drops, Newsletters, and SharePoint Changes listing all 12 months (January through December) and a total row for the year. \n\nOnce complete, create an overview dashboard on the \"Data\" sheet with three charts:\n1. A multi-series line chart titled \"Monthly Activity Trends\" showing each category's count per month.\n2. A pie chart titled \"Split for The Year\" showing the yearly total proportion of each category.\n3. A 100% stacked bar chart titled \"Share of Activity Per Month\" showing the percentage breakdown of categories within each month."
    translation: "从 \"Sharepoint Tracker\" 工作表提取数据，统计每个对应月份内各 category 的 TRUE 值总数，然后在 \"Data\" 工作表中填充月度汇总表。该表必须包含 Months、Desk drops、Newsletters 和 SharePoint Changes 列，列出全部 12 个月（January 至 December），并包含一行全年 total。\n\n完成汇总表后，在 \"Data\" 工作表上创建概览仪表板，包含以下 3 张图表：\n1. 标题为 \"Monthly Activity Trends\" 的多系列折线图，显示各 category 每月的计数。\n2. 标题为 \"Split for The Year\" 的饼图，显示各 category 全年总数所占比例。\n3. 标题为 \"Share of Activity Per Month\" 的 100% 堆积条形图，显示每个月内各 category 的百分比分布。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1437004/Task 1437004_input.xlsx; keep spreadsheet/Task 1437004/Task 1437004_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-3397711e-d174-4b2e-b252-8279d78f9f88."
