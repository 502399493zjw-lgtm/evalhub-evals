    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Ratios sheet, calculate Net Income Growth for 2020A–2027E, then calculate Current Ratio for 2019A–2027E. In the Graphs sheet, create a column chart for Revenue from 2019A–2027E. In the Synergies and Intgn Exp sheet, calculate Direct Labor cost synergy for 2022E–2027E at 10% of Direct Labor from the Income Statement, then calculate New Headcount to Support Incremental Growth for 2023E–2027E, then calculate Total Cost Synergy for 2023E–2027E by aggregating all cost synergy components."
