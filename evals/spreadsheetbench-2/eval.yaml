    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Ratio Analysis sheet, calculate Net Profit % for FY33–FY39 as Net Profit divided by Gross Income. In the Cash Budget sheet, calculate Base Amount Receivable for FY22 Q1–Q4, FY23 Q4, and FY24 Q1–Q4 by applying the Government Incentive percentage to Total Project Cost. In the Revenue sheet, calculate Adjusted O&M for PIM for FY33–FY39 by applying the Price Index Multiple to Actual O&M cost. In the Cash Flow sheet, calculate Net Cash Generation for FY33–FY39 by summing operating, investing, and financing cash flows. In the Milestones sheet, calculate Cost of Project for Phase I–IV based on work completed percentage."
