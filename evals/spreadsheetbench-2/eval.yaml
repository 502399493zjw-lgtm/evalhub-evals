  - id: "visualization-57d1c089-cf23-436a-8348-d79a0808d768"
    label: "可视化任务（上游 Task 1431124）"
    prompt: "Create a dynamic summary section in the “Forecasting Summary Data” sheet that first includes a drop-down list for selecting the Service Area, defaulting to 'B'. Use this selection to automatically generate two summary tables: one showing the 4 quarterly values (Quarter) and another showing cumulative values (Quarter (Cum)) for Blue, Green, Blue & Green, and Original, by summarizing the main dataset. Ensure the tables update based on the selected Service Area and exclude totals or blank rows. Then, create two linked line charts from these tables: a “By Quarter” chart plotting the four series against Qtr 1-4, and a “Cumulative” chart plotting the cumulative values over the same quarters. Format both charts in £ currency, include legends, use line charts with markers, place the quarterly chart above the cumulative chart, and ensure all tables and charts update automatically when the Service Area selection changes."
    translation: "在 “Forecasting Summary Data” 工作表中创建动态汇总区域。首先添加用于选择 Service Area 的下拉列表，默认值为 'B'。使用该选择自动生成 2 个汇总表：一个显示 Blue、Green、Blue & Green 和 Original 的 4 个 quarterly values（Quarter），另一个显示这些系列的 cumulative values（Quarter (Cum)）；两表均通过汇总主数据集生成。确保表格随所选 Service Area 更新，并排除 totals 或 blank rows。\n\n然后依据这两个表创建 2 张关联折线图：一张 “By Quarter” 图，将 4 个系列相对于 Qtr 1-4 绘制；一张 “Cumulative” 图，在相同 quarters 上绘制 cumulative values。两张图均采用 £ currency 格式、包含图例并使用带标记的折线图；quarterly chart 置于 cumulative chart 上方。完成要求是当 Service Area 选择改变时，所有表格和图表都自动更新。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1431124/Task 1431124_input.xlsx; keep spreadsheet/Task 1431124/Task 1431124_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-57d1c089-cf23-436a-8348-d79a0808d768."
  - id: "visualization-7b6e0284-b185-47a5-94c4-30d80656cbf7"
    label: "可视化任务（上游 Task 1421372）"
    prompt: "Create a dashboard on a sheet named “Summary” to consolidate data from 2-hour racing events, organizing the data into 5-minute time blocks from 0 & 5 MINS through 115 & 120 MINS\n\nAdd a drop-down menu on the Summary sheet to allow users to select a racing event. Set the default selection to SEB'18.\n\nBased on the selected racing event, dynamically display a multi-series line chart that visualizes the YELLOW, PIT, DRIVER CHANGE, Dive-in, and Worst Position data series across these time blocks.\n\nPlot WORST POSITION as a standard line. Plot YELLOW, PIT, DRIVER CHANGE, and DIVE-IN as marker-only series (no connecting lines) using large markers, with each event placed at a separate negative y-value so they appear as distinct indicator rows below the zero line. Suppress markers where no event occurred. Hide the negative y-axis values.\n\nPosition the legend at the bottom of the chart.\n\nThe chart should be titled:\n“Race Events by 5-Minute Time Intervals.”"
    translation: "在名为 “Summary” 的工作表上创建一个仪表板，用于汇总 2-hour racing events 的数据，并将数据组织成从 0 & 5 MINS 到 115 & 120 MINS 的 5-minute time blocks。\n\n在 Summary 工作表上添加一个下拉菜单，让用户选择 racing event。将默认选择设为 SEB'18。\n\n根据所选 racing event，动态显示一张多系列折线图，在这些 time blocks 上可视化 YELLOW、PIT、DRIVER CHANGE、Dive-in 和 Worst Position 数据系列。\n\n将 WORST POSITION 绘制为标准折线。将 YELLOW、PIT、DRIVER CHANGE 和 DIVE-IN 绘制为仅有标记、不带连接线的系列，并使用大型标记；将每类 event 放在彼此不同的负 Y 值上，使其作为零线下方不同的指示行显示。未发生 event 时不显示标记。隐藏负数 Y 轴值。\n\n将图例置于图表底部。\n\n图表标题必须为：\n“Race Events by 5-Minute Time Intervals.”\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1421372/Task 1421372_input.xlsx; keep spreadsheet/Task 1421372/Task 1421372_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-7b6e0284-b185-47a5-94c4-30d80656cbf7."
  - id: "visualization-32a173fa-b6f5-407c-9fe1-e0aecb1f5db9"
    label: "可视化任务（上游 Task 1419935）"
    prompt: "Using the volleyball game raw data (with rows: Points, Team (where Team is \"ETV\" or \"Opp\"), Event, Player, and Position, create the following visualizations:\n\nMake a \"Game Progression\" sheet, and create a pivot table (cell A1) categorised by Team (ETV, Opp) as rows and Points (1-39) as columns, showing Count of Points as values. Then, apply red background conditional formatting to the cells containing \"1\" to show which team acted at each Point.\n\nOn the \"Pie Charts\" sheet, use the two pivot tables to create corresponding pie charts: one showing Event type distribution (A, AE, B, BE, DE, K, PE, SE) by count, and another showing Player involvement displayed as percentages of the grand total. Create a slicer for each pie chart for Team (\"ETV\" and \"Opp\") and name the pie charts \"Number of Game Events\" and \"Count of Player Activities\", respectively.\n\nDefault the Team slicer for the Event pie chart to 'Opp' only, and the Team slicer for the Player pie chart to both 'ETV' and 'Opp'.\""
    translation: "使用 volleyball game raw data（行字段为 Points、Team〔其中 Team 为 \"ETV\" 或 \"Opp\"〕、Event、Player 和 Position）创建以下可视化：\n\n新建 “Game Progression” 工作表，并从单元格 A1 开始创建数据透视表：以 Team（ETV、Opp）作为行，以 Points（1-39）作为列，以 Count of Points 作为值。然后，对包含 \"1\" 的单元格应用红色背景条件格式，以显示每个 Point 由哪支 team 执行动作。\n\n在 “Pie Charts” 工作表上，使用 2 个数据透视表创建对应的饼图：一张按 count 显示 Event type 分布（A、AE、B、BE、DE、K、PE、SE），另一张将 Player involvement 显示为 grand total 的百分比。为每张饼图分别创建 Team（\"ETV\" 和 \"Opp\"）切片器，并将两张饼图依次命名为 \"Number of Game Events\" 和 \"Count of Player Activities\"。\n\nEvent 饼图的 Team 切片器默认只选择 'Opp'；Player 饼图的 Team 切片器默认同时选择 'ETV' 和 'Opp'。完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1419935/Task 1419935_input.xlsx; keep spreadsheet/Task 1419935/Task 1419935_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-32a173fa-b6f5-407c-9fe1-e0aecb1f5db9."
  - id: "visualization-e3d30eb7-5dc1-4e91-b3cf-df2f003cf9a6"
    label: "可视化任务（上游 Task 1422635）"
    prompt: "Create a scatter chart from my blood sugar data using the Date and Value columns. Add helper columns with formulas that automatically split the values into three categories: Low (<7), Normal (7-12), and High (>12). The chart should display three separate data series with blue dots for low values, green dots for normal values, and red dots for high values. In addition, put min and max dash lines in the colour orange at 7 and 12 on the scatter graph. Add data labels showing the value next to each dot and include a legend to identify each category plus title the graph \"Monthly Blood Sugar Levels\". "
    translation: "使用给定 blood sugar data 中的 Date 和 Value 列创建散点图。添加带公式的辅助列，自动把 values 分为 3 类：Low（<7）、Normal（7-12）和 High（>12）。图表必须显示 3 个独立数据系列：低值使用蓝色点，正常值使用绿色点，高值使用红色点。此外，在散点图的 7 和 12 位置添加橙色的 min 与 max 虚线。添加数据标签，在每个点旁显示其 value；添加用于识别各 category 的图例；并将图表标题设为 \"Monthly Blood Sugar Levels\"。完成结果必须满足上述要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 1422635/Task 1422635_input.xlsx; keep spreadsheet/Task 1422635/Task 1422635_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-e3d30eb7-5dc1-4e91-b3cf-df2f003cf9a6."
  - id: "visualization-201f0e0e-eb67-41c5-8ed4-ad0cf2233b47"
    label: "可视化任务（上游 Task 131）"
    prompt: "Create a waterfall (bridge) chart titled 'EBITDA Waterfall ($M)' showing the movement in EBITDA from FY22 to FY23. Start with FY22 EBITDA as the opening total bar, then add sequential contribution bars for FX Tailwind, Gross Profit, Employee Costs, Direct Marketing, and Other Opex, ending with FY23 EBITDA as the closing total bar. Positive contributors (FX Tailwind, Gross Profit) should be yellow, negative contributors (Employee Costs, Direct Marketing, Other Opex) should be grey, and both the FY22 and FY23 EBITDA total bars should be dark blue. Label each bar with its value using $Xm for positive values and $(X)m for negative values. No decimals."
    translation: "根据给定数据创建一张标题为 'EBITDA Waterfall ($M)' 的瀑布图（桥图），显示 EBITDA 从 FY22 到 FY23 的变动。以 FY22 EBITDA 作为起始 total bar，随后依次添加 FX Tailwind、Gross Profit、Employee Costs、Direct Marketing 和 Other Opex 的 contribution bars，并以 FY23 EBITDA 作为结束 total bar。正向贡献项（FX Tailwind、Gross Profit）必须为黄色，负向贡献项（Employee Costs、Direct Marketing、Other Opex）必须为灰色，FY22 和 FY23 EBITDA 的 total bars 均必须为深蓝色。为每个条形添加数值标签：正值使用 $Xm，负值使用 $(X)m，不保留小数。完成结果必须满足上述要求。"
