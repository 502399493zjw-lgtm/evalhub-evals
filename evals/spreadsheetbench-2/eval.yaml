  - id: "visualization-bae5c3cc-788d-4b2d-82e0-353600d60dfb"
    label: "可视化任务（上游 Task 1428419）"
    prompt: "1. Create a chart titled \"Chart A Scores\". Each row of data from the Chart A column should appear as a single square marker positioned along a fixed horizontal 0–10 axis, with all rows stacked vertically (first row at top, last row at bottom). Color each marker based on its value: Red if <3, Yellow if ≥3 and <8, Green if ≥8. Include a thin horizontal grey guideline spanning the full axis width for each row. Label the left end of the scale endpoints as \"Low\" and the right end \"High\" for each row and suppress all numeric axis labels and gridlines. Place the chart title at the top centre.\n\n2. Create a chart titled \"Chart B Scores\". Each row of data from the Chart B column should appear as a point positioned along a horizontal 0–10 axis, with all rows stacked vertically in their original order (first row at top, last row at bottom). Connect all points with a single continuous line in soft green. Label the left end of the axis \"Low\" and the right end \"High,\" and suppress all numeric axis labels and gridlines. Place the chart title at the top centre."
    translation: "1. 创建一张标题为 \"Chart A Scores\" 的图表。Chart A 列中每一行的数据必须显示为一个方形标记，沿固定的水平 0–10 轴定位；所有行垂直堆叠，第一行位于顶部，最后一行位于底部。根据数值为每个标记着色：小于 3 时为红色，大于等于 3 且小于 8 时为黄色，大于等于 8 时为绿色。为每一行添加一条横跨整个坐标轴宽度的细灰色水平参考线。每一行刻度左端标为 \"Low\"，右端标为 \"High\"，并隐藏所有数值轴标签和网格线。图表标题置于顶部居中。\n\n2. 创建一张标题为 \"Chart B Scores\" 的图表。Chart B 列中每一行的数据必须显示为一个点，沿水平 0–10 轴定位；所有行按原始顺序垂直堆叠，第一行位于顶部，最后一行位于底部。用一条浅绿色的连续线连接所有点。坐标轴左端标为 \"Low\"，右端标为 \"High,\"，并隐藏所有数值轴标签和网格线。图表标题置于顶部居中。完成结果必须满足上述全部要求。"
