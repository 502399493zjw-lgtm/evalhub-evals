  - id: "financial-model-07-02"
    label: "财务建模任务（上游 07_02）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Executive Summary sheet, create a combo chart titled \"Forecasted Project Cashflows\" showing stacked columns for Acquisition Costs, Hard Costs, Soft Costs, Approval Costs, and LO Revenue. Sharing with a line overlay for Sales Revenue across Q1–Q12. Then calculate Sold Area as Total Saleable Area minus Balance Saleable Area by referencing Inputs, and link Acquisition Costs for Q1 2025 through Q13 2028 from Cashflow (Quarterly). In the Construction Schedule (1) sheet, calculate Amount/sf for Design and Preconstruction by dividing each item amount by total saleable area, then calculate End Month for Mobilization Logistics by adding Duration to Start Date. Link Construction Area to the corresponding value in Inputs."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Executive Summary 工作表中，创建标题为 \"Forecasted Project Cashflows\" 的组合图：用堆积柱形显示 Q1–Q12 的 Acquisition Costs、Hard Costs、Soft Costs、Approval Costs 和 LO Revenue Sharing，并叠加一条显示 Sales Revenue 的折线。然后通过引用 Inputs，以 Total Saleable Area 减去 Balance Saleable Area 来计算 Sold Area，并从 Cashflow (Quarterly) 链接 Q1 2025 至 Q13 2028 的 Acquisition Costs。在 Construction Schedule (1) 工作表中，用每个项目的金额除以总可售面积，计算 Design and Preconstruction 的 Amount/sf，然后用 Start Date 加 Duration 来计算 Mobilization Logistics 的 End Month。将 Construction Area 链接至 Inputs 中相应的值。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/07_Project Real Estate Financial Model/07_02_RealEstate_input.xlsx; keep spreadsheet/07_Project Real Estate Financial Model/07_RealEstate_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-07-02."
  - id: "financial-model-07-03"
    label: "财务建模任务（上游 07_03）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Sales Schedule sheet, calculate FSI by dividing Built-up Area by Land Area, then calculate Average Apartment Size by dividing Built-up Area by Number of Apartments. In the Cashflow (Monthly) sheet, link Area Assumptions (Apartments Built-up Area, Basement Area, Number of Units) from Inputs, then calculate Cumulative Approval Costs from Year 1 to Year 7 as a running total. Then calculate EQx in Project Performance by dividing total positive Net Cashflows After Financing by total negative Net Cashflows After Financing. Link the Start Date for each Hard Costs line item (Design & Preconstruction, Superstructure, Building Envelope, MEP, Interior Works, Fixtures & Equipment, Common Areas) to corresponding values in Inputs."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Sales Schedule 工作表中，用 Built-up Area 除以 Land Area 来计算 FSI，然后用 Built-up Area 除以 Number of Apartments 来计算 Average Apartment Size。在 Cashflow (Monthly) 工作表中，从 Inputs 链接 Area Assumptions（Apartments Built-up Area、Basement Area、Number of Units），然后以滚动累计方式计算 Year 1 至 Year 7 的 Cumulative Approval Costs。然后在 Project Performance 中，用 Net Cashflows After Financing 的正值总额除以 Net Cashflows After Financing 的负值总额来计算 EQx。将每个 Hard Costs 行项目（Design & Preconstruction、Superstructure、Building Envelope、MEP、Interior Works、Fixtures & Equipment、Common Areas）的 Start Date 链接到 Inputs 中相应的值。\n完成结果必须满足上述全部要求。"
