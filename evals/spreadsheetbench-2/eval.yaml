  - id: "visualization-fa8df8be-3865-425b-ab5d-fd8eb1a7a9da"
    label: "可视化任务（上游 Task 129）"
    prompt: "Create a football field valuation chart titled 'Project Mars - Standalone Valuation Summary'. Display horizontal bars showing valuation ranges for each methodology. List methodologies vertically on the Y-axis in this order from top to bottom: DCF (Based on Management Forecast), Precedent Transactions (10.7x - 13.0x Management 2025A EBITDA), Mgmt Projections 2026E (Based on 9.0x - 15.0x Management Projection), Mgmt Projections 2027E (Based on 8.5x - 14.5x Management Projection), Analyst Target Price Range, 52-Week Trading Range. Use light blue bars for Analyst Target Price Range and 52-Week Trading Range, and dark blue bars for all other methodologies. The X-axis should show share price from $15.00 to $65.00 with gridlines every $5.00. Add data labels on each bar showing the low and high values of the range.\n"
    translation: "创建一张标题为“Project Mars - Standalone Valuation Summary”的足球场估值图。显示水平条形图，以展示每种估值方法的估值区间。按以下从上到下的顺序在 Y 轴上纵向列出估值方法：DCF (Based on Management Forecast)、Precedent Transactions (10.7x - 13.0x Management 2025A EBITDA)、Mgmt Projections 2026E (Based on 9.0x - 15.0x Management Projection)、Mgmt Projections 2027E (Based on 8.5x - 14.5x Management Projection)、Analyst Target Price Range、52-Week Trading Range。Analyst Target Price Range 和 52-Week Trading Range 使用浅蓝色条形，其余所有估值方法使用深蓝色条形。X 轴应显示 $15.00 至 $65.00 的每股价格，并每隔 $5.00 显示网格线。为每个条形添加数据标签，显示区间的最低值和最高值。\n"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 129/Task 129_input.xlsx; keep spreadsheet/Task 129/Task 129_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-fa8df8be-3865-425b-ab5d-fd8eb1a7a9da."
