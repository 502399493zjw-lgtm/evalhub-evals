    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/16_Project Ramjet/16_02_Ramjet_input.xlsx; keep spreadsheet/16_Project Ramjet/16_Ramjet_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-16-02."
