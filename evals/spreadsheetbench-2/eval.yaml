  - id: "visualization-278848e9-6678-4425-a0cb-b94c6fd30663"
    label: "可视化任务（上游 Task 134）"
    prompt: "Using the ellipse data in columns A and B, create a scatter chart with blue markers forming the ellipse. Label the six vertices where the ellipse crosses the axes as A, B, C, D, E, and F, proceeding clockwise from the top (A is where the ellipse crosses the positive Y-axis). Point B is located on the ellipse at the intersection with a line drawn from the origin to the upper-right corner of the ellipse's bounding box, at approximately (2,190,000, 12,939). Connect all six vertices A through F in order with dashed lines to form a closed polygon. Also draw a solid green line from the origin (0, 0) to the upper-right bounding-box corner at approximately (2,434,688, 14,285) to indicate the direction used to locate point B."
    translation: "使用 A 列和 B 列中的 ellipse data 创建散点图，以蓝色标记形成椭圆。对椭圆与各轴相交处的 6 个顶点按 A、B、C、D、E、F 标注，从顶部开始顺时针排列（A 是椭圆与正 Y 轴的交点）。点 B 位于椭圆与一条从原点画向椭圆边界框右上角的直线之交点，坐标约为 (2,190,000, 12,939)。按顺序用虚线连接 A 到 F 的全部 6 个顶点，形成闭合多边形。另从原点 (0, 0) 向边界框右上角约 (2,434,688, 14,285) 处绘制一条绿色实线，以表示定位点 B 时所用的方向。完成结果必须满足上述要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/Task 134/Task 134_input.xlsx; keep spreadsheet/Task 134/Task 134_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official visualization checklist evaluator with the source criteria kept grader-only. Record this task's primary score as passed rubric criteria divided by total expected criteria, in [0,1]. Do not submit the evaluator's separate score > 0.7 binary acc as the primary score. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under visualization-278848e9-6678-4425-a0cb-b94c6fd30663."
  - id: "visualization-aaae1537-cfb6-406d-bf1e-2457a25bc154"
    label: "可视化任务（上游 Task 126）"
    prompt: "Create 2 Earnings Per Share charts using the provided dataset in the Surprise sheet (rows 50-71). The first chart is a multi-series combo chart shown by quarter. The primary Y-axis tracks EPS values and the secondary Y-axis tracks Price. Title the chart \"Quarterly Price Impact Analysis\" at the top center. Display 4 series: Differential (as overlay floating bars spanning from Mean to After Event for each period), After Event (line), Mean (Estimated Value) (markers only), and Price (line on secondary axis). The second chart is a diverging vertical column chart showing Price Impact (%) by quarter, titled \"Earnings Per Share: Actual vs. Estimated Performance\" at the top center. Both charts should display quarters from Q3 2020 to Q3 2025 on the X-axis."
    translation: "使用 Surprise 工作表中给定数据集的 rows 50-71 创建 2 张 Earnings Per Share 图表。第一张为按 quarter 显示的多系列组合图：主 Y 轴跟踪 EPS values，次 Y 轴跟踪 Price；顶部居中标题为 \"Quarterly Price Impact Analysis\"。显示 4 个系列：Differential（对每个 period，以从 Mean 跨至 After Event 的重叠浮动条形显示）、After Event（折线）、Mean (Estimated Value)（仅标记）以及 Price（次轴上的折线）。第二张为按 quarter 显示 Price Impact (%) 的发散式垂直柱形图，顶部居中标题为 \"Earnings Per Share: Actual vs. Estimated Performance\"。两张图的 X 轴都必须显示从 Q3 2020 到 Q3 2025 的 quarters。完成结果必须满足上述要求。"
