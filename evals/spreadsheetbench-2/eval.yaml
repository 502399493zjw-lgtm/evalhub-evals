    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Balance Sheet Schedules, calculate monthly Interest Payable from Apr-25 through Mar-30 and link to Interest Expense in the Income Statement. In the Income Statement, calculate EBIT for all periods. In the DCF sheet, link Changes in Working Capital for FY26 through the Terminal Year from the Balance Sheet Schedules, then calculate Present Value for each period, then calculate WACC."
