    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Input Sheet 中，定义 Transport Revenue 增长率（FY26 为 10%，FY27–FY30 为 30%），然后在 Revenue Drivers 选项卡中计算 FY26–FY30 的 Transport Revenue。还要在 Input Sheet 中，以 FY26 的 28 USD 为基数递增，计算 FY27–FY30 的 Warehousing Rate per Square Feet。在 Debt Schedule 中，计算从 FY26 起按 15% 计取的 Long Term Borrowings 利息。在 Asset Sch. 选项卡中，计算 FY26–FY30 的 Consolidated PPE Depreciation。在 IS 选项卡中，链接 Asset Sch 工作表中的 Depreciation & Amortization。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/13_Project Logistic/13_05_Logistic_input.xlsx; keep spreadsheet/13_Project Logistic/13_Logistic_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-13-05."
  - id: "financial-model-14-01"
    label: "财务建模任务（上游 14_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Working Capital sheet, calculate Change in Working Capital for 2020-21 through 2026-27 using a roll-forward approach based on period-to-period movements in receivables, inventory, and payables. In the Tax-P&L sheet, calculate Total Tax Expense for 2019-20 through 2026-27 under the New Tax Regime. In the Profit & Loss sheet, calculate EBITDA Margin for Q4 2019-20 through 2026-27. In the CFS sheet, add a control check validating that closing cash each period matches opening cash in the subsequent period. In the WACC sheet, calculate Mean and Median unlevered beta."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Working Capital 工作表中，采用滚动结转方法，根据应收款、存货和应付款的期间变动计算 2020-21 至 2026-27 的 Change in Working Capital。在 Tax-P&L 工作表中，按 New Tax Regime 计算 2019-20 至 2026-27 的 Total Tax Expense。在 Profit & Loss 工作表中，计算 Q4 2019-20 至 2026-27 的 EBITDA Margin。在 CFS 工作表中，添加一项控制检查，验证每个期间的期末现金与下一期间的期初现金一致。在 WACC 工作表中，计算无杠杆 beta 的平均值和中位数。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/14_Project Refinery/14_01_Refinery_input.xlsx; keep spreadsheet/14_Project Refinery/14_Refinery_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-14-01."
  - id: "financial-model-14-02"
    label: "财务建模任务（上游 14_02）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Fixed Asset & Depreciation sheet, calculate depreciation at 4.48% for FY20–FY27 using a roll-forward based on opening PP&E and capex. In the WACC sheet, calculate Adjusted Cost of Equity using CAPM including any applicable risk premiums, then calculate Post Tax Cost of Debt. In the DCF_Income Approach sheet, calculate Equity Value, then create a Sensitivity Analysis table linking Equity Value to the pre-defined Terminal Growth Rate and WACC ranges."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Fixed Asset & Depreciation 工作表中，基于期初 PP&E 和 capex 进行滚动结转，按 4.48% 计算 FY20–FY27 的折旧。在 WACC 工作表中，使用 CAPM 并纳入任何适用的风险溢价来计算 Adjusted Cost of Equity，然后计算 Post Tax Cost of Debt。在 DCF_Income Approach 工作表中，计算 Equity Value，然后创建一张 Sensitivity Analysis 表，将 Equity Value 链接到预定义的 Terminal Growth Rate 和 WACC 取值范围。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/14_Project Refinery/14_02_Refinery_input.xlsx; keep spreadsheet/14_Project Refinery/14_Refinery_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-14-02."
  - id: "financial-model-14-03"
    label: "财务建模任务（上游 14_03）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Fixed Asset & Depreciation sheet, calculate Maintenance Capex and also Depreciation for FY20–FY27 by linking revenue. In the DCF_Income Approach sheet, calculate IFCI's Stake using holding and equity shares, then calculate IFCI's Holding Fair Value, then calculate Discounted Cash Flow for FY20 (3 months) through FY27 and Terminal Value. In the Profit & Loss sheet, calculate Revenue Growth year-on-year for 2014-15 through 2026-27. In the Balance Sheet, link inventories, trade receivables, and trade payables for 2019-20 through 2026-27 from the Working Capital sheet. In the Cash Flow sheet, add a check comparing closing balance consistency with the Balance Sheet."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Fixed Asset & Depreciation 工作表中，通过链接收入计算 FY20–FY27 的 Maintenance Capex，并同时计算 Depreciation。在 DCF_Income Approach 工作表中，使用持股比例和权益份额计算 IFCI's Stake，然后计算 IFCI's Holding Fair Value，再计算 FY20（3 个月）至 FY27 的 Discounted Cash Flow 以及 Terminal Value。在 Profit & Loss 工作表中，计算 2014-15 至 2026-27 的收入同比增长率。在 Balance Sheet 中，从 Working Capital 工作表链接 2019-20 至 2026-27 的 inventories、trade receivables 和 trade payables。在 Cash Flow 工作表中，添加一项检查，将 closing balance 的一致性与 Balance Sheet 进行比较。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/14_Project Refinery/14_03_Refinery_input.xlsx; keep spreadsheet/14_Project Refinery/14_Refinery_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-14-03."
  - id: "financial-model-14-04"
    label: "财务建模任务（上游 14_04）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Profit & Loss sheet, calculate EBIT for all historical and forecast periods, then calculate EBITDA Margin. In the Product Pricing sheet, calculate forecast LPG price for 2022-23 through 2026-27 by growing from the 2021-22 base. In the DCF_Income Approach sheet, create a Sensitivity Analysis table linking Equity Value to the pre-defined Terminal Growth Rate and WACC ranges. In the Working Capital sheet, calculate Working Capital as a percentage of Revenue for all periods. In the WC Workings sheet, link Sales Days, Trade Payable Days, and Inventory Days for 2021-22 through 2026-27 using 2021-22 as the base."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Profit & Loss 工作表中，计算所有历史及预测期间的 EBIT，然后计算 EBITDA Margin。在 Product Pricing 工作表中，以 2021-22 为基期增长，计算 2022-23 至 2026-27 的预测 LPG 价格。在 DCF_Income Approach 工作表中，创建一张 Sensitivity Analysis 表，将 Equity Value 链接到预定义的 Terminal Growth Rate 和 WACC 取值范围。在 Working Capital 工作表中，计算所有期间的 Working Capital 占 Revenue 的百分比。在 WC Workings 工作表中，以 2021-22 为基数，链接 2021-22 至 2026-27 的 Sales Days、Trade Payable Days 和 Inventory Days。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/14_Project Refinery/14_04_Refinery_input.xlsx; keep spreadsheet/14_Project Refinery/14_Refinery_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-14-04."
  - id: "financial-model-14-05"
    label: "财务建模任务（上游 14_05）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Fixed Asset & Depreciation sheet, calculate Net Block for FY19–FY27. In the DCF_Income Approach sheet, calculate income tax for FY20–FY27 using the effective tax rate from the Tax-DCF sheet, applying the marginal tax rate for the terminal year, then calculate Free Cash Flows for all forecast periods. In the WACC sheet, calculate Mean and Median for Debt to Equity Ratio, 5 Year Beta, and Unlevered Beta. In the Revenue sheet, calculate Total Revenue for all products across all periods, then calculate Revenue – Petroleum and Revenue – Petrochemical as the sum of their respective product lines."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Fixed Asset & Depreciation 工作表中，计算 FY19–FY27 的 Net Block。在 DCF_Income Approach 工作表中，使用 Tax-DCF 工作表中的有效税率计算 FY20–FY27 的所得税，并对终值年度应用边际税率，然后计算所有预测期间的 Free Cash Flows。在 WACC 工作表中，计算 Debt to Equity Ratio、5 Year Beta 和 Unlevered Beta 的平均值与中位数。在 Revenue 工作表中，计算所有期间所有产品的 Total Revenue，然后分别对相应产品线求和，计算 Revenue – Petroleum 和 Revenue – Petrochemical。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/14_Project Refinery/14_05_Refinery_input.xlsx; keep spreadsheet/14_Project Refinery/14_Refinery_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-14-05."
  - id: "financial-model-15-01"
    label: "财务建模任务（上游 15_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\n\nIn the Work Sheet sheet, calculate the Occupied Beds for all segments from 4QFY24 onwards (both quarterly and annual), where possible, and then calculate the total Occupied Beds for the same time period in the State 1 section. Then, perform the same task for EBITDA. Subsequently, calculate Total Revenues (inc. Other Income) and Total EBITDA (inc. Other Income) for all time periods. After, in the Consol_annual sheet, for all sections part of Cash Flow Statement (concise), calculate the Net Cash, then calculate capital employed, and non-cash working capital (excl. debt) in the non-concise balance sheet section for all possible years. In the Consol_quarterly sheet, populate the quarterly data for Net Sales by referencing another tab, and then calculate Gross Profit and Gross Margin and then EBIT and Operating Margin. Following this, after referencing another tab for Income Tax Expense (Gain), calculate the tax rate (%) for all quarters. Then in the IS_BS_CF sheet, calculate all Total Equity & Liabilities and Total Assets for each year and for any quarter that has data, and then for every year (not quarter) from 2021 onwards, calculate the Minority Interest in the income statement section. Following this, in the assumptions section of the IS_BS_CF sheet, calculate the working capital cycle for all years. Finally, in the Formats sheet, populate all valuation ratios part of the Cash Flow table."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n\n在 Work Sheet 工作表中，在可能的情况下计算从 4QFY24 起所有分部的 Occupied Beds（包括季度和年度），然后计算 State 1 部分同一期间的 Occupied Beds 总数。接着对 EBITDA 执行相同任务。随后计算所有期间的 Total Revenues (inc. Other Income) 和 Total EBITDA (inc. Other Income)。之后，在 Consol_annual 工作表中，对 Cash Flow Statement (concise) 的所有组成部分计算 Net Cash，然后在非简明资产负债表部分中，计算所有可计算年份的 capital employed 和 non-cash working capital (excl. debt)。在 Consol_quarterly 工作表中，通过引用另一个选项卡填入 Net Sales 的季度数据，然后计算 Gross Profit 和 Gross Margin，再计算 EBIT 和 Operating Margin。之后，从另一个选项卡引用 Income Tax Expense (Gain)，并计算所有季度的 tax rate (%)。然后在 IS_BS_CF 工作表中，计算每个年份以及任何有数据季度的全部 Total Equity & Liabilities 和 Total Assets；再对 2021 年起的每个年份（不包括季度），计算损益表部分中的 Minority Interest。之后，在 IS_BS_CF 工作表的 assumptions 部分，计算所有年份的 working capital cycle。最后，在 Formats 工作表中，填入 Cash Flow 表中的所有 valuation ratios。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/15_Project KIMS/15_01_KIMS_input.xlsx; keep spreadsheet/15_Project KIMS/15_KIMS_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-15-01."
  - id: "financial-model-15-02"
    label: "财务建模任务（上游 15_02）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\n\nIn the ‘Work Sheet’ sheet, calculate for all years the % of total revenue mix, then for all quarters and years from 4QFY24 onwards, calculate all totals from bed capacity to EBITDA % (where ARPOB stands for ‘average revenue per occupied bed’). From 1QFY22 to 3QFY24, inclusive of the yearly breakdown, fill in, or calculate totals where needed for each, the List of Hospitals & Capacity Beds numbers – For State 1: City 1 has 1000 for each quarter and FY, and City 2 has 200; for State 2: City 3 has 250 for each quarter and FY, and City 4 has 180 for the first 3 quarters and 195 for each subsequent quarter and year, and City 5 has 200; for State 3: City 6 has 350 for each quarter and FY, and City 7 has 434 but has 469 for the last 3 quarters, and City 8 has 250 and City 9 has 200; for State 4: City 10 has 290 for each quarter and FY besides the first quarter, and City 11 has 237 for all but the first quarter and City 12 has 75 but just for from 4QFY22 to 3QFY23, inclusive of FY22; for State 5: it’s 334 from 2QFY23 to 3QFY24 inclusive of FY23). EBITDA (calc) needs to be calculated from 4QFY23 onwards and then EBITDAM (calc) from FY23 onwards."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n\n在 ‘Work Sheet’ 工作表中，计算所有年份的总收入组合占比；然后对从 4QFY24 起的所有季度和年份，计算从 bed capacity 到 EBITDA % 的全部总计（其中 ARPOB 表示 ‘average revenue per occupied bed’）。从 1QFY22 至 3QFY24（包括年度明细），在需要时填入或计算各项 List of Hospitals & Capacity Beds 数字——对于 State 1：City 1 的每个季度和 FY 均为 1000，City 2 为 200；对于 State 2：City 3 的每个季度和 FY 均为 250，City 4 的前 3 个季度为 180，此后每个季度和年份均为 195，City 5 为 200；对于 State 3：City 6 的每个季度和 FY 均为 350，City 7 为 434，但最后 3 个季度为 469，City 8 为 250，City 9 为 200；对于 State 4：除第一个季度外，City 10 的每个季度和 FY 均为 290，City 11 除第一个季度外均为 237，City 12 为 75，但仅适用于 4QFY22 至 3QFY23，且包括 FY22；对于 State 5：从 2QFY23 至 3QFY24 为 334，且包括 FY23。需要从 4QFY23 起计算 EBITDA (calc)，然后从 FY23 起计算 EBITDAM (calc)。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/15_Project KIMS/15_02_KIMS_input.xlsx; keep spreadsheet/15_Project KIMS/15_KIMS_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-15-02."
  - id: "financial-model-15-03"
    label: "财务建模任务（上游 15_03）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\n\nIn the IS_BS_CF sheet, in the income statement section, calculate total employee cost and % of sales just for the quarterly data, from Q4 2023 onwards, then calculate Other expenses and % of sales (but here calculate the quarterly data from Q1 2024 onwards), subsequently calculate total non operating (income) / expense for all years and quarters, and then EPS after exceptional items for all years and quarters. Additionally, from FY2024-FY2027, but not for the quarters, calculate all parts of Equity & Liabilities as well as Assets in the balance sheet section – make sure that the Check section is balanced after all calculations. Then, in the assumptions section, fill in all sections from Repayment/(Taken) onwards for all years where there is no hardcoded data, but don’t populate any quarters, just the yearly data (note: to calculate depreciation from 2024-2027, take it as an average of the current year and the previous year’s gross block and multiply it by the current year’s average depreciation)."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n\n在 IS_BS_CF 工作表的 income statement 部分，仅针对从 Q4 2023 起的季度数据计算 total employee cost 及其占销售额的百分比；然后计算 Other expenses 及其占销售额的百分比（但这里从 Q1 2024 起计算季度数据）；随后计算所有年份和季度的 total non operating (income) / expense，再计算所有年份和季度的 EPS after exceptional items。此外，对 FY2024-FY2027（但不包括季度）计算资产负债表部分 Equity & Liabilities 以及 Assets 的所有组成项目——确保完成所有计算后 Check 部分保持平衡。然后，在 assumptions 部分，对所有没有硬编码数据的年份填入从 Repayment/(Taken) 起的所有部分，但不要填入任何季度，只填年度数据（注意：计算 2024-2027 的折旧时，取本年度和上一年度 gross block 的平均值，再乘以本年度的 average depreciation）。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/15_Project KIMS/15_03_KIMS_input.xlsx; keep spreadsheet/15_Project KIMS/15_KIMS_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-15-03."
  - id: "financial-model-15-04"
    label: "财务建模任务（上游 15_04）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\n\nIn the Consol_annual sheet, calculate (or reference where required) all elements from PBT to EPS Growth (%) for all years. Then, in the Ratios and Growth Analysis section, calculate all elements that are not hardcoded for all years from 2013-2027 – note that for the shares section, for 2023-2027, the numbers for all 5 years should be the same as the last historical year of data. At the end of the tab, calculate the two Check balance lines. In the Consol_quarterly sheet, after referencing for Interest Expenses and Other Non-operating Income (Expense) for all quarters, calculate or reference all elements from PBT to EPS."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n\n在 Consol_annual 工作表中，计算（或在需要时引用）所有年份从 PBT 到 EPS Growth (%) 的全部项目。然后，在 Ratios and Growth Analysis 部分，计算 2013-2027 所有年份中未硬编码的全部项目——注意，对于 shares 部分，2023-2027 这 5 年的数字应全部与最后一个历史数据年份相同。在该选项卡末尾，计算两条 Check balance 行。在 Consol_quarterly 工作表中，在引用所有季度的 Interest Expenses 和 Other Non-operating Income (Expense) 后，计算或引用从 PBT 到 EPS 的所有项目。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/15_Project KIMS/15_04_KIMS_input.xlsx; keep spreadsheet/15_Project KIMS/15_KIMS_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-15-04."
  - id: "financial-model-15-05"
    label: "财务建模任务（上游 15_05）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\n\nIn the Formats sheet, after linking all elements of the first Consolidated Financials table to a different tab, calculate net margin (%) for all historical and forecasted years. Then, in the balance sheet of the Consolidated Financials table, calculate the efficiency ratios and leverage ratios for all years, note that some ratios might require referencing from other tabs as part of their calculation. Also in the Formats sheet, create logical functions below the consolidated Quarterly Result Table that are related to the % change in the following elements of the table: Net Sales, EBITDA, PBT, Recurring PAT, Gross Margin, EBITDA Margin, and PAT Margin. For the outputs of the elements that pertain to 3QFY23 and 2QFY24, the logical function should produce a ‘+’ sign if it’s above 0, and a ‘–’ sign if not. And for the outputs of the elements that pertain to 3QFY24E, the logical function should produce the word ‘ahead’ if it’s above 0, and the word ‘below’ if not. Then, in the Report Tables sheet, link all elements of the Particulars table to the corresponding elements found in the Formats sheet, but for the Cost items as % of sales (including % Change) and the % Change part of the Margin (%) section, calculate the numbers – note: for the % change of those 2 sections, the measurement is ‘bps’."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n\n在 Formats 工作表中，将第一张 Consolidated Financials 表的所有项目链接到另一个选项卡后，计算所有历史及预测年份的 net margin (%)。然后，在 Consolidated Financials 表的资产负债表中，计算所有年份的 efficiency ratios 和 leverage ratios；请注意，某些比率在计算时可能需要引用其他选项卡。仍在 Formats 工作表中，在 consolidated Quarterly Result Table 下方创建与表中以下项目百分比变动相关的逻辑函数：Net Sales、EBITDA、PBT、Recurring PAT、Gross Margin、EBITDA Margin 和 PAT Margin。对于与 3QFY23 和 2QFY24 有关项目的输出，当结果高于 0 时，逻辑函数应产生 ‘+’ 号，否则产生 ‘–’ 号。对于与 3QFY24E 有关项目的输出，当结果高于 0 时，逻辑函数应产生单词 ‘ahead’，否则产生单词 ‘below’。然后，在 Report Tables 工作表中，将 Particulars 表的所有项目链接到 Formats 工作表中对应的项目；但对于 Cost items as % of sales（包括 % Change）和 Margin (%) 部分的 % Change，要计算这些数字——注意：这 2 个部分的 % change 计量单位为 ‘bps’。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/15_Project KIMS/15_05_KIMS_input.xlsx; keep spreadsheet/15_Project KIMS/15_KIMS_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-15-05."
  - id: "financial-model-16-01"
    label: "财务建模任务（上游 16_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Valuation Summary and Football tab, create a football field valuation chart plotting Lower Limit, Base Case, and Upper Limit for each methodology (DCF per Target Estimates, DCF per RGP Projections, DCF per Bear Case, Trading Comps EV/Revenue, Trading Comps EV/EBITDA, Transaction Comps EV/Revenue, Transaction Comps EV/EBITDA). In the Synergies and Intgn Exp tab, calculate Revenue Synergies for FY23–FY27 by aggregating all revenue synergy line items. In the Income Statement sheet, calculate Gross Profit and Gross Profit Margin for FY22–FY27, then link Depreciation & Amortisation from BS_Sch, then create Cash Balance for Reference by linking closing cash from the Balance Sheet. In the Cash Flow tab, calculate the Change in Trade Receivables for FY22–FY27. In the Ratios sheet, calculate ROE for FY22–FY27."
    translation: "根据提供的假设完成财务模型。确保在整个过程中保留模型现有的结构、布局和格式。\n在 Valuation Summary and Football 选项卡中，创建一张足球场估值图，绘制每种估值方法的 Lower Limit、Base Case 和 Upper Limit（DCF per Target Estimates、DCF per RGP Projections、DCF per Bear Case、Trading Comps EV/Revenue、Trading Comps EV/EBITDA、Transaction Comps EV/Revenue、Transaction Comps EV/EBITDA）。在 Synergies and Intgn Exp 选项卡中，通过汇总所有收入协同行项目，计算 FY23–FY27 的 Revenue Synergies。在 Income Statement 工作表中，计算 FY22–FY27 的 Gross Profit 和 Gross Profit Margin，然后从 BS_Sch 链接 Depreciation & Amortisation，再通过链接 Balance Sheet 中的期末现金来创建 Cash Balance for Reference。在 Cash Flow 选项卡中，计算 FY22–FY27 的 Change in Trade Receivables。在 Ratios 工作表中，计算 FY22–FY27 的 ROE。\n完成结果必须满足上述全部要求。"
    run_spec: "Acquire KAKA22/SpreadsheetBench-v2 at commit 9dea60025792fbac5928ce9f44812362dccbeecd and verify archive SHA-256 17147ef9578cd57ce76c9a719d19da7821f3e5cb0d8f776c820f699fdcdb761c. Use input workbook spreadsheet/16_Project Ramjet/16_01_Ramjet_input.xlsx; keep spreadsheet/16_Project Ramjet/16_Ramjet_golden.xlsx and all answer metadata hidden from the tested agent. Pin RUCKBReasoning/SpreadsheetBench-2 at commit 83d415ce87b1d6b8e8eafcc26957f5d13d37210f. After the agent saves its workbook, run the official spreadsheet execution evaluator and record task accuracy using the pinned implementation: round both regression_ratio and modification_ratio to four decimal places, coerce regression_ratio values greater than or equal to 0.998 to 1, and score 1 only when the normalized regression_ratio equals 1 and the rounded modification_ratio equals 1; otherwise score 0. A failed, timed-out, or missing run must remain score 0 in the 321-task manifest under financial-model-16-01."
  - id: "financial-model-16-02"
    label: "财务建模任务（上游 16_02）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Valuation Summary sheet, calculate Terminal Value using the Gordon Growth Model, then calculate Present Value of FCFF by summing all discounted cash flows, then calculate Implied IRR on the complete cash flow series including acquisition outflow and terminal value, then calculate Enterprise Value using the EBITDA method. In the Synergies and Intgn Exp sheet, calculate Total Europe New Headcount for 2023E–2027E by summing individual Europe role costs. In the Income Statement sheet, calculate EBITDA for 2019A–2027E, then calculate Retained Earnings for 2019A–2027E."
