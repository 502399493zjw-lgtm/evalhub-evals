    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the DCF Valuation tab, link the Equity NPV and Equity IRR cells to their respective sensitivity tables. In the Income Statement tab, calculate EBITDA, EBITDA Margin, and Net Income Margin for Aug-23 to Dec-28, then calculate the Tax expense assuming a flat rate of 30% with nil tax where PBT is negative for the same timeframe. In the Balance Sheet, link Trade Payables and Receivables from Working Capital for Jan-23 to Dec-28, then add an assets-equals-liabilities check for all periods. In the Total Working Capital section of the Working Capital tab, calculate Inventory, Payables, and Receivables (adjusted for 70% bills discounting) for Aug-23 to Dec-28, then compute NWC as a percentage of Revenue monthly. In the Dashboard, create a bar graph with a line for Revenue (in millions) and EBITDA % from FY23–FY28 and convert revenue numbers from absolute numbers to millions."
