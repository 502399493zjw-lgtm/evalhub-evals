  - id: "financial-model-18-01"
    label: "财务建模任务（上游 18_01）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Milestones sheet, calculate Cost of Project at each milestone (I to IV) by allocating total project cost based on completion percentage. In the P&L sheet, calculate PAT Margin for FY25–FY39 displaying \"NM\" where Total Income is zero or negative. In the Tax Calculation sheet, calculate Income Tax for FY25–FY39 at 25.17% on positive Taxable Income only, then link results to Tax Expense in the P&L sheet. In the BS sheet, calculate Net Fixed Assets for FY26–FY39, then add a balance sheet integrity check for FY22–FY39 comparing total assets to total liabilities and equity. In the DSCR sheet, calculate Average Cash DSCR across the debt tenor."
