    label: "可视化任务（上游 Task 1423401）"
    prompt: "Create five separate clustered column charts displaying two data series side-by-side: ‘Foo’ and ‘Faa’.\nEach chart should display data for 20 consecutive unique IDs as follows:\nChart 1: IDs 1–20\nChart 2: IDs 21–40\nChart 3: IDs 41–60\nChart 4: IDs 61–80\nChart 5: IDs 81–100\nPlot ‘Foo’ and ‘Faa’ as clustered columns.\nUse the corresponding IDs as the category (X-axis) labels and the Foo and Faa values as the y-axis.\nTitle each chart as 'Unique ID xx-xx Analysis' where the xx values correspond to the range of IDs that correspond to that chart."
    translation: "请根据给定数据创建 5 张彼此独立的簇状柱形图，并排显示 ‘Foo’ 和 ‘Faa’ 两个数据系列。\n每张图表必须显示连续 20 个 unique IDs 的数据，具体如下：\nChart 1：IDs 1–20\nChart 2：IDs 21–40\nChart 3：IDs 41–60\nChart 4：IDs 61–80\nChart 5：IDs 81–100\n将 ‘Foo’ 和 ‘Faa’ 绘制为簇状柱形。\n使用相应 IDs 作为 category（X 轴）标签，并以 Foo 和 Faa 的值作为 Y 轴数据。\n每张图表的标题格式为 'Unique ID xx-xx Analysis'，其中 xx 值对应于该图表所覆盖的 ID 范围。\n完成结果必须满足上述全部要求。"
