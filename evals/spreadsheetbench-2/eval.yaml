  - id: "financial-model-01-02"
    label: "财务建模任务（上游 01_02）"
    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Debt Schedule sheet, calculate interest expense for the forecast period by applying the interest rate from Key Assumptions to the average of opening and closing debt for both secured and unsecured loans, then link the results to Interest Expense in the Income Statement. In the WACC sheet, calculate Cost of Equity using CAPM, then calculate WACC from the weighted equity and debt cost components. In the DCF Valuation sheet, calculate Equity Value, then link it to the sensitivity table. Calculate EV/EBITDA for FY25–FY27, displaying \"NM\" when EBITDA is non-positive. Calculate Present Value for the Terminal Year by applying the Discounting Factor to Adjusted FCFF."
    translation: "根据所提供的假设完成财务模型；完成要求是在整个过程中保留模型现有的结构、布局和格式。\n在 Debt Schedule 工作表中，将 Key Assumptions 中的利率应用于 secured loans 和 unsecured loans 各自期初与期末债务的平均值，以计算预测期的 interest expense；随后把结果链接到 Income Statement 中的 Interest Expense。在 WACC 工作表中，先使用 CAPM 计算 Cost of Equity，再根据加权的 equity cost 和 debt cost 组成部分计算 WACC。在 DCF Valuation 工作表中，计算 Equity Value，再把它链接到 sensitivity table。计算 FY25–FY27 的 EV/EBITDA；当 EBITDA 为非正数时显示 \"NM\"。将 Discounting Factor 应用于 Adjusted FCFF，计算 Terminal Year 的 Present Value。"
