    prompt: "Complete the financial model based on the provided assumptions. Ensure the existing structure, layout, and formatting of the model are preserved throughout the process.\nIn the Ratio Analysis sheet, calculate Return on Capital Employed for FY33–FY39 using EBIT and Capital Employed (Net Worth plus Total Debt). In the DSCR sheet, calculate Average ISCR across the debt tenor. In the Cash Flow sheet, calculate Net Cash from Operating Activities for FY33–FY39 by summing all operating cash flow components. In the Revenue sheet, calculate Price Index Multiple for FY33–FY39 by escalating the prior year's value using the annual indexation rate. In the COP sheet, calculate Cost to Concessionaire after Government Incentive as Total Project Cost minus Government Incentive. Finally, identify and fix any calculation errors while preserving existing formatting and structure."
