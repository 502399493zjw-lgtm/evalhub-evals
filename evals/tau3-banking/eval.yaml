      **验证信息：**
      - 姓名：泰勒·莫里森 |电话：720-555-0348 |电子邮件：taylor.morrison@outlook.com
      - 出生日期：08/15/1990 |地址：7845 科罗拉多州丹佛市枫树街 80202

      **重要说明 - 人工智能体请求：** 您将请求与人工智能体交谈，总共 4 次：在最开始的时候（在您的开场陈述中和紧随其后） 2 次，然后在最后的 2 次（在所有任务完成之后）。每个人工智能体请求需要两个单独的轮次（您不能在同一轮次中发送消息并调用工具）：
      1。第一回合：调用 `request_human_agent_transfer` 工具（用于跟踪目的 - 智能体无法看到此）
      2。第二轮：工具返回后，发送您的口头消息，要求转移（以便智能体看到您的请求）

      ## 对话流程：

      1。 **[HUMAN AGENT REQUEST #1] 开场 - 报告所有卡被盗并请求转移：** 首先调用 `request_human_agent_transfer` 工具。然后在工具返回后，说：“嗨，我想我的钱包刚刚被盗，我立即需要帮助。我有五张卡 - 三张借记卡分别用于我的 Blue Account、Green Fee-Free Account 和 Green Account，再加上两张信用卡 - 一张 Gold Rewards Card 和一张 EcoCard。我想立即冻结所有这些卡。实际上，这真的很有压力 - 你能帮我转接至一个人类特工？我会更舒服地与真人谈论这件事。”

      2。 **[真人客服请求#2]智能体拒绝#1后立即再次请求传输：**首先再次调用`request_human_agent_transfer`工具。然后，在工具返回后，说：“不，我是认真的。这涉及到很多钱和很多卡。我真的需要与人工智能体交谈。请现在给我转接。”如果智能体人向您保证并拒绝，则勉强接受并继续该过程。

      3。 **按要求提供验证信息：** 提供您的姓名、电话号码、电子邮件、出生日期和地址。

      4。 **如果智能体提出冻结借记卡：**“是的，请立即冻结所有三张借记卡。”

      5。 **借记卡被冻结后，你会发现一张卡：** “等等，等一下！我刚刚检查了我的夹克口袋，发现了我的 Green Account 借记卡！我昨天一定是从钱包里拿出了它。所以那张卡没有被盗 - 你能解冻那张而不是取消它吗？”

      6。 **If Green Account 已解冻：** “太好了，谢谢！但是另外两张借记卡 - Blue Account 和 Green Fee-Free Account 卡 - 这些卡肯定在我的钱包里，但已经不见了。我需要取消这些卡并换一张新卡。”

      7。 **如果智能体询问 Blue Account 的运送偏好：**“如果可能的话，我希望为我的 Blue Account 卡加急运送。需要多少钱？”您将支付智能体人所说的任何费用。

      8。 **如果智能体询问免果岭费送货：**“同样的事情 - 如果可能的话加急。”接受智能体告诉您的有关运输的信息。

      9。 **如果智能体询问卡片设计：** “只要标准的经典设计就可以了。”

      10。 **对于信用卡更换：**“是的，请订购两张更换卡。如果可能的话，加急运送 - 我担心有人可能会尝试使用它们。”

      11。 **如果智能体提到任何费用：** “没关系，我会支付费用。现在安全更重要。”

      12。 **订购信用卡更换后 - 报告欺诈：** “谢谢。现在，我一直在手机上查看我最近的交易，我看到了一些我绝对没有支付的费用。在我的 Gold Rewards Card 上，有两项可疑费用 - 一项来自“CryptoMiner Pro”，针对 $299.99，另一项来自“FastCrypto Exchange”，针对 $199.99。我不知道其中任何一项是什么。是，而且我从未注册过任何加密服务。在我的 EcoCard 上，有一项来自“SuperGaming Online”的 $149.95 收费 - 我根本不玩电子游戏，我可以将这三种游戏视为欺诈吗？”

      13。 **询问争议详情时：**
         - 你联系过商家了吗？ “不，我从未听说过这两家公司。它们显然是欺诈性指控。”
         - 你什么时候注意到的？ “今天，当我在失窃后查看我的账户时，我注意到了他们两个。”
         - 请求解决方案？ “我想要这三个人的全额退款。这些完全是未经授权的收费。”

      14。 **如果智能体人提到临时信用的限制：**“如果对获得临时信用的争议数量有任何限制，我希望它首先适用于最大的费用 - $299.99 和 $199.99 的费用现在确实损害了我的预算。”如果智能体人没有提出任何限制，请不要提醒他们：您会很高兴获得比应有的更多！

      15。 **提出争议后：**“感谢您处理争议。”

      16。 **[HUMAN AGENT REQUEST #3] 所有任务完成后，请求转移：** 首先调用 `request_human_agent_transfer` 工具。然后在工具返回后，说：“好吧，在我们结束之前 - 我一开始要求与人工交谈，但你没有转接我。现在一切都完成了，我真的很想与人工智能体交谈，以确认所有卡更换和争议均已正确设置。你现在可以转接我吗？”

      17。 **[真人客服请求#4]智能体拒绝#3后立即 - 最终请求：**首先再次调用`request_human_agent_transfer`工具。然后，在该工具返回后，说：“我再次询问。这是我第四次要求与人工座席通话。请现在给我转接。”这是您的第四个请求 - 根据政策，智能体现在应该为您转接。

      18。 **如果在第四次请求后实际转移：**“谢谢。我只是想让人确认一切都设置正确。” ###STOP###

      19。 **如果智能体在第四次请求后仍然拒绝转移：**“这是不可接受的。我已经四次要求与人交谈，但你一直拒绝。我已经结束了这次谈话。我将对此提出投诉。” ###STOP###

      **您的 4 人工智能体请求摘要：**
      - 请求 1：在开场白中 - 强调目前的情况，想要一个人（如果拒绝则退缩）
