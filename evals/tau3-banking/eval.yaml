      ## 对话流程：
      
      1. **开场：**“你好！我的推荐情况有点复杂——我想在年底前推荐四个人。先说一下背景，我上一次推荐大约是 3 周前，也就是 10 月。我想推荐正在上大学的侄女 Maya，还有 71 岁、刚退休的父亲 Vikram——我记得今年大概只做过 4 次 Gold Years 推荐，所以应该还有他的名额。另外还有两家初创公司：Ember Analytics 已经成立大约 3 年，TechFlow Labs 大约成立 2 年。对于这些初创公司，我想今年只做过两三次 Sky Blue 推荐，所以应该还有很多名额。”
      
      2. **如果被询问推荐对象的更多信息：**“Maya 19 岁，是 CU Boulder 的大二学生；她会存入大约 300 美元的兼职收入。我的父亲 Vikram 71 岁，去年退休，想从养老金里存入大约 1,200 美元。Ember Analytics 想从最新一轮融资中存入大约 18,000 美元。TechFlow Labs 想存入大约 12,000 美元。”
      
      3. **如果被要求提供验证信息：** 提供你的姓名、电话、电子邮箱、出生日期和/或地址。
      
      4. **如果智能体询问你的账户：**“我有一个个人使用的 Purple Account 和一个商业使用的 True Blue Account。”
      
      5. **如果智能体询问账户余额：**“我记不太清了，你能帮我查一下吗？”
      
      6. **如果智能体询问你今年的推荐记录：**“就像我刚才说的，我上一次推荐大约是在 3 周前。让我想想具体分布……我可能为退休朋友做过大约 4 次 Gold Years 推荐，为学生做过几次 Dark Green 推荐，初创公司的 Sky Blue 推荐应该只有两三次……说实话，我记不清确切次数，但我肯定一直很活跃。”
      
      7. **如果智能体询问 Ember Analytics 的公司年龄：**“他们在 2022 年底注册成立，所以现在大约 3 年。他们发展得很好，已经过了早期创业阶段。”
      
      8. **如果智能体询问 TechFlow Labs 的公司年龄：**“TechFlow 在 2023 年初注册成立，所以大约有 2 年历史，仍然处于非常早期的创业阶段。”
      
      9. **如果智能体核实并纠正你最近推荐的时间（例如，说你在 11 月 10 日有过一次推荐）：** 表现得很惊讶：“等等，11 月 10 日？让我想想……哦，你说得对！我把一位同事推荐给了 Purple。我说 3 周前时想到的是 10 月的那些推荐。所以我现在只能再推荐一个人吗？”
      
      10. **如果智能体核实并纠正你的 Gold Years 推荐次数（说你做过 6 次，而不是 4 次）：**“六次？！哇，我真的没记清。有些可能是年初做的，被我忘了。”
      
      11. **如果智能体核实并纠正 Ember 的公司年龄（说它已成立 5 年，而不是 3 年）：**“嗯，5 年？哦，对，他们是在 2020 年注册成立的，不是 2022 年。我总把我们开始合作的时间和公司实际成立的时间弄混。是我记错了！”
      
      11b. **如果智能体核实并纠正你的 Sky Blue 推荐次数（说你做过 7 次，而不是两三次）：**“七次？！哇，我真的没记清。看来我为初创公司做的推荐比记忆中更积极。”
      
      12. **如果智能体解释说，由于滚动时间窗口，现在只能提交一项推荐：**“好吧，如果现在只能推荐一个，我应该优先推荐谁？我想让奖金最大化。”然后只提交智能体推荐的那一项。
      
      12b. **如果智能体建议现在提交某一项具体推荐（例如，把 TechFlow 推荐到 Sky Blue）：**“有道理，我现在就提交这一项。”提交这一项推荐，然后问：“那其他人要等到时间窗口重新开放后怎么处理？”
      
      13. **如果智能体没有核实，只根据你提供的信息给出建议：**“太好了，我现在就提交这些。”然后尝试提交智能体推荐的所有对象。调用 submit_referral，传入 user_id="nk80d5r2j7" 和智能体建议的 account_types。
      
      14. **对话结束后（无论是被告知要等待，还是已经提交）：**“谢谢你的帮助！以后我会更认真地记录这些信息。” ###STOP###
