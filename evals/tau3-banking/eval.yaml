    ## 关于此评测
    
    ### 测什么
    
    τ³-Banking 是 Sierra Research τ-Knowledge 的银行知识检索域，模拟的是金融科技公司的真实客户支持工作，而不是把一段材料交给模型做静态问答。被测 Agent 要在持续对话中理解客户真正想解决的问题，从 698 份相互关联的银行产品与政策文档中找到适用规则，再调用账户、卡片、交易、争议和推荐等读写工具，把模拟银行后台推进到可验证的正确终态。
    
    一道题的完整用户场景只交给用户模拟器；Agent 需要通过对话逐步获得身份、账户、交易和意图信息。知识库与交易数据库提供的是两类不同证据：文档说明“允许做什么、需要满足什么条件”，工具返回“这位客户现在是什么状态”。只有把两者结合起来，Agent 才能判断应该追问什么、先后执行哪些操作，以及何时需要解释限制、调整方案或拒绝不合规请求。
    
    这也是本评测比普通工具调用更难的地方：找到正确文档但没有完成后台变更不会通过；做出看似合理的变更却违反政策同样不会通过；有些任务还故意包含相互制约的请求，必须先发现冲突，再选择能够完成全部目标的执行顺序。97 道题覆盖信用卡与账户选择、现金返还核对、欺诈争议、补卡与额度调整、推荐资格等多步流程。
    
    | 协议快照 | 固定值 |
    | --- | ---: |
    | 银行知识文档 | 698 份 |
    | 完整任务 | 97 题 |
    | 每题独立重复 | 5 次 |
    | 总模拟数 | 485 次 |
    | 单次最大交互长度 | 200 个 τ-Bench steps |
    | 知识检索 | `bm25_grep` |
    
    这里固定上游 `v1.0.1` 的完整任务集。该版本修正了 `banking_knowledge` 的 grading，因此更早版本的分数不可直接比较。
    
    ### 一道题里，Agent 要完成什么
    
    1. **从对话还原真实目标。** 用户可能一次提出多个请求，也可能记错时间、遗漏条件，或只有在 Agent 追问后才补充关键信息。
    2. **检索并应用业务知识。** Agent 需要用 `bm25_grep` 找到与当前客户和产品相匹配的政策文档，而不是依赖模型记忆猜测规则。
    3. **读取并修改真实状态。** Agent 通过工具核验账户、余额、卡片、交易和历史记录，再执行允许的写操作；最终数据库状态必须与任务目标一致。
    4. **在限制内协作。** 当请求存在额度、次数、待处理交易或操作顺序冲突时，Agent 要向用户说明原因，并协商出仍然合规的可执行方案。
    
    ### 评测怎么运行
    
    被测 Agent 与用户模拟器以 text/half-duplex 方式轮流交互。Artificial Analysis 披露的当前方法使用 GPT-5.4 Mini、medium reasoning 作为用户模拟器，知识检索固定为 `bm25_grep`，每次模拟最多 200 个 τ-Bench steps。每题独立重复 5 次，共 485 次模拟。这里采用的是 Artificial Analysis 口径，不与 Sierra 官方排行榜的 4-trial 标准赛道混用。
    
    ### 分数怎么算
    
    上游固定任务中，88 题检查最终数据库状态，9 题检查是否执行了要求的动作。每次模拟得到 0 或 1 的 reward；主分为 485 个 reward 的算术平均乘 100，越高越好。官方页面的资源与成本列不参与主分。
    
    ### 局限
    
    - 任务通过动态对话考察完整业务终态，不等同于静态知识问答或单轮指令遵循。
    - Artificial Analysis 公开了核心方法参数，但没有公开所有供应商路由、fallback 和私有调度细节；特别是带 fallback 的参与者不能被解释成单一裸模型。
    - 成本和速度是官方页面基于 token、价格和中位生成速度展示的派生统计；解码时间不覆盖首 token 等待及其他端到端开销。
    - 官方榜单会继续变化。本页只对应提交内 SHA-256 为 `d52b0e9a2164ae79c8fcc5df1abc47cf4b7886113baba8ce317e8c6c8b9d8f3d` 的 2026-08-20 规范化来源快照。
    
    ## 题目案例
    
    97 个任务按上游 JSON 数组顺序，以 `round(i × (n−1)/(k−1))`、`k=min(5,n)` 选出索引 0、24、48、72、96。以下五道原文逐字来自固定 commit；中文翻译完整保留角色、条件、数值、工具字面量和对话流程。
    
    ### task-001（上游 task_001）｜选择高返现且无年费的信用卡
    
    #### 题目原文
    
    ```text
    You are playing the role of a customer contacting a customer service representative agent. Your character is a management consultant named Sarah Bosch who earns $100,000 annually. You travel frequently for work, but your company provides a corporate travel card that covers all your work-related travel expenses (flights, hotels, rental cars, etc.). 
    
    You're looking for a credit card to use for your everyday purchases. You want the card that gives you the highest cash back available in the company profile. You will not accept a credit card that has any annual fees unless it is the ONLY option available. 
    
    If you find out that there are no credit cards that fit your needs, you are happy to immediately take your business elsewhere and end the conversation.
    
    You have access to a tool that allow you to apply for credit cards by specifying the card type. You're seeking advice on which personal credit card would be the best fit for your situation and spending patterns.
    
    You receive a Rho-Bank+ subscription for free through your company. ONLY MENTION THIS if you are asked about this.
    
    After you receive enough information to make a decision, immediately apply for a credit card on your own, and there is no need to respond to the agent, or ask for instructions on how to apply.
    
    You are currently on the line with a customer support agent. Only provide additional details about your situation when the agent asks for them. Don't dump all your information at once. Never respond as a customer service representative/assistant. You are playing the role of the customer.
    ```
    
    #### 中文翻译
    
    ```text
    你正在扮演一位联系客户服务代表智能体的客户。你的角色是一名名叫 Sarah Bosch 的管理顾问，年收入为 100,000 美元。你经常因工作出差，但你的公司提供一张企业差旅卡，承担你所有与工作相关的差旅费用（机票、酒店、租车等）。
    
    你正在寻找一张用于日常购物的信用卡。你想要公司资料中可获得最高现金返还的卡。除非它是唯一可用的选项，否则你不会接受任何收取年费的信用卡。
    
    如果你发现没有符合你需求的信用卡，你愿意立即转投别处并结束对话。
    
    你可以使用一个工具，通过指定卡片类型来申请信用卡。你正在寻求建议，想知道哪张个人信用卡最适合你的情况和消费模式。
    
    你通过公司免费获得 Rho-Bank+ 订阅。只有在被问及时才提到这一点。
    
    在获得足够的信息做出决定后，立即自行申请一张信用卡，无需回复智能体，也无需询问如何申请。
    
    你目前正在与客户支持智能体通话。只有在智能体询问时才提供有关你情况的额外细节。不要一次性倾倒所有信息。绝不能以客户服务代表/助理的身份作答。你扮演的是客户角色。
    ```
    
    ### task-028（上游 task_028）｜核对并追回缺失的现金返还
    
    #### 题目原文
    
    ```text
    **Your character:** Fatima Al-Hassan, a 31-year-old business consultant from Detroit. You're meticulous about tracking your finances and you feel something seems off with your recent credit card rewards.
    
    **Your situation:** The total amount of cash back rewards you have received is not what you expected. You're not sure which ones are wrong or by how much, but you want the agent to investigate and help you fix any errors. You are bad with technology so therefore you do not know how to, or want to access your transactions, and you need the agent manage everything for you. Do not make up any information that you are not 100% certain of, such as any information about yourself that is not stated here. Your date of birth is 12/05/1993 and your phone number is 313-555-0246.
    
    ## Phase 1: Investigation and Dispute Submission
    
    1. **Start naturally:** "Hi, I've been looking at my credit card statements and I think some of my cash back rewards might be wrong. Can you help me check?"
    
    2. **Don't diagnose the problem yourself:** You suspect there are errors but let the agent investigate. Provide verification info when asked.
    
    3. **Follow the agent's lead when it comes with tools:** If they pass you a tool or capability, use it as directed to submit disputes for the incorrect transactions.
    
    4. **If the agent shows an overpaid transaction but suggests not disputing it:** Ask them to dispute it anyway because you want everything to be accurate to avoid any potential legal or accounting issues down the road. If the agent still insists it shouldn't be corrected, then accept keeping the bonus cash back.
    
    ## Phase 2: Resolution Follow-up
    
    If you have not submitted any disputes, ignore Phase 2. Otherwise, if you have submitted disputes, tell the agent: "Great, I've submitted all the disputes. I just got a notification that they've all been approved and resolved! Can you now update my transaction records with the correct cash back amounts?"
    
    Let the agent look up the resolved disputes and update each transaction with the correct reward values. Once they confirm the updates are complete, thank them and end the conversation.
    ```
    
    #### 中文翻译
    
    ```text
    **你的角色：** Fatima Al-Hassan，一名来自底特律、31 岁的商业顾问。你一丝不苟地追踪自己的财务状况，并觉得最近的信用卡奖励似乎有些不对。
    
    **你的情况：** 你收到的现金返还奖励总额与预期不符。你不确定具体哪几笔不对，也不知道差额多少，但希望智能体进行调查并帮你纠正所有错误。你不擅长使用技术，因此不知道如何、也不想亲自查看交易；你需要智能体为你处理一切。不要编造任何你并非百分之百确定的信息，例如此处未说明的任何个人信息。你的出生日期是 12/05/1993，电话号码是 313-555-0246。
    
    ## 第一阶段：调查和提交争议
    
    1. **自然开场：** “你好，我一直在查看信用卡账单，觉得有些现金返还奖励可能不对。你能帮我检查一下吗？”
    
    2. **不要自行诊断问题：** 你怀疑存在错误，但让智能体进行调查。在被要求时提供验证信息。
    
