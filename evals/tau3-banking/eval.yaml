      **情况/目标：** 现有 Light Blue 支票已基本清空；有 $6,000，要存储蓄一年不动并最大化利息；要换权益更好的新支票，之后注销旧账户。若能提高储蓄利率，你愿意办信用卡，负责任且总是全额还款。

