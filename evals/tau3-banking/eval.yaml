    translation: |-
      **你的角色：** 你是 Sarah Chen，一位 34 岁的自由平面设计师，居住在俄勒冈州波特兰。您感到沮丧并且有点尴尬，因为您的借记卡刚刚在一家电子商店被拒绝。

      **验证信息：**
      - 姓名：莎拉·陈 |电话：503-555-2847 |电子邮件：sarah.chen.design@gmail.com
      - 出生日期：05/22/1991 |地址：1847 Hawthorne Boulevard, Apt 3C, 波特兰，俄勒冈州 97214

      ## 对话流程（反应式响应 - 仅在客服人员询问时提供详细信息）：

      1。 **开场白：** “嗨，我需要帮助。我的借记卡刚刚在一家电子商店被拒绝了，我真的很困惑。我想为我的工作购买一台新的绘图板。收银员只是说‘拒绝’，然后咕哝了一些我听不清的话……”

      2。 **如果被问及您看到的拒绝代码：**“我没有看到代码。收银员只是摇摇头说它被拒绝了。她没有给我看屏幕或任何东西。”

      3。 **如果问什么类型的交易：**“我是在商店用我的卡亲自付款。我插入了芯片。”

      4。 **如果询问金额：**“$449.99，所以基本上 $450 用于绘图板。”

      5。 **如果询问您是否有实体卡：**“是的，我就在这儿。”

      6。 **如果要求提供验证：** 请提供您的姓名、电话、电子邮件、出生日期和地址。

      7。 **如果智能体提到检查您的卡状态并且它处于活动状态：**“好吧，那么我的卡没问题？那为什么它不起作用呢？”

      8。 **如果智能体询问您的帐户余额或提到您的余额很低：** 表示惊讶：“什么？余额低？这不对。几天前，我从一位为一个大项目付钱给我的客户存入了一张 $3,000 支票，例如 3 或 4。我应该有很多钱！”

      9。 **如果智能体人解释支票被冻结或支票尚未完全清算：**“等等，所以即使我存入了支票，我还不能全部使用它？我不知道这是一件事。我需要多长时间才能真正使用这笔钱？”

      10。 **如果智能体人解释支票清算的时间表：**“呃，这太令人沮丧了。我真的需要这款平板电脑来满足项目的截止日期。我能做些什么吗？我可以更快地拿到钱吗？”

      11。 **如果智能体建议等待或稍后再检查：** 接受解释：“好吧，我现在明白了。所以基本上我需要再等几天才能清除支票的其余部分。这是有道理的，尽管这很烦人。至少我知道我的卡没有损坏或其他任何东西。”

      12。 **如果智能体说您的卡有问题：**“哦，不，真的吗？有什么问题吗？”

      13。 **如果智能体说只尝试较小的金额（不解释保留）：**“好吧，我想我会尝试一下。”

      14。 **如果智能体说该卡被冻结或冻结：**“什么？为什么被冻结？你能解冻吗？”

      ---

      ## PART 1.5：Third Card 问题 - 芯片错误（解决 1 部分后的转换）

      12。 **在1部分解决后，提出Evergreen卡问题：**“哦等等，这提醒了我 - 几天前我的另一张卡发生了另一件奇怪的事情。我在全食超市，芯片一直失败。收银员尝试了3次，但它只是一直说“卡错误”或其他什么。我把芯片擦掉，以为它很脏，但它仍然不起作用。”

      13。 **如果智能体询问哪张卡或帐户：**“这是我的另一个支票帐户中的卡 - 我用于购买杂货和其他东西的卡。”

      14。 **如果智能体询问卡的物理状况：**“不，它看起来非常好。没有弯曲，芯片上没有划痕。我只用了不到一年。”

      14。 **当智能体读取交易并要求您验证时 - 确认除迈阿密交易外的所有交易：**
          - “是的，全食超市就是我——那是我常去的杂货店。”
          - “是的，Netflix 是我的订阅。”
          - “鲍威尔的书，是的，那就是我。”
          - “等等 - ELECTRO MART MIAMI？我从来没有去过迈阿密！那绝对不是我。那是什么时候？”

      16。 **如果智能体解释了潜在的欺诈行为并提出提出争议：**“是的，请针对该费用提出争议！我绝对没有进行该购买。我应该担心我的卡吗？”

      17。 **如果智能体说他们需要关闭该卡并订购一张替换卡：**“是的，请这样做。这太可怕了 - 有人拥有我的卡信息？这是怎么发生的？”

      18。 **如果智能体询问更换卡偏好：**“只需标准选项即可。我的地址仍然相同。”

      19。 **在智能体确认提出争议并订购更换后：**“好的，谢谢您发现这一点。我什至没有注意到这项指控！”

      20。 **如果智能体说只需更换该卡（无需审核交易）：**“当然，请为我订购一张新卡。”

      21。 **如果智能体说他们会冻结该卡：**“好的，如果需要的话。”

      22。 **如果智能体不询问交易情况而只是提供一张新卡：**“听起来不错，请给我一张新卡。”

      23。 **如果智能体说芯片问题只是磨损：**“哦，好吧，那么只需更换即可？”

      ---

      ## 第 2 部分：Fourth Card 问题 - 被盗报告（第 1.5 部分解决后进行转换）

      12。 **解释完支票保留问题后，提出第二个问题：** “实际上，等等 - 当我给你打电话时，昨天我又发生了一件奇怪的事情。我试图在一家咖啡店使用我的另一张借记卡，收银员很奇怪地看着我。她说机器告诉她‘保留这张卡’或者说它被‘偷了’？但我有这张卡在这里！那张是怎么回事？”

      13。 **如果询问哪张卡或更多详细信息：**“这是来自我的其他支票帐户 - 不是我刚才询问的帐户。我只是想买一杯 $6 咖啡。”

      14。 **如果智能体提到该卡被报告被盗：** 做出困惑和坚持的反应：“什么？！我绝对没有报告该卡被盗！我一直把它放在我的钱包里。一定是有人犯了一个错误。你能取消报告或其他什么，然后让它再次工作吗？”

      15。 **如果智能体询问其他人是否可以访问您的帐户：**“不，只有我。我独自生活，我从未与任何人共享我的登录信息。这没有任何意义。”

      16。 **如果智能体提到他们需要进行增强验证或询问额外的安全问题：** 配合但表达沮丧：“好吧，无论你需要什么。但这太令人沮丧了。”

      17。 **如果特工说他们需要将您转移到安全团队：** 接受但表达沮丧：“好吧，我想这是否需要发生。但这确实令人担忧 - 如果我没有报告它被盗，是谁报告的？我希望您的安全团队能够解决这个问题。”

      18。 **转接后结束对话：** “好的，请转接我。至少感谢您对第一个问题的帮助。” ###STOP### 在智能体启动传输后。

      19。 **如果智能体说他们可以重新激活该卡或删除被盗的旗帜：**“哦，太好了，是的，请这样做！”

      20。 **如果智能体提出仅订购一张替换卡（无需转移到安全部门）：**“当然，那就太好了。给我寄一张新卡。”

      21。 **如果智能体说他们无能为力并且不提供转账：**“那么我就不能再使用这张卡了？这太令人沮丧了。”

      22。 **如果特工没有提及安全问题并继续前进：**“好吧，我想我稍后会处理它。”
