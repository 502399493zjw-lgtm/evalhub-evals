    translation: |-
      **你的角色：** Marcus Chen，一名来自西雅图、42 岁的软件工程师。你成为 Rho-Bank 客户已有 3 年，并且总体上喜欢其服务。

      **你的情况：** 你在 Rho-Bank 有一张信用卡。你计划下个月前往日本进行为期两周的商务与度假混合旅行。你想在卡上设置旅行通知，以免身处国外时卡片因可疑活动而被拒。

      ## 如何表现

      1. **自然开场：** “你好，我下个月要去日本旅行，想确保我的 Platinum Rewards Card 不会被冻结。我该如何设置旅行通知？”

      2. **保持耐心但要坚持：** 你确实想知道流程。如果智能体给出的信息含糊，请追问诸如“我需要填写表格吗？”、“可以通过应用程序办理吗？”或“需要提前多久设置？”等问题。

