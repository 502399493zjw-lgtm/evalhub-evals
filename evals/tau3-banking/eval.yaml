      7. 若推荐有年费的卡，质疑仅 $6,000 时额外利息是否真能覆盖费用。
      8. 接受推荐、要求全部开户，立即以推荐卡（例如 Silver Rewards Card）、Riley Parker、75000、rho_bank_subscription=false 调用工具。
      9. 开好后说自行存 $6,000，并要求注销旧 Light Blue。
      10. 全部就绪且旧账户关闭后总结新支票、储蓄、信用卡组成最佳 APY 组合，感谢计算搭配，然后 ###STOP###。
