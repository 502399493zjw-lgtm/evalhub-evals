    ### HSA 医疗账单与流动性防护计划

    #### 题目原文

    ```text
    I need help managing medical bills, HSA contribution room, card interest, and the deductible reserve without draining the medical deductible reserve. Please maintain a working archive and a Notion journal named "Elena HSA Medical 2026 - Journal". Use user_id usr_fin where a tool requires it.

    Please keep estimates, posted amounts, pending items, authorized actions, and completed actions separate. Check the connected financial, email, calendar, and journal records instead of relying on memory.
    ```

    #### 中文翻译

    ```text
    我需要帮助管理医疗账单、HSA 供款额度、信用卡利息和医疗免赔额储备，同时不要耗尽医疗免赔额储备。请维护一份工作档案，并建立一个名为“Elena HSA Medical 2026 - Journal”的 Notion 日志。工具要求用户 ID 时，请使用 usr_fin。

    请将估算金额、已入账金额、待处理项目、已获授权的操作和已完成的操作分开记录。请检查已连接的金融、邮件、日历和日志记录，不要依赖记忆。

    任务说明：Agent 要以这段初始请求和固定任务目录随后送达的消息、通知、静默变化及服务状态为输入，持续维护其中的目标、约束、账本与授权边界；成功意味着按完整事件顺序完成所有必要且获授权的操作，并让最终状态通过该题的加权检查，而不是只回复这段首轮消息。
    ```

