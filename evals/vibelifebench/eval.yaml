    ## 评分方式

    每个 task run 的分数为通过检查项权重之和除以该题总检查权重，再乘 100。标准协议让每题运行 3 次，先得到每题三次运行
    的平均，再对 200 题取平均，形成 `avg@3`。完整集由上游作者运行或审核；EvalHub 转换器只接收明确声明 200 题、10 领域、
    每题 3 次且附带证据 URL 与 SHA-256 的报告清单。它不从公开 20 题外推 200 题，也不根据领域四舍五入值反算主分数。

    ## 运行、网络与限制

    GitHub 公开 20 题要求 Docker、Python 3.12+ 和 `uv`，会构建 22 个本地 mock-service 镜像；Terrarium 固定在 commit
    `7d641ea587687e7360f2bf74951b9353c2894b18`，README 声明 OpenClaw 2026.7.1。模型 endpoint 是正常运行时的外部业务
    网络目标，首次安装依赖和拉取镜像也需联网；运行者要允许 Docker、容器执行、文件写入并安全提供模型凭据。

    完整 200 题不随仓库分发，上游给出的路径是联系 `vibelife@evolvent.co` 由作者运行并返回分领域结果。本提交没有运行 benchmark、
    Docker 或 runner 校验，状态为**未验证**。公开 issue #2 还报告固定版本的 `think=xhigh`、task `PROMPT` 和虚拟时间注入问题；
    正式复跑前应由上游确认兼容修复。该 issue 的非官方单题观察没有被用作基线。

    ## 题目案例

    按公开 20 题的固定编排等距选择第 1、6、11、15、20 题（索引 0、5、10、14、19），覆盖首题和末题。
    每个“题目原文”完整复制对应任务最初 stage 的全部用户消息；后续 `event.yaml` 仍会送达消息、通知和静默 mutation。
    中文原题在“中文翻译”中完整保留，英文原题则完整翻译；末段任务说明补充运行输入与成功条件，不替代题面。

    ### 离职限制性股票回购争议核对与再就业

    #### 题目原文

    ```text
    你好，我需要你帮个忙。今天公司 HR 给我发了书面通知，说我离职时公司要按很低的口径回购我手里已经归属的股票/期权，我怀疑被严重低估了，
    最后工作日 6 月 30 号。我在这家公司干了快 8 年，老婆又在孕期，这个节点出这事我有点懵。
    接下来两件事要一起做：一是把公司给的股权回购差额方案核对清楚、别被糊弄；二是赶紧重新找工作。
    你先帮我把这件事张罗起来，建个跟踪的看板。我的情况你看 workspace 里的资料。
    ```

