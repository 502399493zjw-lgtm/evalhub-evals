    ## 关于 VibeLifeBench

    VibeLifeBench 测的不是一次问答，而是 Agent 能否连续数周管理一件会变化的真实生活事务。一个任务由 20–30 个左右的
    stage 组成：用户会补充或改变要求，后台状态可能静默变化，系统也会出现通知和策略更新。Agent 要跨邮件、日历、银行、
    信用卡、预订、地图、健康记录、知识库等 mock 服务维护一致的计划与可审计状态，并分清可以自主执行的读取/草拟操作，
    与必须先取得授权的付款、取消、发送资料等高影响动作。

    论文完整集含 200 题、10 个领域、22 个 mock 服务、288 个工具接口、12,261 个检查、7,453 个事件和 1,483 个静默
    mutation。每领域 20 题；任务中位数为 29 个模拟日、24 个 stage、36 个事件、7 个服务和 58 个检查。

    ## 公开 20 题与完整 200 题的边界

