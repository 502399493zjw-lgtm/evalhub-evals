  resources_note: 公开资料只用于展示作者发布的方法与最终成绩；精确新版协议以本目录携带的题面、数据和摘要为准。EvalHub CLI 只负责 fetch/pack，不支持一键 run。
  resources:
    - title: 葬AI Benchmark 当前榜单
      summary: 当前 release 的 16 模型最终主榜、用时、调用、成本与性价比数据来源；本条目不展示逐轮数据。
      url: https://funeralai.cc/test/
    - title: 葬AI Benchmark 方法说明
      summary: 新版知识图谱任务的 11 项权重、失败记零、十轮口径、稳定性和成本边界说明。
      url: https://funeralai.cc/test/methodology/
    - title: 历史公开框架仓库
      summary: 作者早期公开的通用 Benchmark 框架；其代码早于本次新题，只用于项目历史与作者归属，不定义本次协议。
      url: https://github.com/FrichXi/personal-work-benchmark
tasks:
  - id: graph-engineering-v2
    label: 葬AI Web4 知识图谱探索器
    prompt: |-
      你是一名前端开发专家。请在当前工作目录实现一个「葬AI Web4」知识图谱探索器。

      输入材料只有：`data/graph.json`。请完整使用其中的节点和关系数据，不要依赖网络，不要读取 benchmark-next 目录或其他原始项目目录。

      要求：

      1. 首屏就是可用的知识图谱探索器，不需要文章列表、文章详情、排行榜、主题切换或其他网站页面。
      2. 图谱必须展示输入数据中的完整节点和关系，并且用户能够看出不同节点类型。
      3. 用户可以搜索节点、按类型筛选、缩放/拖拽图谱、点击节点查看节点信息和相邻关系，并能清空搜索和恢复初始状态。
      4. 交互应在本地静态服务下工作，不依赖网络请求；完成后提供最简单的本地预览方式。
      5. 最短路径查询：提供两个节点输入与查询触发，输入接受节点 id；计算并显示两点间无向、无权的最短路径节点序列，并在图上高亮该路径。图不是全连通的：两点相同、两点不可达、输入不存在的节点这三种情况必须给出明确提示且不崩溃。
      6. 统计榜单：展示按节点 degree 字段排序的度数 Top10 榜单（名称与 degree 值）、四类节点的数量、16 种关系类型（关系的 type 字段）各自的精确数量；点击榜单条目能在图上定位对应节点。
      7. 为便于自动化验收，请给以下控件标注 data-bench 属性（仅此契约，其余结构完全自由）：
         - 路径查询的两个输入框分别为 data-bench="path-source" 与 data-bench="path-target"，触发控件为 data-bench="path-run"，结果容器为 data-bench="path-result"；每次查询后在结果容器上设置属性 data-bench-path-status，取值 ok（找到路径）/ unreachable（不可达）/ same（两点相同）/ invalid（输入无效）；status 为 ok 时，结果容器内按路径顺序放置带 data-bench-path-node="<节点id>" 属性的元素（含起点和终点）。
         - 度数榜单容器为 data-bench="stats-top"，其中每行带 data-bench-node-id 与 data-bench-degree 属性；节点类型计数容器为 data-bench="stats-types"，每项带 data-bench-type 与 data-bench-count 属性；关系类型计数容器为 data-bench="stats-relations"，每项带 data-bench-relation 与 data-bench-count 属性。

      除第 7 条的标记契约外，不要指定或假设某个前端框架、图谱库、布局算法、路由结构或 DOM 结构。请把产物写入当前工作目录，并写一份简短的 README.md 说明预览命令。
    translation: 题目原文已为中文，无需另行翻译。
    run_spec: >-
      每轮在干净工作目录创建 data/graph.json（sha256 f83313f6e50b2f1bb809c9c1fc0de2217c437e33b1fa417b571b6527b7df988e），
      使用锁定题面（sha256 cd7c9074d60e342fd877f70253444dc0fe278897fc6e20715800e67a336eef9c）与 OpenCode 1.17.9。
      Agent 完成后用 Playwright 1.61.1 + Chromium 和作者评分器 3.1（源码 sha256 6f773714090a5a1da48d15fb493f0d7dd08aa6d5a6b8944988846cee3b115828）验收。
      同一模型独立运行 10 轮；失败、超时或无产物记 0，主分数为十轮平均并四舍五入到两位小数。
